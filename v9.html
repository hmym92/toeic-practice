<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Quick Practice v9</title><style>body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#17212b}.app{max-width:620px;margin:auto;background:white;min-height:100vh}header{background:#13263d;color:white;padding:20px}main{padding:16px}button{width:100%;padding:15px;margin:6px 0;border-radius:12px;border:1px solid #d8dfe6;background:white;font-size:16px;text-align:left}.menu{background:#13263d;color:white;border:0;text-align:center;font-weight:bold}.sub{background:#edf1f4}.card{border:1px solid #d8dfe6;border-radius:16px;padding:16px}.q{font-size:18px;line-height:1.7;margin:14px 0}.small{font-size:13px;color:#687584}.ok{background:#e6f7ed}.ng{background:#fff0f0}.box{padding:13px;background:#f4f7fa;border-radius:12px;margin-top:10px;line-height:1.7}.tip{background:#fff8df;padding:13px;margin-top:10px;border-left:4px solid #d9ae37}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:12px}.stat b{display:block;font-size:22px}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><div class="small" style="color:white">問題・詳しい解説・間違い復習・学習記録</div></header><main id="main"></main></div><script>
(function(){var M=document.getElementById('main');var P={
1:{n:'写真描写',q:[['📷 👩‍💻','写真について最も適切な英文を選んでください。',['A woman is working at a computer.','A man is repairing a bicycle.','Several people are swimming.','The room is being cleaned.'],0,'人物＋動作','写真に実際に見える動作だけを選びます。','女性がコンピューターで仕事をしています。'],['📷 ☕','写真について最も適切な英文を選んでください。',['A cup is on a table.','A man is opening a door.','The table is being moved.','People are waiting outside.'],0,'物＋位置','on＝〜の上に。位置関係を確認します。','カップがテーブルの上にあります。']]},
2:{n:'応答問題',q:[['When will the meeting begin?',['At nine o’clock.','In the conference room.','Yes, it began.'],0,'疑問詞','When→時間。','9時です。'],['Where is the report?',['On my desk.','Tomorrow morning.','Yes, I reported it.'],0,'疑問詞','Where→場所。','私の机の上です。'],['Why was the train delayed?',['Because of heavy rain.','At the station.','For two hours.'],0,'疑問詞','Why→理由。','大雨が理由です。']]},
3:{n:'会話問題',q:[['Did you send the invoice? Yes, I sent it this morning.\n\nWhat did the man send?',['An invoice.','A schedule.','A package.','A letter.'],0,'What問題','invoice＝請求書。','請求書です。'],['The printer needs paper. I will get some.\n\nWhat will the woman do?',['Get paper.','Repair the printer.','Call a client.','Leave the office.'],0,'What問題','will→これからする行動。','紙を取りに行きます。']]},
4:{n:'説明文問題',q:[['Attention passengers: Flight 218 will depart from Gate 12.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0,'場所','Gate＝搭乗口。','12番ゲートです。'],['The library closes at six today because of staff training.\n\nWhy does it close early?',['Staff training.','A holiday.','Repairs.','A meeting.'],0,'理由','because of の後ろが理由。','職員研修です。']]},
5:{n:'短文穴埋め',q:[['The company has ______ the deadline.',['extended','extending','extension','extensively'],0,'現在完了','has＋過去分詞。extended が正解。','会社は期限を延長しました。'],['Please make sure the forms are ______.',['complete','completed','completion','completing'],1,'受動態','are＋過去分詞。completed が正解。','書類が完成していることを確認してください。'],['She can ______ difficult problems quickly.',['solve','solved','solving','solution'],0,'助動詞','can＋動詞原形。','彼女は難しい問題を素早く解決できます。']]},
6:{n:'長文穴埋め',q:[['The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors only.','The manager only.'],0,'人物特定','who→人物。','利用する必要がある従業員です。'],['A survey is available online for seminar participants.\n\nWhat is available online?',['A survey.','A receipt.','A map.','A ticket.'],0,'内容特定','available online の対象を探します。','アンケートです。']]},
7:{n:'読解問題',q:[['City Hotel: Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0,'情報検索','included の直前後に注目。','朝食です。'],['Office chairs are 20% off. Customers buying three or more receive free delivery.\n\nWho gets free delivery?',['Customers buying three or more chairs.','Everyone.','Customers buying one chair.','Employees only.'],0,'条件','three or more＝3つ以上。','椅子を3脚以上購入する顧客です。']]}};
var data={a:{},w:{},h:[]};try{data=JSON.parse(localStorage.toeic9||'null')||data}catch(e){}function save(){localStorage.toeic9=JSON.stringify(data)}var st={p:0,i:0,score:0};
function home(){var total=Object.keys(data.a).length,ok=Object.values(data.a).filter(Boolean).length;M.innerHTML='<h2>TOEIC 総合問題集</h2><p class="small">回答後に、正解の理由・全選択肢・日本語・攻略ポイントを確認できます。</p><div class="stat"><div><b>'+total+'</b>回答</div><div><b>'+(total?Math.round(ok/total*100):0)+'%</b>正答率</div><div><b>'+Object.keys(data.w).length+'</b>復習</div></div><button class="menu" onclick="T.record()">📊 学習記録</button><button class="menu" onclick="T.review()">🔁 間違い復習</button><h3>Partを選ぶ</h3>';for(var p=1;p<=7;p++)M.innerHTML+='<button class="sub" onclick="T.start('+p+')">Part '+p+'　'+P[p].n+'</button>'}
function start(p,i){st={p:p,i:i||0,score:0};show()}
function show(){var q=P[st.p].q[st.i];M.innerHTML='<p class="small">Part '+st.p+'｜'+P[st.p].n+'｜問題 '+(st.i+1)+' / '+P[st.p].q.length+'</p><div class="card"><div class="q" style="white-space:pre-line">'+q[0]+'\n'+(st.p===1?q[1]:'')+'</div>';q[2].forEach(function(x,n){M.innerHTML+='<button class="choice" onclick="T.answer('+n+')">'+String.fromCharCode(65+n)+'. '+x+'</button>'});M.innerHTML+='<div id="exp"></div><button id="next" class="menu" style="display:none" onclick="T.next()">次の問題 →</button></div><button class="sub" onclick="T.home()">ホームへ</button>'}
function answer(n){var q=P[st.p].q[st.i],correct=n===q[3],key=st.p+'-'+st.i;if(correct)st.score++;document.querySelectorAll('.choice').forEach(function(b,i){b.disabled=true;if(i===q[3])b.className+=' ok';if(i===n&&!correct)b.className+=' ng'});data.a[key]=correct;if(correct)delete data.w[key];else data.w[key]=1;data.h.unshift({p:st.p,i:st.i,ok:correct});save();var h='<div class="box"><b>① 正解の理由</b><br>'+q[5]+'</div><div class="box"><b>② 全選択肢</b><br>';q[2].forEach(function(x,i){h+=String.fromCharCode(65+i)+'. '+x+' — '+(i===q[3]?'⭕ 正解':'❌ 今回の条件には合いません')+'<br>'});h+='</div><div class="box"><b>③ 日本語</b><br>'+q[6]+'</div><div class="box"><b>④ 重要ポイント</b><br>'+q[4]+'</div><div class="tip"><b>⑤ TOEIC攻略</b><br>'+tip(st.p)+'</div>';if(!correct)h+='<div class="box"><b>⑥ 復習</b><br>この問題は「間違い復習」に自動登録されました。</div>';document.getElementById('exp').innerHTML=h;document.getElementById('next').style.display='block'}
function tip(p){return p===1?'写真にないことを想像しない。':p===2?'疑問詞を最初に聞き取る。':p<=4?'設問を先に確認し、必要な情報だけを拾う。':p===5?'空欄の前後から品詞・文法を判断する。':p===6?'空欄だけでなく文全体を見る。':'設問のキーワードを本文から探す。'}
function next(){st.i++;if(st.i>=P[st.p].q.length){M.innerHTML='<h2>Part '+st.p+' 終了</h2><div class="stat"><div><b>'+st.score+'</b>正解</div><div><b>'+Math.round(st.score/P[st.p].q.length*100)+'%</b>正答率</div><div><b>'+P[st.p].q.length+'</b>問</div></div><button class="menu" onclick="T.start('+st.p+')">もう一度</button><button class="sub" onclick="T.home()">ホームへ</button>'}else show()}
function review(){var ks=Object.keys(data.w);M.innerHTML='<h2>🔁 間違い復習</h2><p class="small">正解すると復習リストから外れます。</p>';if(!ks.length)M.innerHTML+='<div class="box">現在、復習待ちの問題はありません。</div>';ks.forEach(function(k){var z=k.split('-');M.innerHTML+='<button class="sub" onclick="T.reviewOne('+z[0]+','+z[1]+')">Part '+z[0]+'｜問題 '+(+z[1]+1)+'</button>'});M.innerHTML+='<button class="sub" onclick="T.home()">ホームへ</button>'}
function record(){M.innerHTML='<h2>📊 学習記録</h2>';for(var p=1;p<=7;p++){var ks=Object.keys(data.a).filter(function(k){return k.indexOf(p+'-')===0}),c=ks.filter(function(k){return data.a[k]}).length;M.innerHTML+='<div class="box"><b>Part '+p+' '+P[p].n+'</b><br>回答 '+ks.length+'問　正答率 '+(ks.length?Math.round(c/ks.length*100):0)+'%<br>復習 '+Object.keys(data.w).filter(function(k){return k.indexOf(p+'-')===0}).length+'問</div>'}M.innerHTML+='<button class="sub" onclick="T.home()">ホームへ</button>'}
window.T={home:home,start:start,answer:answer,next:next,review:review,reviewOne:start,record:record};home();})();</script></body></html>
