<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学英語 定期テスト対策</title><style>body{margin:0;background:#f4f7f6;color:#18211f;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#1f6f5b;color:#fff;padding:20px;font-size:22px;font-weight:bold}header small{font-size:15px;font-weight:normal}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #0001}button{border:0;border-radius:12px;padding:14px;margin:6px 0;font-size:16px;font-weight:bold;background:#e8f1ee;color:#1f6f5b}.menu button,#next{width:100%;text-align:left}.primary{background:#1f6f5b;color:#fff}.hide{display:none}.q{font-size:21px;font-weight:bold;line-height:1.6}.jp{background:#fff7df;border-left:5px solid #d6a73a;padding:12px;border-radius:8px;font-size:18px;font-weight:bold;margin:12px 0}.pool{background:#f6f8f7;border-radius:12px;padding:8px;min-height:70px}.word{display:inline-block!important;width:auto!important;border:2px solid #1f6f5b!important;background:#fff!important;margin:5px!important;color:#1f6f5b!important}.used{opacity:.3;pointer-events:none}.answerbox{min-height:55px;border:2px dashed #bbb;border-radius:12px;padding:8px;margin:10px 0;font-size:18px;line-height:1.8}.picked{display:inline-block;background:#e8f1ee;border-radius:8px;padding:8px;margin:3px}.reset{background:#eee!important;color:#555!important}.ok{background:#d8f2e5!important}.ng{background:#ffe1e1!important}#exp{background:#f0f5f3;padding:13px;border-radius:10px;line-height:1.7}.review{background:#fff4d6!important;color:#8a5a00!important}.small{font-size:13px;color:#666}</style></head><body><header>中学英語 定期テスト対策<br><small>Lesson 2・Lesson 3</small></header><main><section id="home" class="card menu"><h2>問題を選ぶ</h2><button onclick="start(2)">Lesson 2　50問</button><button onclick="start(3)">Lesson 3　50問</button><button class="primary" onclick="start(0,20)">Lesson 2・3　20問</button><button class="primary" onclick="start(0,100)">Lesson 2・3　100問</button><button id="reviewBtn" class="review" onclick="startReview()">❌ 間違えた問題を復習</button><p class="small">同じ問題を繰り返さないよう、英文・日本語・選択肢を確認して問題を整理しています。</p></section><section id="quiz" class="card hide"><div id="count"></div><p id="type"></p><div id="question" class="q"></div><div id="area"></div><div id="exp" class="hide"></div><button id="next" class="primary hide">次の問題へ ▶</button></section><section id="result" class="card hide"><h2>結果</h2><div id="score" style="font-size:38px;text-align:center;font-weight:bold"></div><p id="comment"></p><button id="again" class="primary">もう一度</button><button onclick="location.reload()">ホームへ戻る</button></section></main><script>
const L2=[],L3=[];const add=(A,l,t,q,c,w,e,j='')=>A.push({l,t,q,a:[c,...w],e,j});const order=(A,l,j,a,e)=>A.push({l,t:'並べ替え',q:'日本語の意味に合う英文を作ろう',j,a,e});
// Lesson 2: 一般動詞・三単現・Do/Does・疑問詞
const nouns=['music','soccer','tennis','baseball','basketball','English','science','math','history','Japanese'];const people=['I','You','We','They','He','She','Ken','Yuki','Tom','Mike'];
[['What','favorite sport','何のスポーツがいちばん好きですか'],['Who','your favorite player','あなたのいちばん好きな選手はだれですか'],['Where','do you live','あなたはどこに住んでいますか'],['When','do you play tennis','あなたはいつテニスをしますか']].forEach((x,i)=>add(L2,2,'疑問詞',x[0]+' '+(i<2?'is':'')+' '+x[1]+'?',x[0],i===0?['Who','Where','When']:i===1?['What','Where','When']:i===2?['What','Who','When']:['What','Who','Where'],'疑問詞の意味に注目します。'));
people.forEach((p,i)=>{let third=['He','She','Ken','Yuki','Tom','Mike'].includes(p),v=third?'likes':'like';add(L2,2,'三単現',p+' ___ '+nouns[i]+'.',v,third?['like','liked','liking']:['likes','liked','liking'],third?'三人称単数なのでlikes。':'I/you/we/theyではlike。')});
for(let i=0;i<8;i++){let p=people[i+2],third=['He','She','Ken','Yuki','Tom','Mike'].includes(p),aux=third?'Does':'Do',n=nouns[(i+3)%nouns.length];add(L2,2,'疑問文',aux+' '+p.toLowerCase()+' ___ '+n+'?','like',['likes','liked','liking'],'Do/Doesの後ろは原形。')}
for(let i=0;i<8;i++){let p=people[i],third=['He','She','Ken','Yuki','Tom','Mike'].includes(p),v=third?"doesn't":"don't",n=nouns[(i+4)%nouns.length];add(L2,2,'否定文',p+' '+v+' like '+n+'.',v,third?["don't","isn't","not"]:["doesn't","am not","not"],'一般動詞の否定はdon’t/doesn’t。')}
add(L2,2,'会話','Do you like music? ― ___','Yes, I do.',['Yes, I am.','Yes, I does.','Yes, I like.'],'Doで聞かれたらYes, I do.');add(L2,2,'会話','Does she like tennis? ― ___','No, she doesn’t.',['No, she don’t.','No, she isn’t.','No, she doesn’t like.'],'Doesで聞かれたらdoesn’t。');add(L2,2,'語彙','favoriteの意味は？','いちばん好きな',['速い','新しい','忙しい'],'favorite＝いちばん好きな。');add(L2,2,'語彙','playerの意味は？','選手',['先生','生徒','友達'],'player＝選手。');add(L2,2,'語彙','sportの意味は？','スポーツ',['音楽','学校','公園'],'sport＝スポーツ。');
order(L2,2,'あなたは何のスポーツが好きですか。',['What','sport','do','you','like','?'],'What sport do you like?');order(L2,2,'あなたはどこに住んでいますか。',['Where','do','you','live','?'],'Where do you live?');order(L2,2,'彼はサッカーが好きです。',['He','likes','soccer','.'],'He likes soccer.');order(L2,2,'彼女はテニスが好きですか。',['Does','she','like','tennis','?'],'Does she like tennis?');order(L2,2,'私は音楽が好きではありません。',["I","don’t","like","music","."],'I don’t like music.');order(L2,2,'あなたは英語が好きですか。',['Do','you','like','English','?'],'Do you like English?');order(L2,2,'ケンは野球が好きです。',['Ken','likes','baseball','.'],'Ken likes baseball.');order(L2,2,'彼はどんなスポーツが好きですか。',['What','sport','does','he','like','?'],'What sport does he like?');order(L2,2,'あなたはいつテニスをしますか。',['When','do','you','play','tennis','?'],'When do you play tennis?');order(L2,2,'彼女は音楽が好きではありません。',["She","doesn’t","like","music","."],'She doesn’t like music.');order(L2,2,'私は英語が好きです。',['I','like','English','.'],'I like English.');order(L2,2,'彼らはバスケットボールが好きですか。',['Do','they','like','basketball','?'],'Do they like basketball?');order(L2,2,'ユキはサッカーが好きです。',['Yuki','likes','soccer','.'],'Yuki likes soccer.');order(L2,2,'あなたは音楽が好きではありません。',["You","don’t","like","music","."],'You don’t like music.');order(L2,2,'彼は野球が好きですか。',['Does','he','like','baseball','?'],'Does he like baseball?');order(L2,2,'私たちは英語が好きです。',['We','like','English','.'],'We like English.');order(L2,2,'トムはテニスが好きです。',['Tom','likes','tennis','.'],'Tom likes tennis.');order(L2,2,'マイクは数学が好きですか。',['Does','Mike','like','math','?'],'Does Mike like math?');order(L2,2,'あなたは歴史が好きです。',['You','like','history','.'],'You like history.');order(L2,2,'彼女はバスケットボールが好きです。',['She','likes','basketball','.'],'She likes basketball.');
// Lesson 3: 過去形・不規則動詞・was/were・did
const regular=[['play','played','soccer'],['watch','watched','TV'],['visit','visited','the park'],['study','studied','English'],['clean','cleaned','my room'],['help','helped','my mother'],['walk','walked','to school'],['open','opened','the door'],['cook','cooked','dinner'],['practice','practiced','tennis']];regular.forEach((x,i)=>{let p=people[i];add(L3,3,'過去形',p+' ___ '+x[2]+' yesterday.',x[1],[x[0],x[0]+'s',x[0]+'ing'],'yesterdayなので過去形。')});
const irr=[['go','went','to the park'],['have','had','breakfast'],['see','saw','a movie'],['eat','ate','lunch'],['buy','bought','a book'],['take','took','a picture'],['get','got','a present'],['come','came','home'],['make','made','a cake'],['read','read','a book']];irr.forEach(x=>add(L3,3,'不規則動詞','I ___ '+x[2]+' yesterday.',x[1],[x[0],x[0]+'s','am '+x[0]],x[0]+'の過去形は'+x[1]+'。'));
[['I','was'],['He','was'],['She','was'],['We','were'],['They','were'],['Ken','was'],['Yuki','was'],['Tom','was']].forEach((x,i)=>add(L3,3,'be動詞の過去',x[0]+' ___ '+['tired','busy','happy','busy','at school','hungry','excited','sleepy'][i]+' yesterday.',x[1],x[1]==='was'?['were','is','are']:['was','are','is'],'I/he/sheなどはwas、we/theyはwere。'));
[['I','play','tennis'],['She','watch','TV'],['We','play','soccer'],['He','study','English'],['They','play','basketball'],['Ken','watch','TV'],['Yuki','play','tennis'],['Tom','clean','his room']].forEach(x=>add(L3,3,'過去否定',x[0]+" didn't ___ "+x[2]+' yesterday.',x[1],['played','plays','playing'],'didn’tの後ろは原形。'));
[['play','tennis'],['watch','TV'],['visit','the park'],['study','English'],['clean','his room'],['practice','soccer']].forEach(x=>add(L3,3,'過去疑問','Did you ___ '+x[1]+' yesterday?',x[0],[x[0]+'ed',x[0]+'s',x[0]+'ing'],'Didの後ろは原形。'));
add(L3,3,'会話','What did you do yesterday? ― ___','I played tennis.',['I play tennis.','I am tennis.','I did tennis.'],'過去の質問なので過去形。');add(L3,3,'会話','Did you watch TV yesterday? ― ___','Yes, I did.',['Yes, I do.','Yes, I was.','Yes, I watched.'],'Didで聞かれたらYes, I did.');add(L3,3,'語彙','yesterdayの意味は？','昨日',['明日','毎日','先週'],'yesterday＝昨日。');add(L3,3,'語彙','tiredの意味は？','疲れた',['忙しい','うれしい','速い'],'tired＝疲れた。');add(L3,3,'語彙','busyの意味は？','忙しい',['疲れた','新しい','遅い'],'busy＝忙しい。');
order(L3,3,'私は昨日テニスをしました。',['I','played','tennis','yesterday','.'],'I played tennis yesterday.');order(L3,3,'あなたは昨日サッカーをしましたか。',['Did','you','play','soccer','yesterday','?'],'Did you play soccer yesterday?');order(L3,3,'彼は昨日疲れていました。',['He','was','tired','yesterday','.'],'He was tired yesterday.');order(L3,3,'私たちは昨日公園へ行きました。',['We','went','to','the park','yesterday','.'],'We went to the park yesterday.');order(L3,3,'私は昨日テニスをしませんでした。',["I","didn’t","play","tennis","yesterday","."],'I didn’t play tennis yesterday.');order(L3,3,'彼女は昨日テレビを見ました。',['She','watched','TV','yesterday','.'],'She watched TV yesterday.');order(L3,3,'彼女は昨日テレビを見ませんでした。',["She","didn’t","watch","TV","yesterday","."],'She didn’t watch TV yesterday.');order(L3,3,'あなたは昨日何をしましたか。',['What','did','you','do','yesterday','?'],'What did you do yesterday?');order(L3,3,'私は昨日忙しかったです。',['I','was','busy','yesterday','.'],'I was busy yesterday.');order(L3,3,'私たちは先週の日曜日にサッカーをしました。',['We','played','soccer','last Sunday','.'],'We played soccer last Sunday.');order(L3,3,'彼は昨日公園へ行きました。',['He','went','to','the park','yesterday','.'],'He went to the park yesterday.');order(L3,3,'彼らは昨日学校にいました。',['They','were','at','school','yesterday','.'],'They were at school yesterday.');order(L3,3,'あなたは昨日ゲームを見ましたか。',['Did','you','watch','the game','yesterday','?'],'Did you watch the game yesterday?');order(L3,3,'彼女は昨日朝食を食べました。',['She','ate','breakfast','yesterday','.'],'She ate breakfast yesterday.');order(L3,3,'私は昨日本を読みました。',['I','read','a book','yesterday','.'],'I read a book yesterday.');order(L3,3,'彼は昨日英語を勉強しました。',['He','studied','English','yesterday','.'],'He studied English yesterday.');order(L3,3,'私は昨日料理をしました。',['I','cooked','dinner','yesterday','.'],'I cooked dinner yesterday.');order(L3,3,'彼女は昨日写真を撮りました。',['She','took','a picture','yesterday','.'],'She took a picture yesterday.');order(L3,3,'私たちは昨日昼食を食べました。',['We','ate','lunch','yesterday','.'],'We ate lunch yesterday.');order(L3,3,'ケンは昨日本を買いました。',['Ken','bought','a book','yesterday','.'],'Ken bought a book yesterday.');
function unique(a){let s=new Set;return a.filter(x=>{let k=x.l+'|'+x.t+'|'+x.q+'|'+x.j+'|'+x.a.join('|');if(s.has(k))return false;s.add(k);return true})}const Q=unique(L2).slice(0,50).concat(unique(L3).slice(0,50));let deck=[],idx=0,score=0,answered=false;const $=id=>document.getElementById(id),mix=a=>[...a].sort(()=>Math.random()-.5);
function saved(){return JSON.parse(localStorage.getItem('englishWrong')||'[]')}function save(x){let a=saved(),k=x.l+'|'+x.q+'|'+(x.j||'');if(!a.some(z=>z.l+'|'+z.q+'|'+(z.j||'')===k))a.push(x);localStorage.setItem('englishWrong',JSON.stringify(a));updateReview()}function updateReview(){let n=saved().length;$('reviewBtn').style.display=n?'block':'none';if(n)$('reviewBtn').textContent='❌ 間違えた問題を復習（'+n+'問）'}updateReview();
function start(l,num){deck=mix(Q.filter(x=>!l||x.l===l));if(num)deck=deck.slice(0,num);idx=0;score=0;showQuiz()}function startReview(){deck=mix(saved());if(!deck.length)return alert('まだ間違えた問題はありません。');idx=0;score=0;showQuiz()}function showQuiz(){$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');show()}
function show(){answered=false;let x=deck[idx];$('count').textContent='第 '+(idx+1)+' 問 / '+deck.length;$('type').textContent='Lesson '+x.l+' ・ '+x.t;$('question').textContent=x.q;$('area').innerHTML='';$('exp').classList.add('hide');$('next').classList.add('hide');if(x.t==='並べ替え')makeOrder(x);else mix(x.a).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.style.display='block';b.style.width='100%';b.onclick=()=>answer(b,v,x);$('area').appendChild(b)})}
function makeOrder(x){let jp=document.createElement('div');jp.className='jp';jp.textContent='日本語：'+x.j;let box=document.createElement('div');box.className='answerbox';box.textContent='ここに英文を作ります';let pool=document.createElement('div');pool.className='pool';mix(x.a).forEach(w=>{let b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{if(answered||b.classList.contains('used'))return;if(box.textContent==='ここに英文を作ります')box.textContent='';let s=document.createElement('span');s.className='picked';s.textContent=w;s.dataset.w=w;box.appendChild(s);b.classList.add('used');if(box.querySelectorAll('.picked').length===x.a.length)checkOrder(box,x)};pool.appendChild(b)});let r=document.createElement('button');r.className='reset';r.textContent='↩ リセット';r.onclick=()=>{box.innerHTML='';box.textContent='ここに英文を作ります';pool.querySelectorAll('button').forEach(b=>b.classList.remove('used'));answered=false;$('exp').classList.add('hide');$('next').classList.add('hide')};$('area').append(jp,box,pool,r)}
function checkOrder(box,x){let u=[...box.querySelectorAll('.picked')].map(e=>e.dataset.w).join(' '),c=x.a.join(' '),good=u===c;answered=true;if(good)score++;else save(x);$('exp').innerHTML=(good?'⭕ 正解！':'❌ 不正解。')+'<br>正解：'+c+'<br>'+x.e;$('exp').classList.remove('hide');$('next').classList.remove('hide')}
function answer(b,v,x){if(answered)return;answered=true;let good=v===x.a[0];if(good)score++;else save(x);b.classList.add(good?'ok':'ng');[...$('area').querySelectorAll('button')].forEach(z=>{z.disabled=true;if(z.textContent===x.a[0])z.classList.add('ok')});$('exp').innerHTML=(good?'⭕ 正解！':'❌ 不正解。')+'<br>正解：'+x.a[0]+'<br>'+x.e;$('exp').classList.remove('hide');$('next').classList.remove('hide')}
$('next').onclick=()=>{idx++;if(idx<deck.length)show();else finish()};function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');let p=Math.round(score/deck.length*100);$('score').textContent=score+' / '+deck.length+'（'+p+'%）';$('comment').textContent=p>=90?'🎉 すばらしい！':p>=80?'👍 かなりいい！':'📚 間違えた問題を復習しよう！';$('again').onclick=()=>{deck=mix(deck);idx=0;score=0;showQuiz()}}
</script></body></html>
