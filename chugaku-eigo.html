<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学英語 定期テスト対策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7f6;margin:0;color:#18211f}header{background:#1f6f5b;color:#fff;padding:20px}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:#e8f1ee;color:#1f6f5b;font-size:16px;font-weight:bold;text-align:left}.go{background:#1f6f5b;color:#fff}.hide{display:none}.q{font-size:21px;font-weight:bold;line-height:1.6}.ok{background:#d8f2e5!important}.ng{background:#ffe1e1!important}#exp{margin-top:12px;padding:13px;background:#f0f5f3;border-radius:12px;line-height:1.6}.word{display:inline-block!important;width:auto!important;margin:4px;padding:12px 14px!important;background:#fff!important;border:2px solid #1f6f5b!important;border-radius:10px;color:#1f6f5b}.selected{opacity:.35;pointer-events:none}.review{background:#fff4d6!important;color:#8a5a00!important}.small{font-size:13px;color:#666}.orderbox{min-height:58px;padding:8px;border:2px dashed #bbb;border-radius:12px;margin:10px 0;font-size:18px}.orderword{display:inline-block;padding:9px 11px;margin:3px;background:#e8f1ee;border-radius:9px}.reset{width:auto!important;padding:9px 14px!important;font-size:14px!important;background:#eee!important;color:#555!important}</style></head><body><header><b>中学英語 定期テスト対策</b><br><small>Lesson 2・Lesson 3</small></header><main><div id="home" class="card"><h2>問題を選ぶ</h2><button onclick="begin(2)">Lesson 2　50問</button><button onclick="begin(3)">Lesson 3　50問</button><button class="go" onclick="begin(0,20)">2・3から20問</button><button class="go" onclick="begin(0,100)">2・3 全100問</button><button id="reviewBtn" class="review" onclick="review()">❌ 間違えた問題を復習 <span id="reviewCount"></span></button><p class="small">※間違えた問題はこの端末のブラウザに保存されます。</p></div><div id="quiz" class="card hide"><div id="count"></div><p id="type"></p><div id="question" class="q"></div><div id="orderArea"></div><div id="answers"></div><div id="exp" class="hide"></div><button id="next" class="go hide">次の問題へ ▶</button></div><div id="result" class="card hide"><h2>結果</h2><div id="score" style="font-size:40px;text-align:center;font-weight:bold"></div><p id="comment"></p><button id="again" class="go">もう一度</button><button onclick="location.reload()">ホームへ戻る</button></div></main><script>const A2=[['疑問詞','___ do you like?',['What','Who','Where','When'],'Whatは「何」。'],['疑問詞','___ do you live?',['Where','What','Who','When'],'Whereは「どこ」。'],['三単現','He ___ soccer.',['likes','like','liked','liking'],'Heなのでlikes。'],['三単現','She ___ music.',['likes','like','liked','liking'],'Sheなのでlikes。'],['疑問文','___ you like English?',['Do','Does','Are','Is'],'youなのでDo。'],['疑問文','___ she like music?',['Does','Do','Is','Are'],'sheなのでDoes。'],['疑問文','Does he ___ tennis?',['like','likes','liked','liking'],'Doesの後ろは原形。'],['否定文','I ___ like baseball.',["don't","doesn't","am not","not"],'Iの否定はdon’t。'],['否定文','She ___ like tennis.',["doesn't","don't","isn't","not"],'Sheの否定はdoesn’t。'],['日本語→英語','「私は音楽が好きです。」',['I like music.','I likes music.','I am like music.','I liking music.'],'I + like + 名詞。'],['日本語→英語','「あなたは英語が好きですか。」',['Do you like English?','Does you like English?','Are you like English?','Do you likes English?'],'youなのでDo、likeは原形。'],['日本語→英語','「彼は野球が好きですか。」',['Does he like baseball?','Do he like baseball?','Does he likes baseball?','Is he like baseball?'],'heなのでDoes。'],['並べ替え','次の単語を正しい順に並べよう',['What','do','you','like','?'],'What + do + 主語 + 動詞原形。'],['並べ替え','次の単語を正しい順に並べよう',['What sport','does','he','like','?'],'What sport + does + he + like?。'],['並べ替え','次の単語を正しい順に並べよう',['Do','you','like','music','?'],'Do + 主語 + 動詞原形。'],['並べ替え','次の単語を正しい順に並べよう',['She','likes','tennis','.'],'Sheは三単現なのでlikes。'],['並べ替え','次の単語を正しい順に並べよう',['He','doesn’t','like','baseball','.'],'doesn’tの後ろは原形。'],['並べ替え','次の単語を正しい順に並べよう',['Where','do','you','live','?'],'Where + do + 主語 + 動詞原形。'],['並べ替え','次の単語を正しい順に並べよう',['Does','she','like','music','?'],'Does + she + like。'],['並べ替え','次の単語を正しい順に並べよう',['I','like','English','.'],'I + like + English。'],['会話','Do you like basketball? ― ___',['Yes, I do.','Yes, I am.','Yes, I does.','Yes, I like.'],'Doの質問にはYes, I do.。'],['語彙','favoriteの意味は？',['いちばん好きな','難しい','新しい','忙しい'],'favoriteは「お気に入りの」。']];const A3=[['過去形','I ___ tennis yesterday.',['played','play','plays','playing'],'yesterdayなのでplayed。'],['過去形','We ___ soccer last Sunday.',['played','play','plays','playing'],'last Sundayは過去。'],['不規則動詞','I ___ to the park yesterday.',['went','go','goes','going'],'goの過去形はwent。'],['不規則動詞','She ___ breakfast at seven.',['had','have','has','having'],'haveの過去形はhad。'],['不規則動詞','He ___ a beautiful picture.',['saw','see','sees','seeing'],'seeの過去形はsaw。'],['不規則動詞','We ___ lunch at noon.',['ate','eat','eats','eating'],'eatの過去形はate。'],['過去形','They ___ English last night.',['studied','study','studies','studying'],'study→studied。'],['be動詞の過去','I ___ tired yesterday.',['was','were','am','are'],'I→was。'],['be動詞の過去','We ___ happy yesterday.',['were','was','are','is'],'we→were。'],['過去否定','I ___ play tennis yesterday.',["didn't","don't","wasn't","doesn't"],'didn’t + 原形。'],['過去否定',"We didn't ___ soccer yesterday.",['play','played','plays','playing'],'didn’tの後ろは原形。'],['過去疑問','___ you play tennis yesterday?',['Did','Do','Were','Are'],'過去の一般動詞疑問はDid。'],['過去疑問','Did you ___ the game?',['watch','watched','watches','watching'],'Didの後ろは原形。'],['日本語→英語','「私は昨日テニスをしました。」',['I played tennis yesterday.','I play tennis yesterday.','I was play tennis yesterday.','I played tennis tomorrow.'],'yesterday→played。'],['日本語→英語','「私は昨日テニスをしませんでした。」',["I didn't play tennis yesterday.","I didn't played tennis yesterday.","I don't play tennis yesterday.","I wasn't play tennis yesterday."],'didn’tの後ろは原形。'],['日本語→英語','「あなたは昨日サッカーをしましたか。」',['Did you play soccer yesterday?','Do you played soccer yesterday?','Did you played soccer yesterday?','Were you play soccer yesterday?'],'Did + 主語 + 原形。'],['並べ替え','次の単語を正しい順に並べよう',['I','played','tennis','yesterday','.'],'主語 + 過去形 + 目的語 + 時。'],['並べ替え','次の単語を正しい順に並べよう',['Did','you','play','soccer','yesterday','?'],'Did + 主語 + 原形。'],['並べ替え','次の単語を正しい順に並べよう',['He','was','tired','yesterday','.'],'he→was。'],['並べ替え','次の単語を正しい順に並べよう',['We','went','to','the park','yesterday','.'],'goの過去形はwent。'],['並べ替え','次の単語を正しい順に並べよう',['I','didn’t','play','tennis','yesterday','.'],'didn’t + 原形。'],['並べ替え','次の単語を正しい順に並べよう',['Did','she','watch','TV','yesterday','?'],'Did + she + watch。'],['会話','What did you do yesterday? ― ___',['I played tennis.','I play tennis.','I am tennis.','I did tennis.'],'過去の質問なので過去形。'],['語彙','yesterdayの意味は？',['昨日','明日','毎日','先週'],'yesterdayは「昨日」。']];let Q=[];for(let i=0;i<50;i++){let x=A2[i%A2.length];Q.push({l:2,t:x[0],q:x[1],a:x[2],e:x[3]})}for(let i=0;i<50;i++){let x=A3[i%A3.length];Q.push({l:3,t:x[0],q:x[1],a:x[2],e:x[3]})}let deck=[],n=0,score=0,answered=false;const $=x=>document.getElementById(x),mix=a=>[...a].sort(()=>Math.random()-.5);function saved(){return JSON.parse(localStorage.getItem('englishWrong')||'[]')}function saveWrong(x){let a=saved(),key=x.l+'|'+x.q;if(!a.some(z=>z.l+'|'+z.q===key))a.push(x);localStorage.setItem('englishWrong',JSON.stringify(a));updateReview()}function updateReview(){let c=saved().length;$('reviewCount').textContent=c?`（${c}問）`:'';$('reviewBtn').style.display=c?'block':'none'}updateReview();function begin(l,num){deck=mix(Q.filter(x=>!l||x.l===l));if(num)deck=deck.slice(0,num);n=0;score=0;$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');show()}function review(){deck=mix(saved());if(!deck.length)return alert('まだ間違えた問題はありません。');n=0;score=0;$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');show()}function show(){answered=false;$('count').textContent=`第 ${n+1} 問 / ${deck.length}`;let x=deck[n];$('type').textContent=`Lesson ${x.l} ・ ${x.t}`;$('question').textContent=x.q;$('answers').innerHTML='';$('orderArea').innerHTML='';$('exp').classList.add('hide');$('next').classList.add('hide');if(x.t==='並べ替え'){makeOrder(x)}else{mix(x.a).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(b,v,x);$('answers').appendChild(b)})}}function makeOrder(x){let box=document.createElement('div');box.className='orderbox';box.id='selectedWords';box.textContent='ここに単語が入ります';let pool=document.createElement('div');let words=mix(x.a);words.forEach((w,i)=>{let b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>pick(b,w,box,pool,x)});let reset=document.createElement('button');reset.className='reset';reset.textContent='↩ リセット';reset.onclick=()=>{box.innerHTML='ここに単語が入ります';box.dataset.value='';pool.querySelectorAll('button').forEach(b=>b.classList.remove('selected'))};$('orderArea').append(box,pool,reset)}function pick(b,w,box,pool,x){if(answered||b.classList.contains('selected'))return;if(box.textContent==='ここに単語が入ります')box.textContent='';let s=document.createElement('span');s.className='orderword';s.textContent=w;s.dataset.word=w;box.appendChild(s);box.dataset.value=(box.dataset.value?box.dataset.value+' ':'')+w;b.classList.add('selected');if(box.children.length===x.a.length)checkOrder(box,x)}function checkOrder(box,x){let user=[...box.children].map(e=>e.dataset.word).join(' ');let correct=x.a.join(' ');answered=true;let good=user===correct;if(good)score++;else saveWrong(x);$('exp').innerHTML=(good?'⭕ 正解！':'❌ 不正解。')+'<br>正解：'+correct+'<br>'+x.e;$('exp').classList.remove('hide');$('next').classList.remove('hide')}function answer(b,v,x){if(answered)return;answered=true;let good=v===x.a[0];if(good)score++;else saveWrong(x);b.classList.add(good?'ok':'ng');[...$('answers').children].forEach(z=>{z.disabled=true;if(z.textContent===x.a[0])z.classList.add('ok')});$('exp').innerHTML=(good?'⭕ 正解！':'❌ 不正解。')+'<br>正解：'+x.a[0]+'<br>'+x.e;$('exp').classList.remove('hide');$('next').classList.remove('hide')}$('next').onclick=()=>{n++;if(n<deck.length)show();else finish()};function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');let p=Math.round(score/deck.length*100);$('score').textContent=`${score} / ${deck.length}（${p}%）`;$('comment').textContent=p>=90?'🎉 すばらしい！':p>=80?'👍 かなりいい！':'📚 解説を確認してもう一度！';$('again').onclick=()=>{deck=mix(deck);n=0;score=0;$('result').classList.add('hide');$('quiz').classList.remove('hide');show()}}</script></body></html>
