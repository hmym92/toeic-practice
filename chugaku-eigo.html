<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学英語 定期テスト対策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7f6;margin:0;color:#18211f}header{background:#1f6f5b;color:#fff;padding:20px}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;background:#e8f1ee;color:#1f6f5b;font-size:16px;font-weight:bold;text-align:left}.go{background:#1f6f5b;color:#fff}.hide{display:none}.q{font-size:21px;font-weight:bold;line-height:1.6}.ok{background:#d8f2e5!important}.ng{background:#ffe1e1!important}#exp{margin-top:12px;padding:13px;background:#f0f5f3;border-radius:12px;line-height:1.6}</style><header><b>中学英語 定期テスト対策</b><br><small>Lesson 2・Lesson 3</small></header><main><div id="home" class="card"><h2>問題を選ぶ</h2><button onclick="begin(2)">Lesson 2　50問</button><button onclick="begin(3)">Lesson 3　50問</button><button class="go" onclick="begin(0,20)">2・3から20問</button><button class="go" onclick="begin(0,100)">2・3 全100問</button></div><div id="quiz" class="card hide"><div id="count"></div><p id="type"></p><div id="question" class="q"></div><div id="answers"></div><div id="exp" class="hide"></div><button id="next" class="go hide">次の問題へ ▶</button></div><div id="result" class="card hide"><h2>結果</h2><div id="score" style="font-size:40px;text-align:center;font-weight:bold"></div><p id="comment"></p><button class="go" onclick="location.reload()">もう一度</button></div></main><script>const A2=[['疑問詞','___ do you like?',['What','Who','Where','When'],'Whatは「何」。'],['疑問詞','___ do you live?',['Where','What','Who','When'],'Whereは「どこ」。'],['三単現','He ___ soccer.',['likes','like','liked','liking'],'Heなのでlikes。'],['三単現','She ___ music.',['likes','like','liked','liking'],'Sheなのでlikes。'],['疑問文','___ you like English?',['Do','Does','Are','Is'],'youなのでDo。'],['疑問文','___ she like music?',['Does','Do','Is','Are'],'sheなのでDoes。'],['疑問文','Does he ___ tennis?',['like','likes','liked','liking'],'Doesの後ろは原形。'],['否定文','I ___ like baseball.',["don't","doesn't","am not","not"],'Iの否定はdon’t。'],['否定文','She ___ like tennis.',["doesn't","don't","isn't","not"],'Sheの否定はdoesn’t。'],['日本語→英語','「私は音楽が好きです。」',['I like music.','I likes music.','I am like music.','I liking music.'],'I + like + 名詞。'],['日本語→英語','「あなたは英語が好きですか。」',['Do you like English?','Does you like English?','Are you like English?','Do you likes English?'],'youなのでDo、likeは原形。'],['日本語→英語','「彼は野球が好きですか。」',['Does he like baseball?','Do he like baseball?','Does he likes baseball?','Is he like baseball?'],'heなのでDoes。'],['並べ替え','[ do / you / What / like ]',['What do you like?','What you do like?','Do you what like?','You do what like?'],'What + do + 主語 + 原形。'],['会話','Do you like basketball? ― ___',['Yes, I do.','Yes, I am.','Yes, I does.','Yes, I like.'],'Doの質問にはYes, I do.。'],['語彙','favoriteの意味は？',['いちばん好きな','難しい','新しい','忙しい'],'favoriteは「お気に入りの」。']];const A3=[['過去形','I ___ tennis yesterday.',['played','play','plays','playing'],'yesterdayなのでplayed。'],['過去形','We ___ soccer last Sunday.',['played','play','plays','playing'],'last Sundayは過去。'],['不規則動詞','I ___ to the park yesterday.',['went','go','goes','going'],'goの過去形はwent。'],['不規則動詞','She ___ breakfast at seven.',['had','have','has','having'],'haveの過去形はhad。'],['不規則動詞','He ___ a beautiful picture.',['saw','see','sees','seeing'],'seeの過去形はsaw。'],['不規則動詞','We ___ lunch at noon.',['ate','eat','eats','eating'],'eatの過去形はate。'],['過去形','They ___ English last night.',['studied','study','studies','studying'],'study→studied。'],['be動詞の過去','I ___ tired yesterday.',['was','were','am','are'],'I→was。'],['be動詞の過去','We ___ happy yesterday.',['were','was','are','is'],'we→were。'],['過去否定','I ___ play tennis yesterday.',["didn't","don't","wasn't","doesn't"],'didn’t + 原形。'],['過去否定',"We didn't ___ soccer yesterday.",['play','played','plays','playing'],'didn’tの後ろは原形。'],['過去疑問','___ you play tennis yesterday?',['Did','Do','Were','Are'],'過去の一般動詞疑問はDid。'],['過去疑問','Did you ___ the game?',['watch','watched','watches','watching'],'Didの後ろは原形。'],['日本語→英語','「私は昨日テニスをしました。」',['I played tennis yesterday.','I play tennis yesterday.','I was play tennis yesterday.','I played tennis tomorrow.'],'yesterday→played。'],['日本語→英語','「私は昨日テニスをしませんでした。」',["I didn't play tennis yesterday.","I didn't played tennis yesterday.","I don't play tennis yesterday.","I wasn't play tennis yesterday."],'didn’tの後ろは原形。'],['日本語→英語','「あなたは昨日サッカーをしましたか。」',['Did you play soccer yesterday?','Do you played soccer yesterday?','Did you played soccer yesterday?','Were you play soccer yesterday?'],'Did + 主語 + 原形。'],['並べ替え','[ yesterday / played / I / tennis ]',['I played tennis yesterday.','I yesterday played tennis.','Played I tennis yesterday.','I play tennis yesterday.'],'主語 + 過去形 + 目的語 + 時。'],['会話','What did you do yesterday? ― ___',['I played tennis.','I play tennis.','I am tennis.','I did tennis.'],'過去の質問なので過去形。'],['語彙','yesterdayの意味は？',['昨日','明日','毎日','先週'],'yesterdayは「昨日」。']];let Q=[];for(let i=0;i<50;i++){let x=A2[i%A2.length];Q.push({l:2,t:x[0],q:x[1],a:x[2],e:x[3]})}for(let i=0;i<50;i++){let x=A3[i%A3.length];Q.push({l:3,t:x[0],q:x[1],a:x[2],e:x[3]})}let deck=[],n=0,score=0;const $=x=>document.getElementById(x),mix=a=>[...a].sort(()=>Math.random()-.5);function begin(l,num){deck=mix(Q.filter(x=>!l||x.l===l));if(num)deck=deck.slice(0,num);n=0;score=0;$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');show()}function show(){$('count').textContent=`第 ${n+1} 問 / ${deck.length}`;let x=deck[n];$('type').textContent=`Lesson ${x.l} ・ ${x.t}`;$('question').textContent=x.q;$('answers').innerHTML='';mix(x.a).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(b,v,x);$('answers').appendChild(b)});$('exp').classList.add('hide');$('next').classList.add('hide');$('next').onclick=next}function answer(b,v,x){if(b.disabled)return;let good=v===x.a[0];if(good){score++;b.classList.add('ok')}else{b.classList.add('ng');[...$('answers').children].forEach(z=>{if(z.textContent===x.a[0])z.classList.add('ok')})}[...$('answers').children].forEach(z=>z.disabled=true);$('exp').innerHTML=(good?'⭕ 正解！':'❌ 不正解。')+'<br>正解：'+x.a[0]+'<br>'+x.e;$('exp').classList.remove('hide');$('next').classList.remove('hide')}function next(){n++;if(n<deck.length)show();else finish()}function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');let p=Math.round(score/deck.length*100);$('score').textContent=`${score} / ${deck.length}（${p}%）`;$('comment').textContent=p>=90?'🎉 すばらしい！':p>=80?'👍 かなりいい！':'📚 解説を確認してもう一度！'}</script></html>
