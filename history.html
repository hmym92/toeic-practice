let A=[],i=0,s=0;function sh(a){return [...a].sort(()=>Math.random()-.5)}function start(m){let p=B;if(m==='basic')p=B.slice(0,40);if(m==='test')p=B.slice(40);if(m==='review'){let ids=JSON.parse(localStorage.getItem('wrongHistory')||'[]');p=B.filter((_,n)=>ids.includes(n));if(!p.length){alert('まだ間違いがありません。まず問題を解いてみよう！');return}}A=sh(p).slice(0,20);i=0;s=0;home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');show()}function show(){let x=A[i];tag.textContent=x[0];num.textContent=(i+1)+' / '+A.length;bar.style.width=(i/A.length*100)+'%';q.textContent='Q'+(i+1)+'　'+x[1];choices.innerHTML='';fb.innerHTML='';fb.className='';next.classList.add('hide');x[2].forEach((v,n)=>{let b=document.createElement('button');b.textContent=(n+1)+'　'+v;b.onclick=()=>ans(n,b);choices.appendChild(b)})}function ans(n,b){let x=A[i],bs=[...choices.children];bs.forEach(v=>v.disabled=true);bs[x[3]].classList.add('correct');if(n===x[3]){s++;b.classList.add('correct');fb.className='fb ok';fb.innerHTML='⭕ 正解！<br>'+x[4]}else{b.classList.add('wrong');fb.className='fb ng';fb.innerHTML='❌ 不正解。正解は「'+x[2][x[3]]+'」<br>'+x[4];let id=B.indexOf(x),ids=JSON.parse(localStorage.getItem('wrongHistory')||'[]');if(!ids.includes(id))ids.push(id);localStorage.setItem('wrongHistory',JSON.stringify(ids))}next.classList.remove('hide')}function nextQ(){i++;if(i<A.length)show();else finish()}function finish(){quiz.classList.add('hide');result.classList.remove('hide');let p=Math.round(s/A.length*100);score.textContent=s+' / '+A.length+'問（'+p+'%）';comment.textContent=p>=90?'すばらしい！かなり定着しています。':p>=70?'あと少し！間違い復習でさらに伸ばそう。':'教科書を確認して、もう一度挑戦しよう。'}function home(){quiz.classList.add('hide');result.classList.add('hide');home.classList.remove('hide')}</script></body></html>
