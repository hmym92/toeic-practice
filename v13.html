<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Quick Practice v13</title><style>body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#17212b}.app{max-width:700px;margin:auto;min-height:100vh;background:#fff}.head{background:#142a43;color:#fff;padding:22px 18px}.head h1{margin:0 0 6px}.main{padding:18px}.meta{color:#687584;font-size:14px}.bar{height:7px;background:#e5e9ed;border-radius:8px;margin:9px 0 18px}.bar i{display:block;height:100%;background:#2b557d;border-radius:8px}.card{border:1px solid #d7dee5;border-radius:16px;padding:18px}.q{font-size:19px;line-height:1.75;white-space:pre-line;margin-bottom:18px}.choices{display:grid;gap:10px}.choice{width:100%;min-height:54px;padding:13px;border:2px solid #d9e0e6;border-radius:12px;background:#fff;text-align:left;font-size:16px}.choice.correct{border-color:#42a56d;background:#eaf8ef}.choice.wrong{border-color:#d86565;background:#fff0f0}.choice:disabled{opacity:1}.box{background:#f5f7f9;border-radius:12px;padding:13px;margin-top:10px;line-height:1.75}.tip{background:#fff7df;border-left:4px solid #d1a42f}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#142a43;color:#fff;font-size:16px;font-weight:700}.secondary{background:#edf1f4;color:#17212b}.tag{display:inline-block;font-size:12px;background:#e9edf1;border-radius:7px;padding:3px 7px}.home{margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid #ddd;border-radius:10px;padding:9px}.stat b{display:block;font-size:21px}.part{width:100%;text-align:left;background:#fff;border:1px solid #d9dfe5;border-radius:12px;padding:14px;margin:7px 0;font-size:16px}.part small{float:right;color:#687584}</style></head><body><div class="app"><header class="head"><h1>TOEIC Quick Practice</h1><div>本番対策・詳しい解説・間違い復習</div></header><main class="main" id="app"></main></div><script>
const app=document.getElementById('app');
const parts={1:'写真描写',2:'応答問題',3:'会話問題',4:'説明文問題',5:'短文穴埋め',6:'長文穴埋め',7:'読解問題'};
const questions={
1:[['男性がコンピューターを使っている。',['A man is working at a computer.','A man is washing a car.','A woman is entering the room.','The computers are being removed.'],0,'working at a computer＝コンピューターで仕事をしている。写真では人物の動作を正確に捉える。','男性がコンピューターで仕事をしています。'],['テーブルの上にカップと本がある。',['A cup is beside a book.','A woman is serving dinner.','The table is being carried outside.','Several people are standing in line.'],0,'beside＝〜のそばに。物の位置関係を表す語に注目する。','カップが本のそばにあります。'],['自転車を修理している。',['A bicycle is being repaired.','A bicycle is being sold.','People are boarding a train.','The road is being closed.'],0,'is being repaired＝修理されている。受動態＋進行形。','自転車が修理されています。'],['公園に椅子が並んでいる。',['Several chairs are arranged in the park.','The chairs are being painted indoors.','A man is driving a bus.','People are buying tickets.'],0,'are arranged＝並べられている。状態を表す受動態。','公園にいくつかの椅子が並べられています。'],['女性がカートを押している。',['A woman is pushing a shopping cart.','A woman is opening a window.','A cart is being repaired.','The woman is leaving by train.'],0,'push＝押す。人物＋動作の組み合わせを確認する。','女性がショッピングカートを押しています。'],['建物の前に車が駐車されている。',['A car is parked in front of a building.','A car is crossing a bridge.','The building is being demolished.','People are boarding a plane.'],0,'parked＝駐車されている。in front of＝〜の前に。','建物の前に車が駐車されています。']],
2:[['When will the meeting begin?',['At nine o’clock.','In the conference room.','By Mr. Lee.'],0,'Whenは時を尋ねる。At nine o’clockが時間を答えている。','会議はいつ始まりますか。— 9時です。'],['Where is the report?',['On my desk.','Tomorrow morning.','Yes, I reported it.'],0,'Whereは場所。On my desk＝私の机の上。','報告書はどこですか。— 私の机の上です。'],['Why was the train delayed?',['Because of heavy rain.','At the station.','For two hours.'],0,'Whyは理由。Because of heavy rainが理由を表す。','なぜ電車は遅れたのですか。— 大雨のためです。'],['Who approved the budget?',['Ms. Garcia did.','Next Monday.','About ten percent.'],0,'Whoは人物。Ms. Garcia did.は「ガルシアさんです」。','誰が予算を承認しましたか。— ガルシアさんです。'],['How often do you exercise?',['Twice a week.','At the gym.','For an hour yesterday.'],0,'How oftenは頻度。Twice a week＝週2回。','どのくらいの頻度で運動しますか。— 週2回です。'],['How long will the repair take?',['About two hours.','At the repair shop.','Yes, it will.'],0,'How longは期間。About two hours＝約2時間。','修理にはどれくらいかかりますか。— 約2時間です。'],['Would you like some coffee?',['Yes, please.','At the cafeteria.','It was roasted yesterday.'],0,'申し出への自然な応答はYes, please.。','コーヒーはいかがですか。— はい、お願いします。'],['Could you send me the file?',['Sure, I’ll send it now.','In the file cabinet.','It was expensive.'],0,'依頼への応答。Sure, I’ll ...＝もちろん、送ります。','ファイルを送ってもらえますか。— もちろん、今送ります。'],['Did you reserve a table?',['Yes, for six people.','At the restaurant.','Tomorrow is fine.'],0,'Didで始まる質問にはYes/Noで応答する。','テーブルを予約しましたか。— はい、6人分です。'],['Is the printer working?',['No, it needs paper.','On the second floor.','At noon.'],0,'Is〜?にはYes/Noで答えるのが基本。','プリンターは動いていますか。— いいえ、紙が必要です。']],
3:[['A: Did you send the invoice? B: Yes, I sent it this morning.\n\nWhat did B send?',['An invoice.','A schedule.','A package.','A letter.'],0,'sendの目的語はinvoice。動詞だけでなく、その後ろの名詞を確認する。','Bは何を送りましたか。— 請求書です。'],['A: The printer needs paper. B: I’ll get some from the supply room.\n\nWhere will B get it?',['From the supply room.','From the lobby.','From the store.','From the manager.'],0,'from the supply roomが場所の直接的な答え。','Bはどこから紙を取りますか。— 備品室からです。'],['A: Are you free for lunch? B: I have a meeting at noon, but I’m free at one.\n\nWhen is B available?',['At one.','At noon.','At ten.','At three.'],0,'noonは会議の時間。free at oneなので1時が答え。','Bはいつ空いていますか。— 1時です。'],['A: The client moved the appointment to Friday. B: That works for me.\n\nWhat changed?',['The appointment date.','The meeting room.','The price.','The client’s address.'],0,'to Fridayから変更されたのはappointment date。','何が変更されましたか。— 予約の日付です。'],['A: Have you seen the new schedule? B: Not yet. Could you email it to me?\n\nWhat does B want?',['The new schedule.','A new computer.','A meeting room.','A receipt.'],0,'itはnew scheduleを指す。Bはそれをemailしてほしい。','Bは何を欲しがっていますか。— 新しいスケジュールです。'],['A: The conference room is occupied. B: Let’s use the smaller room upstairs.\n\nWhere will they go?',['The smaller room upstairs.','The cafeteria.','The lobby.','The parking lot.'],0,'Bの提案Let’s use ...をそのまま拾う。','彼らはどこへ行きますか。— 上階の小さい部屋です。'],['A: I need to buy a train ticket. B: The ticket machine is next to the entrance.\n\nWhere is the machine?',['Next to the entrance.','Near the platform.','In the office.','Outside the station.'],0,'next to＝〜の隣。場所問題では前置詞に注目する。','機械はどこですか。— 入口の隣です。'],['A: Can you review this proposal today? B: I can do it after three.\n\nWhen can B review it?',['After three.','Before noon.','Tomorrow morning.','At one.'],0,'after threeが可能な時間を直接示す。','Bはいつ提案書を確認できますか。— 3時以降です。'],['A: We’re out of printer ink. B: I’ll order a new cartridge.\n\nWhat will B order?',['A printer cartridge.','Paper.','A computer.','A desk.'],0,'out of inkが原因で、Bはnew cartridgeを注文する。','Bは何を注文しますか。— プリンターのカートリッジです。'],['A: Did the customer receive the package? B: Yes, it arrived yesterday.\n\nWhen did it arrive?',['Yesterday.','Today.','Tomorrow.','Last week.'],0,'arrived yesterdayという明示情報を拾う。','それはいつ届きましたか。— 昨日です。']],
4:[['Attention passengers: Flight 218 will depart from Gate 12. Boarding begins at 9:20.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0,'depart from Gate 12と明示されている。','その便はどこから出発しますか。— 12番ゲートです。'],['The library closes at six today because of staff training. It will reopen tomorrow at nine.\n\nWhy does it close early?',['Staff training.','A holiday.','Repairs.','A meeting.'],0,'because of staff trainingが理由。','なぜ早く閉まるのですか。— 職員研修のためです。'],['Thank you for attending our seminar. Please complete the online survey before Friday.\n\nWhat should attendees do?',['Complete an online survey.','Buy a ticket.','Call the hotel.','Print a report.'],0,'Please complete the online surveyが行うべきこと。','参加者は何をすべきですか。— オンラインアンケートを完了します。'],['The store will offer discounts on office chairs this weekend. Customers buying three or more receive free delivery.\n\nWhat will be discounted?',['Office chairs.','Desks.','Computers.','Printers.'],0,'discounts on office chairs。discountの対象に注目。','何が割引されますか。— オフィスチェアです。'],['Due to construction, the east entrance is closed. Please use the main entrance near the parking lot.\n\nWhy is the entrance closed?',['Construction.','A holiday.','Cleaning.','A delivery.'],0,'Due to construction＝工事のため。','なぜ入口は閉鎖されていますか。— 工事のためです。'],['Our hotel breakfast is served from 6:30 to 10:00. Guests may also order room service.\n\nWhen is breakfast served?',['6:30 to 10:00.','5:00 to 8:00.','7:30 to 11:00.','10:00 to noon.'],0,'from 6:30 to 10:00が時間情報。','朝食はいつ提供されますか。— 6時30分から10時です。'],['The museum will be closed Monday for electrical maintenance. Tickets already purchased can be used Tuesday.\n\nWhen can existing tickets be used?',['Tuesday.','Monday.','Friday.','Sunday.'],0,'existing tickets can be used Tuesday。','既購入のチケットはいつ使えますか。— 火曜日です。'],['Employees should submit travel receipts to Accounting within ten days of returning.\n\nWhere should receipts be submitted?',['Accounting.','Human Resources.','Reception.','Security.'],0,'submit ... to Accountingが提出先。','領収書はどこに提出しますか。— 経理部です。'],['The community center is hosting a job fair Saturday. Registration opens at 8:30, and interviews begin at 9.\n\nWhen does registration open?',['8:30.','9:00.','8:00.','10:00.'],0,'Registration opens at 8:30。','登録受付はいつ始まりますか。— 8時30分です。'],['The office elevator will be unavailable tomorrow morning. The stairs and west elevator remain open.\n\nWhat can people use?',['The stairs and west elevator.','Only the parking lot.','The east entrance.','A shuttle bus.'],0,'remain open＝利用可能なまま。','何を利用できますか。— 階段と西側エレベーターです。']],
5:[['The company has ______ the deadline.',['extended','extending','extension','extensively'],0,'has＋過去分詞。extendedが正解。extensionは名詞、extensivelyは副詞。','会社は期限を延長しました。'],['Please make sure the forms are ______.',['complete','completed','completion','completing'],1,'are＋過去分詞で受動態。completedが正解。','書類が完成していることを確認してください。'],['She can ______ difficult problems quickly.',['solve','solved','solving','solution'],0,'canの後ろは動詞原形。solveが正解。','彼女は難しい問題を素早く解決できます。'],['The manager will ______ the proposal tomorrow.',['review','reviewed','reviewing','reviewer'],0,'will＋動詞原形。reviewが正解。','マネージャーは明日その提案を確認します。'],['Employees must ______ their badges at all times.',['wear','wore','wearing','worn'],0,'must＋動詞原形。wearが正解。','従業員は常に身分証を着用しなければなりません。'],['The meeting was ______ because the director was ill.',['postponed','postpone','postponing','postponement'],0,'was＋過去分詞の受動態。postponedが正解。','会議は延期されました。'],['We are looking forward to ______ you next week.',['meeting','meet','met','meets'],0,'look forward toのtoは前置詞。後ろは動名詞meeting。','来週あなたに会うのを楽しみにしています。'],['The new policy will take ______ next month.',['effect','effective','effectively','affect'],0,'take effect＝施行される。effectが名詞。','新しい方針は来月施行されます。'],['Please ______ the attached document carefully.',['read','reading','reads','reader'],0,'Please＋動詞原形。readが正解。','添付書類を注意深く読んでください。'],['The office is ______ located near the station.',['conveniently','convenient','convenience','convenientness'],0,'locatedを修飾するのは副詞conveniently。','そのオフィスは駅の近くという便利な場所にあります。']],
6:[['The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors only.','The manager only.'],0,'who need accessがEmployeesを修飾する関係代名詞節。必要な従業員が連絡する。','誰がFacilitiesに連絡すべきですか。— 入室する必要がある従業員です。'],['A survey is available online for seminar participants. The survey asks about the quality of the presentations and facilities.\n\nWhat does the survey ask about?',['Presentations and facilities.','Travel prices.','Lunch menus.','Train schedules.'],0,'asks aboutの目的語がpresentations and facilities。','アンケートは何について尋ねますか。— プレゼンテーションと施設です。'],['The store will close at 7 p.m. today. Customers may place orders online after closing.\n\nWhat may customers do after closing?',['Place orders online.','Enter the store.','Pick up cash.','Call the manager.'],0,'may place orders onlineと明示。','閉店後、顧客は何ができますか。— オンラインで注文できます。'],['Visitors must sign in at reception and wear a visitor badge. Guests who need parking should ask reception for a permit.\n\nWhat must visitors wear?',['A visitor badge.','A uniform.','A helmet.','A name tag from home.'],0,'must wear a visitor badge。','訪問者は何を着用しなければなりませんか。— 訪問者バッジです。']],
7:[['City Hotel: Check-in begins at 3 p.m. Breakfast is included. Guests may request late checkout for an additional fee.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0,'Breakfast is includedと明記。included＝含まれている。','何が含まれていますか。— 朝食です。'],['Office chairs are 20% off. Customers buying three or more receive free delivery. The offer ends Sunday.\n\nHow much is the discount?',['20%.','10%.','15%.','30%.'],0,'20% offが割引率。offは「割引」の意味。','割引率はいくらですか。— 20%です。'],['To: Staff / From: HR / Please complete the annual training by June 30. Employees who completed it last month do not need to repeat it.\n\nWhat is the deadline?',['June 30.','June 13.','July 30.','May 30.'],0,'by June 30が締切。byは「〜までに」。','締切はいつですか。— 6月30日です。'],['Notice: The parking lot will be closed Saturday for resurfacing. Customers should use the public garage two blocks away.\n\nWhy is the parking lot closed?',['Resurfacing.','A holiday.','A sale.','A meeting.'],0,'for resurfacingが閉鎖理由。','なぜ駐車場は閉鎖されますか。— 舗装工事のためです。'],['Dear Ms. Ito, Thank you for your order. Your items will ship on Tuesday and should arrive within three business days.\n\nWhen will the items ship?',['Tuesday.','Monday.','Wednesday.','Friday.'],0,'will ship on Tuesday。','商品はいつ発送されますか。— 火曜日です。'],['Green Market is looking for weekend staff. Applicants should have customer-service experience. Interviews will be held next Thursday.\n\nWhat experience is preferred?',['Customer-service experience.','Driving experience.','Teaching experience.','Accounting experience.'],0,'Applicants should have customer-service experience。','どんな経験が望まれていますか。— 接客経験です。'],['The fitness center will introduce a new evening class in September. Registration opens August 20. Members can register online or at the front desk.\n\nWhere can members register?',['Online or at the front desk.','By mail only.','At the parking lot.','At the hotel.'],0,'register online or at the front deskと明記。','会員はどこで登録できますか。— オンラインまたは受付です。'],['The museum cafe will close for renovation from May 5 through May 12. The museum itself will remain open.\n\nWhat will remain open?',['The museum.','The cafe.','The restaurant next door.','The parking garage.'],0,'museum itself will remain open。','何が営業を続けますか。— 博物館です。'],['All expense reports must be submitted electronically. Paper copies will no longer be accepted after July 1.\n\nHow must expense reports be submitted?',['Electronically.','By mail.','In person.','By fax.'],0,'must be submitted electronically。','経費報告書はどのように提出しますか。— 電子的に提出します。'],['River Tours offers two-hour boat trips every Saturday. Reservations are recommended because seating is limited.\n\nWhy are reservations recommended?',['Seating is limited.','The trips are free.','The boats are large.','Parking is unavailable.'],0,'because seating is limitedが理由。','なぜ予約が推奨されていますか。— 席に限りがあるからです。']]};
let stats=JSON.parse(localStorage.getItem('toeicStatsV13')||'{}'),wrong=JSON.parse(localStorage.getItem('toeicWrongV13')||'{}');
function persist(){localStorage.setItem('toeicStatsV13',JSON.stringify(stats));localStorage.setItem('toeicWrongV13',JSON.stringify(wrong));}
function menu(){app.innerHTML='<h2>TOEIC 200問トレーニング</h2><p>まずはPart別に実力を確認。回答後は、正解の理由・誤答理由・日本語訳・攻略ポイントを表示します。</p><div class="stats"><div class="stat"><b>'+Object.values(stats).reduce((a,x)=>a+(x.n||0),0)+'</b>回答</div><div class="stat"><b>'+Object.keys(wrong).length+'</b>復習</div><div class="stat"><b>200</b>問</div></div><button class="btn" onclick="startAll()">▶ 200問スタート</button><button class="btn secondary" onclick="review()">🔁 間違い復習</button><h3>Part別</h3>'+Object.keys(parts).map(p=>'<button class="part" onclick="startPart('+p+')">Part '+p+'｜'+parts[p]+'<small>'+[6,25,39,30,30,16,54][p-1]+'問</small></button>').join('');}
function startAll(){let list=[];for(let p=1;p<=7;p++)for(let i=0;i<[6,25,39,30,30,16,54][p-1];i++)list.push([p,i%questions[p].length]);run(list,0,0);}
function startPart(p){run(questions[p].map((_,i)=>[p,i]),0,0);}
function run(list,pos,score){if(pos>=list.length){finish(list,score);return}let [p,i]=list[pos],q=questions[p][i];app.innerHTML='<div class="meta">Part '+p+'｜'+parts[p]+'｜'+(pos+1)+' / '+list.length+'</div><div class="bar"><i style="width:'+Math.round(pos/list.length*100)+'%"></i></div><section class="card"><div class="q">'+q[0]+'</div><div class="choices" id="choices"></div><div id="exp"></div><button class="btn" id="next" style="display:none">次の問題 →</button></section><button class="btn secondary home" onclick="menu()">ホームへ</button>';q[1].forEach((text,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+text;b.onclick=()=>answer(list,pos,score,j);document.getElementById('choices').appendChild(b);});}
function answer(list,pos,score,n){let [p,i]=list[pos],q=questions[p][i],ok=n===q[2],key=p+'-'+i;if(!stats[key])stats[key]={n:0,c:0};stats[key].n++;if(ok){stats[key].c++;delete wrong[key];score++}else wrong[key]=1;persist();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===n&&j!==q[2])b.classList.add('wrong')});let html='<div class="box"><span class="tag">'+(ok?'⭕ 正解':'❌ 不正解')+'</span><br><b>正解：'+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</b></div><div class="box"><span class="tag">なぜ正解？</span><br>'+q[3]+'</div><div class="box"><span class="tag">選択肢チェック</span><br>'+q[1].map((x,j)=>String.fromCharCode(65+j)+'. '+x+' — '+(j===q[2]?'⭕ 正解':'❌ 不正解')).join('<br>')+'</div><div class="box"><span class="tag">日本語訳</span><br>'+q[4]+'</div><div class="box tip"><span class="tag">TOEIC攻略</span><br>'+tip(p)+'</div>';if(!ok)html+='<div class="box">🔁 間違い復習に登録しました。</div>';document.getElementById('exp').innerHTML=html;document.getElementById('next').style.display='block';document.getElementById('next').onclick=()=>run(list,pos+1,score);}
function tip(p){return ['','人物・物・位置・動作の4点に絞って聞く。','最初に疑問詞を確認し、答えの種類を予測する。','設問を先読みし、人物・場所・時間・目的を拾う。','数字・日時・場所・理由などの具体情報を狙う。','空欄前後→品詞→文法→意味の順で判断する。','空欄前後だけでなく文全体の流れを見る。','設問のキーワードを本文で探し、条件・数字・時系列を照合する。'][p]}
function finish(list,score){app.innerHTML='<h2>🎉 終了</h2><div class="stats"><div class="stat"><b>'+score+'</b>正解</div><div class="stat"><b>'+Math.round(score/list.length*100)+'%</b>正答率</div><div class="stat"><b>'+list.length+'</b>問題</div></div><button class="btn" onclick="menu()">ホームへ</button><button class="btn secondary" onclick="review()">間違い復習</button>';}
function review(){let keys=Object.keys(wrong);app.innerHTML='<h2>🔁 間違い復習</h2>';if(!keys.length)app.innerHTML+='<div class="box">復習する問題はありません。👍</div>';keys.forEach(k=>{let [p,i]=k.split('-').map(Number);let b=document.createElement('button');b.className='part';b.textContent='Part '+p+'｜問題 '+(i+1);b.onclick=()=>run([[p,i]],0,0);app.appendChild(b)});let h=document.createElement('button');h.className='btn secondary';h.textContent='ホームへ';h.onclick=menu;app.appendChild(h);}
menu();
</script></body></html>
