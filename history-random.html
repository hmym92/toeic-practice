<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学歴史・ランダム選択肢</title><style>body{margin:0;background:#f3f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:#173f5f;color:#fff;padding:18px}main{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}button{width:100%;border:0;border-radius:11px;padding:14px;margin:6px 0;font-size:16px;background:#edf1f4}.primary{background:#173f5f;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.selected{outline:3px solid #3caea3}.hide{display:none}.q{font-size:19px;font-weight:bold;line-height:1.6}.small{font-size:12px;color:#667}.bar{height:7px;background:#ddd;border-radius:8px;margin:12px 0;overflow:hidden}.bar span{display:block;height:100%;background:#3caea3;width:0}.good{background:#dff5ef!important}.bad{background:#ffe4df!important}.feedback{padding:12px;border-radius:10px;line-height:1.6}.score{text-align:center;font-size:34px;font-weight:bold}</style></head><body><header><b>📚 中学歴史・選択肢ランダム版</b><div class="small" style="color:#fff">第1章＋第2章第1節／100問以上</div></header><main><div id="home" class="card"><h2>範囲</h2><div class="grid"><button id="ra" class="selected">📖 全範囲</button><button id="r1">第1章</button><button id="r2">第2章 第1節</button></div><h2>レベル</h2><div class="grid"><button id="la" class="selected">全部</button><button id="lb">🟢 基礎</button><button id="ls">🟡 標準</button><button id="lv">🔴 応用</button></div><button id="start" class="primary">▶ 20問スタート</button><button id="review">🔄 間違い問題を復習</button></div><div id="quiz" class="card hide"><div id="info" class="small"></div><div class="bar"><span id="prog"></span></div><div id="qq" class="q"></div><div id="ans"></div><div id="fb"></div><button id="next" class="primary hide">次の問題 →</button></div><div id="result" class="card hide"><h2>🎉 結果</h2><div id="sc" class="score"></div><p id="msg"></p><button id="again" class="primary">もう一度</button><button id="back">ホームへ</button></div></main><script>
(function(){'use strict';
var Q=[];function add(r,l,q,a,c,e){Q.push({r:r,l:l,q:q,a:a,c:c,e:e})}
fetch('history100.html?v=1').then(function(res){return res.text()}).then(function(html){
 var s=html.substring(html.indexOf('var Q=[];function add'),html.indexOf("var range='all'"));
 s=s.substring(s.indexOf('\n')+1); eval(s); Q.forEach(function(x){var pairs=x.a.map(function(v,n){return {v:v,ok:n===x.c}});pairs.sort(function(){return Math.random()-.5});x.a=pairs.map(function(p){return p.v});x.c=pairs.findIndex(function(p){return p.ok})}); init();
}).catch(function(){alert('問題データを読み込めませんでした。通信を確認してください。')});
var range='all',level='all',list=[],i=0,score=0;
function $(x){return document.getElementById(x)}function pick(id,ids){ids.forEach(function(x){$(x).classList.remove('selected')});$(id).classList.add('selected')}function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function init(){
$('ra').onclick=function(){range='all';pick('ra',['ra','r1','r2'])};$('r1').onclick=function(){range='ch1';pick('r1',['ra','r1','r2'])};$('r2').onclick=function(){range='ch2';pick('r2',['ra','r1','r2'])};$('la').onclick=function(){level='all';pick('la',['la','lb','ls','lv'])};$('lb').onclick=function(){level='basic';pick('lb',['la','lb','ls','lv'])};$('ls').onclick=function(){level='std';pick('ls',['la','lb','ls','lv'])};$('lv').onclick=function(){level='adv';pick('lv',['la','lb','ls','lv'])};
$('start').onclick=function(){var a=Q.filter(function(x){return(range==='all'||x.r===range)&&(level==='all'||x.l===level)});begin(a)};
$('review').onclick=function(){var ids=JSON.parse(localStorage.getItem('historyWrong')||'[]');var a=Q.filter(function(_,n){return ids.indexOf(n)>=0});if(!a.length){alert('まだ間違い問題がありません。まず問題を解いてみよう！');return}begin(a)};
$('again').onclick=function(){var a=Q.filter(function(x){return(range==='all'||x.r===range)&&(level==='all'||x.l===level)});begin(a)};$('back').onclick=function(){$('result').classList.add('hide');$('home').classList.remove('hide')};
}
function begin(a){list=shuffle(a).slice(0,20);i=0;score=0;$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');show()}
function show(){var x=list[i];$('info').textContent=(x.r==='ch1'?'第1章':'第2章 第1節')+'・'+(x.l==='basic'?'基礎':x.l==='std'?'標準':'応用')+'　'+(i+1)+' / '+list.length;$('prog').style.width=(i/list.length*100)+'%';$('qq').textContent='Q'+(i+1)+'　'+x.q;$('ans').innerHTML='';$('fb').innerHTML='';$('fb').className='';$('next').classList.add('hide');x.a.forEach(function(v,n){var b=document.createElement('button');b.textContent=(n+1)+'　'+v;b.onclick=function(){answer(n,b)};$('ans').appendChild(b)})}
function answer(n,b){var x=list[i],bs=$('ans').children;for(var j=0;j<bs.length;j++)bs[j].disabled=true;bs[x.c].classList.add('good');if(n===x.c){score++;b.classList.add('good');$('fb').className='feedback good';$('fb').innerHTML='⭕ 正解！<br>'+x.e}else{b.classList.add('bad');$('fb').className='feedback bad';$('fb').innerHTML='❌ 不正解。正解は「'+x.a[x.c]+'」<br>'+x.e;var id=Q.indexOf(x),ids=JSON.parse(localStorage.getItem('historyWrong')||'[]');if(ids.indexOf(id)<0)ids.push(id);localStorage.setItem('historyWrong',JSON.stringify(ids))}$('next').classList.remove('hide')}
$('next').onclick=function(){i++;if(i<list.length)show();else finish()};function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');var p=Math.round(score/list.length*100);$('sc').textContent=score+' / '+list.length+'問（'+p+'%）';$('msg').textContent=p>=90?'すばらしい！':p>=70?'いい感じ！間違いを復習してさらに伸ばそう。':'教科書を確認して、もう一度挑戦しよう。'}
})();</script></body></html>
