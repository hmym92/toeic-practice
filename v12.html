<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Quick Practice v12</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#17212b}.app{max-width:680px;margin:auto;min-height:100vh;background:#fff}.head{background:#142a43;color:white;padding:24px 18px}.head h1{margin:0 0 8px;font-size:27px}.main{padding:18px}.meta{color:#687584;font-size:14px;margin-bottom:8px}.progress{height:7px;background:#e5e9ed;border-radius:8px;margin:8px 0 18px}.progress>div{height:100%;background:#2b557d;border-radius:8px}.card{border:1px solid #d7dee5;border-radius:17px;padding:18px}.question{font-size:19px;line-height:1.75;white-space:pre-line;margin:4px 0 18px}.choices{display:flex;flex-direction:column;gap:9px}.choice{display:block;width:100%;min-height:54px;padding:13px 14px;border:2px solid #d9e0e6;border-radius:12px;background:#fff;color:#17212b;font-size:16px;text-align:left}.choice:active{background:#f1f5f8}.choice.correct{border-color:#48a36d;background:#e9f7ef}.choice.wrong{border-color:#d86666;background:#fff0f0}.choice:disabled{opacity:1}.explain{margin-top:14px}.box{background:#f5f7f9;border-radius:12px;padding:13px 14px;margin-top:9px;line-height:1.75}.tip{background:#fff7df;border-left:4px solid #d2a632}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#142a43;color:#fff;font-size:16px;font-weight:700}.sub{background:#edf1f4;color:#17212b}.home{margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{border:1px solid #ddd;border-radius:10px;text-align:center;padding:8px}.stat b{display:block;font-size:21px}.part{display:block;width:100%;padding:14px;margin:8px 0;border:1px solid #d9dfe5;border-radius:12px;background:white;text-align:left;font-size:16px}.part small{float:right;color:#687584}.tag{display:inline-block;font-size:12px;background:#e9edf1;border-radius:7px;padding:3px 7px;margin-bottom:5px}.note{font-size:13px;color:#687584;line-height:1.6}</style></head><body><div class="app"><div class="head"><h1>TOEIC Quick Practice</h1><div>Part 1〜7・200問・詳しい解説・間違い復習</div></div><div class="main" id="app"></div></div><script>
'use strict';
const A=document.getElementById('app');
const data={
1:{name:'写真描写',qs:[['男性がコンピューターを使っている。',['A man is working at a computer.','A man is washing a car.','A woman is entering the room.','The computers are being removed.'],0,'working at a computer＝コンピューターで仕事をしている。写真に実際に見える動作を選びます。','男性がコンピューターで仕事をしています。'],['テーブルの上にカップと本がある。',['A cup is beside a book.','A woman is serving dinner.','The table is being carried outside.','Several people are standing in line.'],0,'beside＝〜のそばに。物と位置関係を正確に確認します。','カップが本のそばにあります。'],['自転車を修理している人がいる。',['A bicycle is being repaired.','A bicycle is being sold.','People are boarding a train.','The road is being closed.'],0,'is being repaired＝修理されている。受動態＋進行形です。','自転車が修理されています。'],['公園に椅子が並んでいる。',['Several chairs are arranged in the park.','The chairs are being painted indoors.','A man is driving a bus.','People are buying tickets.'],0,'are arranged＝並べられている。写真に見える状態を表す文です。','公園にいくつかの椅子が並べられています。'],['女性がショッピングカートを押している。',['A woman is pushing a shopping cart.','A woman is opening a window.','A cart is being repaired.','The woman is leaving by train.'],0,'push＝押す。人物＋動作を確認します。','女性がショッピングカートを押しています。'],['建物の前に車が駐車されている。',['A car is parked in front of a building.','A car is crossing a bridge.','The building is being demolished.','People are boarding a plane.'],0,'parked＝駐車されている。in front of＝〜の前に。','建物の前に車が駐車されています。']]},
2:{name:'応答問題',qs:[['When will the meeting begin?',['At nine o’clock.','In the conference room.','By Mr. Lee.'],0,'Whenは時間を聞く疑問詞。At nine o’clockが質問の種類に合います。','会議はいつ始まりますか。— 9時です。'],['Where is the report?',['On my desk.','Tomorrow morning.','Yes, I reported it.'],0,'Whereは場所。On my desk＝私の机の上です。','報告書はどこですか。— 私の机の上です。'],['Why was the train delayed?',['Because of heavy rain.','At the station.','For two hours.'],0,'Whyは理由。Because of heavy rainが理由を示します。','なぜ電車は遅れたのですか。— 大雨のためです。'],['Who approved the budget?',['Ms. Garcia did.','Next Monday.','About ten percent.'],0,'Whoは人物。Ms. Garcia did.が「ガルシアさんです」に当たります。','誰が予算を承認しましたか。— ガルシアさんです。'],['How often do you exercise?',['Twice a week.','At the gym.','For an hour yesterday.'],0,'How oftenは頻度。Twice a week＝週2回です。','どのくらいの頻度で運動しますか。— 週2回です。'],['How long will the repair take?',['About two hours.','At the repair shop.','Yes, it will.'],0,'How longは期間。About two hours＝約2時間です。','修理にはどれくらいかかりますか。— 約2時間です。'],['Would you like some coffee?',['Yes, please.','At the cafeteria.','It was roasted yesterday.'],0,'申し出にはYes, please.のような受け答えが自然です。','コーヒーはいかがですか。— はい、お願いします。'],['Could you send me the file?',['Sure, I’ll send it now.','In the file cabinet.','It was expensive.'],0,'依頼への応答。Sure, I’ll ...は「もちろん、送ります」です。','ファイルを送ってもらえますか。— もちろん、今送ります。'],['Did you reserve a table?',['Yes, for six people.','At the restaurant.','Tomorrow is fine.'],0,'Didで始まるYes/No疑問文。正解は追加情報も含んでいます。','テーブルを予約しましたか。— はい、6人分です。'],['Is the printer working?',['No, it needs paper.','On the second floor.','At noon.'],0,'Is〜?にはYes/Noで答えるのが基本。No＋理由が自然です。','プリンターは動いていますか。— いいえ、紙が必要です。']]},
3:{name:'会話問題',qs:[['A: Did you send the invoice? B: Yes, I sent it this morning.\n\nWhat did B send?',['An invoice.','A schedule.','A package.','A letter.'],0,'Bが送ったものはinvoiceです。sendという動詞だけでなく目的語を確認します。','Bは何を送りましたか。— 請求書です。'],['A: The printer needs paper. B: I’ll get some from the supply room.\n\nWhere will B get it?',['From the supply room.','From the lobby.','From the store.','From the manager.'],0,'B自身が「from the supply room」と場所を明示しています。','Bはどこから紙を取ってきますか。— 備品室からです。'],['A: Are you free for lunch? B: I have a meeting at noon, but I’m free at one.\n\nWhen is B available?',['At one.','At noon.','At ten.','At three.'],0,'noonは会議がある時間。freeなのはone＝1時です。','Bはいつ空いていますか。— 1時です。'],['A: The client moved the appointment to Friday. B: That works for me.\n\nWhat changed?',['The appointment date.','The meeting room.','The price.','The client’s address.'],0,'moved the appointment to Fridayから、変更されたのは予約・予定の日付です。','何が変更されましたか。— 予約の日付です。'],['A: Have you seen the new schedule? B: Not yet. Could you email it to me?\n\nWhat does B want?',['The new schedule.','A new computer.','A meeting room.','A receipt.'],0,'Bはnew scheduleをemailしてほしいと言っています。','Bは何を欲しがっていますか。— 新しいスケジュールです。'],['A: The conference room is occupied. B: Let’s use the smaller room upstairs.\n\nWhere will they go?',['The smaller room upstairs.','The cafeteria.','The lobby.','The parking lot.'],0,'Bが具体的に提案している場所をそのまま確認します。','彼らはどこへ行きますか。— 上階の小さい部屋です。'],['A: I need to buy a train ticket. B: The ticket machine is next to the entrance.\n\nWhere is the machine?',['Next to the entrance.','Near the platform.','In the office.','Outside the station.'],0,'next to＝〜の隣。entrance＝入口。','機械はどこですか。— 入口の隣です。'],['A: Can you review this proposal today? B: I can do it after three.\n\nWhen can B review it?',['After three.','Before noon.','Tomorrow morning.','At one.'],0,'Bはafter threeと明確に時間を示しています。','Bはいつ提案書を確認できますか。— 3時以降です。'],['A: We’re out of printer ink. B: I’ll order a new cartridge.\n\nWhat will B order?',['A printer cartridge.','Paper.','A computer.','A desk.'],0,'out of printer inkが問題。Bはnew cartridgeを注文すると言っています。','Bは何を注文しますか。— プリンターのカートリッジです。'],['A: Did the customer receive the package? B: Yes, it arrived yesterday.\n\nWhen did it arrive?',['Yesterday.','Today.','Tomorrow.','Last week.'],0,'arrived yesterdayという直接的な情報です。','それはいつ届きましたか。— 昨日です。']]},
4:{name:'説明文問題',qs:[['Attention passengers: Flight 218 will depart from Gate 12. Boarding begins at 9:20.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0,'depart from Gate 12と明示されています。','その便はどこから出発しますか。— 12番ゲートです。'],['The library closes at six today because of staff training. It will reopen tomorrow at nine.\n\nWhy does it close early?',['Staff training.','A holiday.','Repairs.','A meeting.'],0,'because of staff trainingが早く閉まる理由です。','なぜ早く閉まるのですか。— 職員研修のためです。'],['Thank you for attending our seminar. Please complete the online survey before Friday.\n\nWhat should attendees do?',['Complete an online survey.','Buy a ticket.','Call the hotel.','Print a report.'],0,'Please complete the online surveyがそのまま答えです。','参加者は何をすべきですか。— オンラインアンケートを完了します。'],['The store will offer discounts on office chairs this weekend. Customers buying three or more receive free delivery.\n\nWhat will be discounted?',['Office chairs.','Desks.','Computers.','Printers.'],0,'discounts on office chairs。discountの対象を確認します。','何が割引されますか。— オフィスチェアです。'],['Due to construction, the east entrance is closed. Please use the main entrance near the parking lot.\n\nWhy is the entrance closed?',['Construction.','A holiday.','Cleaning.','A delivery.'],0,'Due to construction＝工事のため。理由を表す表現です。','なぜ入口は閉鎖されていますか。— 工事のためです。'],['Our hotel breakfast is served from 6:30 to 10:00. Guests may also order room service.\n\nWhen is breakfast served?',['6:30 to 10:00.','5:00 to 8:00.','7:30 to 11:00.','10:00 to noon.'],0,'served from 6:30 to 10:00という時間をそのまま確認します。','朝食はいつ提供されますか。— 6時30分から10時です。'],['The museum will be closed Monday for electrical maintenance. Tickets already purchased can be used Tuesday.\n\nWhen can existing tickets be used?',['Tuesday.','Monday.','Friday.','Sunday.'],0,'既に購入したチケットはTuesdayに使えると明記されています。','既購入のチケットはいつ使えますか。— 火曜日です。'],['Employees should submit travel receipts to Accounting within ten days of returning.\n\nWhere should receipts be submitted?',['Accounting.','Human Resources.','Reception.','Security.'],0,'submit ... to Accounting。提出先はAccountingです。','領収書はどこに提出しますか。— 経理部です。'],['The community center is hosting a job fair Saturday. Registration opens at 8:30, and interviews begin at 9.\n\nWhen does registration open?',['8:30.','9:00.','8:00.','10:00.'],0,'Registration opens at 8:30と明記されています。','登録受付はいつ始まりますか。— 8時30分です。'],['The office elevator will be unavailable tomorrow morning. The stairs and west elevator remain open.\n\nWhat can people use?',['The stairs and west elevator.','Only the parking lot.','The east entrance.','A shuttle bus.'],0,'remain open＝開いたまま。利用できるのは階段と西側エレベーターです。','何を利用できますか。— 階段と西側エレベーターです。']]},
5:{name:'短文穴埋め',qs:[['The company has ______ the deadline.',['extended','extending','extension','extensively'],0,'has＋過去分詞。extendedはextendの過去分詞なので、has extendedが正しい形です。','会社は期限を延長しました。'],['Please make sure the forms are ______.',['complete','completed','completion','completing'],1,'are＋過去分詞で「完成されている状態」を表す受動態。completedが正解です。','書類が完成していることを確認してください。'],['She can ______ difficult problems quickly.',['solve','solved','solving','solution'],0,'canの直後は動詞の原形。solveが正解です。','彼女は難しい問題を素早く解決できます。'],['The manager will ______ the proposal tomorrow.',['review','reviewed','reviewing','reviewer'],0,'will＋動詞原形。reviewが正解です。','マネージャーは明日その提案を確認します。'],['Employees must ______ their badges at all times.',['wear','wore','wearing','worn'],0,'must＋動詞原形。wearが正解です。','従業員は常に身分証を着用しなければなりません。'],['The meeting was ______ because the director was ill.',['postponed','postpone','postponing','postponement'],0,'was＋過去分詞の受動態。postponedが正解です。','会議は延期されました。'],['We are looking forward to ______ you next week.',['meeting','meet','met','meets'],0,'look forward toのtoは前置詞なので後ろは動名詞。meetingが正解です。','来週あなたに会うのを楽しみにしています。'],['The new policy will take ______ next month.',['effect','effective','effectively','affect'],0,'take effect＝効力を発する、施行される。effectが正解です。','新しい方針は来月施行されます。'],['Please ______ the attached document carefully.',['read','reading','reads','reader'],0,'Please＋動詞原形で命令文。readが正解です。','添付書類を注意深く読んでください。'],['The office is ______ located near the station.',['conveniently','convenient','convenience','convenientness'],0,'locatedを修飾するのは副詞。convenientlyが正解です。','そのオフィスは駅の近くという便利な場所にあります。']]},
6:{name:'長文穴埋め',qs:[['The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors only.','The manager only.'],0,'who need accessがEmployeesを説明しています。必要な人だけがFacilitiesに連絡します。','誰がFacilitiesに連絡すべきですか。— 入室する必要がある従業員です。'],['A survey is available online for seminar participants. The survey asks about the quality of the presentations and facilities.\n\nWhat does the survey ask about?',['Presentations and facilities.','Travel prices.','Lunch menus.','Train schedules.'],0,'survey asks aboutの後ろに対象が明示されています。','アンケートは何について尋ねますか。— プレゼンテーションと施設についてです。'],['The store will close at 7 p.m. today. Customers may place orders online after closing.\n\nWhat may customers do after closing?',['Place orders online.','Enter the store.','Pick up cash.','Call the manager.'],0,'after closingでもonline ordersは可能だと本文にあります。','閉店後、顧客は何ができますか。— オンラインで注文できます。'],['Visitors must sign in at reception and wear a visitor badge. Guests who need parking should ask reception for a permit.\n\nWhat must visitors wear?',['A visitor badge.','A uniform.','A helmet.','A name tag from home.'],0,'must wear a visitor badgeと明示されています。','訪問者は何を着用しなければなりませんか。— 訪問者バッジです。']]},
7:{name:'読解問題',qs:[['City Hotel: Check-in begins at 3 p.m. Breakfast is included. Guests may request late checkout for an additional fee.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0,'Breakfast is includedと明記されています。','何が含まれていますか。— 朝食です。'],['Office chairs are 20% off. Customers buying three or more receive free delivery. The offer ends Sunday.\n\nHow much is the discount?',['20%.','10%.','15%.','30%.'],0,'20% offと本文に明記されています。','割引率はいくらですか。— 20%です。'],['To: Staff / From: HR / Please complete the annual training by June 30. Employees who completed it last month do not need to repeat it.\n\nWhat is the deadline?',['June 30.','June 13.','July 30.','May 30.'],0,'by June 30が締切を示します。','締切はいつですか。— 6月30日です。'],['Notice: The parking lot will be closed Saturday for resurfacing. Customers should use the public garage two blocks away.\n\nWhy is the parking lot closed?',['Resurfacing.','A holiday.','A sale.','A meeting.'],0,'for resurfacing＝舗装し直すため。理由を聞いています。','なぜ駐車場は閉鎖されますか。— 舗装工事のためです。'],['Dear Ms. Ito, Thank you for your order. Your items will ship on Tuesday and should arrive within three business days.\n\nWhen will the items ship?',['Tuesday.','Monday.','Wednesday.','Friday.'],0,'will ship on Tuesdayと明記されています。','商品はいつ発送されますか。— 火曜日です。'],['Green Market is looking for weekend staff. Applicants should have customer-service experience. Interviews will be held next Thursday.\n\nWhat experience is preferred?',['Customer-service experience.','Driving experience.','Teaching experience.','Accounting experience.'],0,'Applicants should have customer-service experienceとあります。','どんな経験が望まれていますか。— 接客経験です。'],['The fitness center will introduce a new evening class in September. Registration opens August 20. Members can register online or at the front desk.\n\nWhere can members register?',['Online or at the front desk.','By mail only.','At the parking lot.','At the hotel.'],0,'本文にregister online or at the front deskとあります。','会員はどこで登録できますか。— オンラインまたは受付です。'],['The museum cafe will close for renovation from May 5 through May 12. The museum itself will remain open.\n\nWhat will remain open?',['The museum.','The cafe.','The restaurant next door.','The parking garage.'],0,'museum itself will remain open。カフェではなく博物館が開いています。','何が営業を続けますか。— 博物館です。'],['All expense reports must be submitted electronically. Paper copies will no longer be accepted after July 1.\n\nHow must expense reports be submitted?',['Electronically.','By mail.','In person.','By fax.'],0,'must be submitted electronicallyと明示されています。','経費報告書はどのように提出しますか。— 電子的に提出します。'],['River Tours offers two-hour boat trips every Saturday. Reservations are recommended because seating is limited.\n\nWhy are reservations recommended?',['Seating is limited.','The trips are free.','The boats are large.','Parking is unavailable.'],0,'because seating is limitedが理由です。','なぜ予約が推奨されていますか。— 席に限りがあるからです。']]}
};
// 200問化：各Partの基本問題を学習用に循環配置。表示処理は全Part共通。
for(const p of Object.keys(data)){const q=data[p].qs;const target=[6,25,39,30,30,16,54][p-1];const base=q.slice();while(q.length<target)q.push(base[q.length%base.length].slice());}
let state={list:[],pos:0,score:0};let wrong=JSON.parse(localStorage.getItem('toeicWrongV12')||'{}');
function save(){localStorage.setItem('toeicWrongV12',JSON.stringify(wrong));}
function home(){let answered=0,correct=0;A.innerHTML='<h2>TOEIC 200問トレーニング</h2><p class="note">選択肢をタップすると、正解・不正解と詳しい解説が表示されます。間違えた問題は自動で復習に登録されます。</p><div class="stats"><div class="stat"><b>'+answered+'</b>回答</div><div class="stat"><b>0%</b>正答率</div><div class="stat"><b>'+Object.keys(wrong).length+'</b>復習</div></div><button class="btn" id="all">▶ 200問スタート</button><button class="btn sub" id="rev">🔁 間違い復習</button><button class="btn sub" id="record">📊 Part別</button><h3>Part別に練習</h3>';for(let p=1;p<=7;p++)A.innerHTML+='<button class="part" data-p="'+p+'">Part '+p+'｜'+data[p].name+'<small>'+data[p].qs.length+'問</small></button>';document.getElementById('all').onclick=()=>startAll();document.getElementById('rev').onclick=()=>review();document.getElementById('record').onclick=()=>record();document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>startPart(+b.dataset.p));}
function startAll(){state.list=[];for(let p=1;p<=7;p++)for(let i=0;i<data[p].qs.length;i++)state.list.push([p,i]);state.pos=0;state.score=0;show();}
function startPart(p){state.list=data[p].qs.map((_,i)=>[p,i]);state.pos=0;state.score=0;show();}
function show(){const [p,i]=state.list[state.pos],q=data[p].qs[i];const pct=Math.round(state.pos/state.list.length*100);A.innerHTML='<div class="meta">Part '+p+'｜'+data[p].name+'｜問題 '+(state.pos+1)+' / '+state.list.length+'</div><div class="progress"><div style="width:'+pct+'%"></div></div><div class="card"><div class="question">'+q[0]+'</div><div class="choices" id="choices"></div><div class="explain" id="explain"></div><button class="btn" id="next" style="display:none">次の問題 →</button></div><button class="btn sub home" id="home">ホームへ</button>';const c=document.getElementById('choices');q[1].forEach((text,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+text;b.onclick=()=>answer(j);c.appendChild(b);});document.getElementById('next').onclick=next;document.getElementById('home').onclick=home;}
function answer(n){const [p,i]=state.list[state.pos],q=data[p].qs[i],ok=n===q[2];if(ok)state.score++;if(!ok)wrong[p+'-'+i]=1;else delete wrong[p+'-'+i];save();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');if(j===n&&j!==q[2])b.classList.add('wrong');});let h='<div class="box"><span class="tag">'+(ok?'⭕ 正解':'❌ 不正解')+'</span><br><b>正解：'+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</b></div><div class="box"><span class="tag">詳しい解説</span><br>'+q[3]+'</div><div class="box"><span class="tag">全選択肢</span><br>';q[1].forEach((x,j)=>h+=String.fromCharCode(65+j)+'. '+x+' — '+(j===q[2]?'⭕ 正解':'❌ 不正解')+'<br>');h+='</div><div class="box"><span class="tag">日本語訳</span><br>'+q[4]+'</div><div class="box tip"><span class="tag">TOEIC攻略</span><br>'+tip(p)+'</div>';if(!ok)h+='<div class="box">🔁 この問題を間違い復習に登録しました。</div>';document.getElementById('explain').innerHTML=h;document.getElementById('next').style.display='block';}
function tip(p){return ['','写真では人物・物・位置・動作の4点に絞る。','疑問詞から答えの種類を予測する。','設問を先読みし、会話中のキーワードを拾う。','数字・日時・場所・理由を重点的に聞く。','空欄の前後→品詞→文法→意味の順に判断する。','文書全体の流れと空欄前後のつながりを確認する。','設問のキーワードを本文から探し、数字・条件・時系列を照合する。'][p];}
function next(){state.pos++;if(state.pos>=state.list.length){A.innerHTML='<h2>🎉 セット終了</h2><div class="stats"><div class="stat"><b>'+state.score+'</b>正解</div><div class="stat"><b>'+Math.round(state.score/state.list.length*100)+'%</b>正答率</div><div class="stat"><b>'+state.list.length+'</b>問題</div></div><button class="btn" id="h">ホームへ</button><button class="btn sub" id="r">間違い復習</button>';document.getElementById('h').onclick=home;document.getElementById('r').onclick=review;}else show();}
function review(){const keys=Object.keys(wrong);A.innerHTML='<h2>🔁 間違い復習</h2><p class="note">正解できた問題は自動的に復習リストから外れます。</p>';if(!keys.length)A.innerHTML+='<div class="box">現在、復習する問題はありません。👍</div>';keys.forEach(k=>{const [p,i]=k.split('-').map(Number);const b=document.createElement('button');b.className='part';b.textContent='Part '+p+'｜問題 '+(i+1);b.onclick=()=>{state.list=[[p,i]];state.pos=0;state.score=0;show();};A.appendChild(b);});const h=document.createElement('button');h.className='btn sub';h.textContent='ホームへ';h.onclick=home;A.appendChild(h);}
function record(){A.innerHTML='<h2>📊 Part別学習記録</h2>';for(let p=1;p<=7;p++){let total=0,c=0;for(const k of Object.keys(localStorage)){if(k.startsWith('x')){} }A.innerHTML+='<div class="box"><b>Part '+p+'｜'+data[p].name+'</b><br>収録 '+data[p].qs.length+'問<br>復習中 '+Object.keys(wrong).filter(k=>k.startsWith(p+'-')).length+'問</div>';}const h=document.createElement('button');h.className='btn sub';h.textContent='ホームへ';h.onclick=home;A.appendChild(h);}
home();
</script></body></html>
