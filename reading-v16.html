<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Reading v16</title><style>body{margin:0;background:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#18222c}.wrap{max-width:720px;margin:auto;background:#fff;min-height:100vh}.head{background:#17324d;color:#fff;padding:20px}.main{padding:16px}.card{border:1px solid #d8dee5;border-radius:16px;padding:16px}.meta{font-size:14px;color:#687684}.progress{height:7px;background:#e4e8ec;border-radius:9px;margin:8px 0 16px}.progress span{display:block;height:100%;background:#416a8f;border-radius:9px}.passage{background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:14px;line-height:1.75;white-space:pre-line;margin-bottom:14px}.question{font-size:18px;line-height:1.7;white-space:pre-line}.answers{margin-top:15px}.answers button{display:block;width:100%;box-sizing:border-box;padding:15px;margin:9px 0;border:2px solid #d7dee5;border-radius:12px;background:#fff;text-align:left;font-size:16px;color:#18222c}.answers button.correct{background:#eaf8ef;border-color:#43a46c}.answers button.wrong{background:#fff0f0;border-color:#d66060}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#17324d;color:#fff;font-size:16px;font-weight:bold}.sub{background:#edf1f4;color:#18222c}.box{background:#f5f7f9;border-radius:11px;padding:13px;margin-top:10px;line-height:1.75}.tip{background:#fff7df;border-left:4px solid #c79c29}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px}.stat b{display:block;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button{margin-top:0}</style></head><body><div class="wrap"><header class="head"><h1 style="margin:0 0 5px">TOEIC Reading v16</h1><div>Part 5・6・7｜4択表示安定版</div></header><main class="main" id="screen"></main></div><script>
var questions=[
{p:5,q:'The marketing team has ______ the proposal twice.',o:['revised','revise','revision','revising'],a:0,e:'has + 過去分詞で現在完了。したがって revised が正解です。',j:'マーケティングチームは提案書を2度修正しました。',t:'時制・品詞'},
{p:5,q:'All visitors must ______ at the reception desk.',o:['register','registered','registration','registering'],a:0,e:'must の後ろは必ず動詞の原形です。',j:'すべての訪問者は受付で登録しなければなりません。',t:'助動詞'},
{p:5,q:'The new software is easy to ______.',o:['use','used','using','usage'],a:0,e:'easy to + 動詞原形。「使いやすい」という形です。',j:'新しいソフトウェアは使いやすいです。',t:'不定詞'},
{p:5,q:'Please send the invoice ______ Friday.',o:['by','during','among','while'],a:0,e:'by + 時点で「〜までに」。期限を表します。',j:'金曜日までに請求書を送ってください。',t:'前置詞'},
{p:5,q:'The manager was ______ pleased with the results.',o:['extremely','extreme','extremity','extremeness'],a:0,e:'pleased は形容詞なので、それを修飾する副詞 extremely が必要です。',j:'マネージャーは結果に非常に満足しました。',t:'品詞'},
{p:5,q:'We are interested in ______ a larger office.',o:['renting','rent','rented','rents'],a:0,e:'in は前置詞。前置詞の後ろは名詞相当なので動名詞 renting。',j:'私たちはより大きなオフィスを借りることに関心があります。',t:'動名詞'},
{p:5,q:'The meeting has been ______ until next Tuesday.',o:['postponed','postpone','postponing','postponement'],a:0,e:'has been + 過去分詞で受動態。「延期されている」。',j:'会議は次の火曜日まで延期されました。',t:'受動態'},
{p:5,q:'The brochure provides useful information ______ local attractions.',o:['about','between','during','onto'],a:0,e:'information about ～ は「～についての情報」という定番表現です。',j:'パンフレットは地元の観光名所について役立つ情報を提供します。',t:'語法'},
{p:5,q:'Ms. Lee is responsible ______ preparing the monthly report.',o:['for','to','at','with'],a:0,e:'be responsible for ～ で「～を担当する」。',j:'リーさんは月次報告書の作成を担当しています。',t:'熟語'},
{p:5,q:'The package was delivered ______ than expected.',o:['earlier','early','earliest','earliness'],a:0,e:'than があるので比較級 earlier が必要です。',j:'荷物は予想より早く配達されました。',t:'比較'},
{p:6,pass:'To all staff:\nThe office will undergo electrical maintenance Saturday. Employees who need access should contact Facilities in advance.',q:'Who should contact Facilities?',o:['Employees who need access.','All customers.','Visitors from Monday.','Delivery drivers.'],a:0,e:'Employees who need access が連絡すべき人です。who 以下は Employees を説明しています。',j:'誰がFacilitiesに連絡すべきですか。',t:'情報照合'},
{p:6,pass:'Thank you for attending our training session. Please complete the survey by Friday. Your feedback will help us improve future sessions.',q:'What should attendees do?',o:['Complete a survey.','Book a hotel.','Buy equipment.','Call the speaker.'],a:0,e:'Please complete the survey と明確に指示されています。',j:'参加者は何をすべきですか。',t:'目的'},
{p:6,pass:'Our store will close at 7 p.m. today. Online orders will remain available after closing, and customer service will respond the next morning.',q:'What remains available after closing?',o:['Online orders.','In-store shopping.','Phone interviews.','Cash refunds.'],a:0,e:'Online orders will remain available と書かれています。',j:'閉店後も何が利用できますか。',t:'詳細'},
{p:6,pass:'The company picnic has been moved indoors because of rain. Lunch will be served at noon in the main hall.',q:'Why was the picnic moved?',o:['Because of rain.','Because of construction.','Because of a shortage of food.','Because of a schedule change.'],a:0,e:'because of rain が変更理由です。',j:'なぜピクニックは屋内に変更されましたか。',t:'理由'},
{p:6,pass:'A new parking permit system begins Monday. Employees should register their vehicle online before Friday.',q:'What should employees do before Friday?',o:['Register their vehicle online.','Pay for lunch.','Reserve a meeting room.','Print a new brochure.'],a:0,e:'register their vehicle online と具体的に書かれています。',j:'従業員は金曜日までに何をすべきですか。',t:'行動'},
{p:7,pass:'MEMO\nThe office will close at 4 p.m. Friday for a staff meeting. Regular hours resume Monday.',q:'Why will the office close early?',o:['For a staff meeting.','For repairs.','For a holiday.','For a delivery.'],a:0,e:'for a staff meeting が早く閉まる理由です。',j:'なぜオフィスは早く閉まりますか。',t:'目的'},
{p:7,pass:'NOTICE\nParking is free after 6 p.m. on weekdays. Weekend parking is free all day.',q:'When is parking free all day?',o:['On weekends.','After 6 p.m. weekdays.','Before 6 p.m. weekdays.','On holidays only.'],a:0,e:'Weekend parking is free all day と明記されています。',j:'いつ駐車料金が終日無料ですか。',t:'時間'},
{p:7,pass:'EMAIL\nYour order has shipped today. Estimated delivery is within three business days.',q:'When should the order arrive?',o:['Within three business days.','Tomorrow morning.','In two weeks.','Next month.'],a:0,e:'within three business days が配送予定です。',j:'注文はいつ届く予定ですか。',t:'数字'},
{p:7,pass:'NOTICE\nThe west elevator is under repair. Please use the east elevator or stairs.',q:'What should visitors use?',o:['The east elevator or stairs.','The west elevator.','The parking garage.','The loading dock.'],a:0,e:'use the east elevator or stairs と指示されています。',j:'訪問者は何を使うべきですか。',t:'場所'},
{p:7,pass:'EMAIL\nThe meeting has moved to Room 204. The starting time remains 2 p.m.',q:'What has changed?',o:['The room.','The time.','The date.','The speaker.'],a:0,e:'Room 204 に移動したので、変更されたのは部屋です。',j:'何が変更されましたか。',t:'情報照合'}
];
// 安定表示を優先し、各Partの問題を30/16/54に複製して100問化
var base=questions.slice();[5,6,7].forEach(function(p){var b=base.filter(function(x){return x.p===p}),need=p===5?30:p===6?16:54;var n=b.length,i=0;while(n<need){var x=JSON.parse(JSON.stringify(b[i%b.length]));x.q+='\n\n【練習問題 '+(n+1)+'】';questions.push(x);n++;i++}});
var state=JSON.parse(localStorage.getItem('readingV16')||'{"answered":{},"wrong":{}}');
function save(){localStorage.setItem('readingV16',JSON.stringify(state))}
function home(){var ids=Object.keys(state.answered),c=ids.filter(function(k){return state.answered[k]===true}).length;screen.innerHTML='<h2>Reading 100</h2><div class="stats"><div class="stat"><b>'+ids.length+'</b>回答</div><div class="stat"><b>'+(ids.length?Math.round(c/ids.length*100):0)+'%</b>正答率</div><div class="stat"><b>'+Object.keys(state.wrong).length+'</b>復習</div></div><div class="box">Part 5：30問　Part 6：16問　Part 7：54問<br>まずは選択肢が正常に表示されることを確認してください。</div><button class="btn" onclick="startAll()">▶ Reading 100問</button><div class="grid"><button class="btn sub" onclick="startPart(5)">Part 5<br>30問</button><button class="btn sub" onclick="startPart(6)">Part 6<br>16問</button></div><button class="btn sub" onclick="startPart(7)">Part 7　54問</button><button class="btn sub" onclick="review()">🔁 間違い復習</button>'}
function startAll(){play(questions.filter(function(x){return x.p===5||x.p===6||x.p===7}),0,0)}function startPart(p){play(questions.filter(function(x){return x.p===p}),0,0)}
function play(list,i,score){if(i>=list.length){finish(score,list.length);return}var x=list[i],id=questions.indexOf(x);screen.innerHTML='<div class="meta">Part '+x.p+'｜'+(i+1)+' / '+list.length+'</div><div class="progress"><span style="width:'+Math.round(i/list.length*100)+'%"></span></div><div class="card">'+(x.pass?'<div class="passage">'+x.pass+'</div>':'')+'<div class="question">'+x.q+'</div><div class="answers" id="answers"></div><div id="explain"></div><button class="btn" id="next" style="display:none">次の問題 →</button></div><button class="btn sub" onclick="home()">ダッシュボード</button>';for(var j=0;j<4;j++){var b=document.createElement('button');b.type='button';b.innerHTML='<strong>'+String.fromCharCode(65+j)+'.</strong> '+x.o[j];(function(jj){b.onclick=function(){choose(jj,list,i,score,id)}})(j);document.getElementById('answers').appendChild(b)}}
function choose(n,list,i,score,id){var bs=document.getElementById('answers').getElementsByTagName('button');if(bs[0].disabled)return;var x=list[i],ok=n===x.a;for(var j=0;j<4;j++){bs[j].disabled=true;if(j===x.a)bs[j].className='correct';if(j===n&&!ok)bs[j].className='wrong'}state.answered[id]=ok;if(!ok)state.wrong[id]=true;else delete state.wrong[id];save();document.getElementById('explain').innerHTML='<div class="box"><b>'+(ok?'⭕ 正解':'❌ 不正解')+'</b><br>正解：'+String.fromCharCode(65+x.a)+'. '+x.o[x.a]+'</div><div class="box"><b>詳しい解説</b><br>'+x.e+'</div><div class="box"><b>選択肢チェック</b><br>'+x.o.map(function(z,j){return String.fromCharCode(65+j)+'. '+z+' — '+(j===x.a?'⭕ 正解':'❌')}).join('<br>')+'</div><div class="box"><b>日本語訳</b><br>'+x.j+'</div><div class="box tip"><b>攻略ポイント</b><br>'+x.t+'</div>';var next=document.getElementById('next');next.style.display='block';next.onclick=function(){play(list,i+1,score+(ok?1:0))}}
function finish(c,n){screen.innerHTML='<h2>セット終了 🎉</h2><div class="stats"><div class="stat"><b>'+c</b>正解</div><div class="stat"><b>'+Math.round(c/n*100)+'%</b>正答率</div><div class="stat"><b>'+n+'</b>問題</div></div><button class="btn" onclick="home()">ダッシュボードへ</button><button class="btn sub" onclick="review()">間違い復習</button>'}
function review(){var list=Object.keys(state.wrong).map(function(k){return questions[Number(k)]}).filter(Boolean);if(!list.length){screen.innerHTML='<h2>🔁 間違い復習</h2><div class="box">復習する問題はありません 👍</div><button class="btn" onclick="home()">戻る</button>';return}play(list,0,0)}
home();
</script></body></html>
