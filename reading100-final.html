length&&bs[0].disabled)return;var ok=k===x.a;bs.forEach(function(z,j){z.disabled=true;if(j===ci)z.classList.add('ok')});if(!ok)b.classList.add('ng');var id=data.indexOf(x);state.done[id]=ok;if(ok)delete state.wrong[id];else state.wrong[id]=1;save();document.getElementById('result').innerHTML='<div class="box"><b>'+(ok?'⭕ 正解！':'❌ 不正解')+'</b><br>正解：'+String.fromCharCode(65+ci)+'. '+x.o[x.a]+'</div><div class="box explain"><b>詳しい解説</b><br>'+x.e+'</div><div class="box"><b>選択肢チェック</b><br>'+x.o.map(function(v,j){return String.fromCharCode(65+j)+'. '+v+(j===x.a?'　⭕ 正解':'　❌')}).join('<br>')+'</div><button class="btn" id="next">次の問題 →</button>';document.getElementById('next').onclick=function(){run(list,i+1,score+(ok?1:0))}}function finish(c,n){app.innerHTML='<div class="card"><h2>セット終了 🎉</h2><div class="stats"><div class="stat"><b>'+c+'</b>正解</div><div class="stat"><b>'+Math.round(c/n*100)+'%</b>正答率</div><div class="stat"><b>'+n+'</b>問題</div></div><div class="box">間違えた問題は「間違いだけ復習」から解き直せます。</div><button class="btn" onclick="home()">ダッシュボードへ</button></div>'}function review(){var l=Object.keys(state.wrong).map(function(k){return data[+k]}).filter(Boolean);if(!l.length){app.innerHTML='<div class="card"><h2>🔁 間違い復習</h2><div class="box">復習する問題はありません 👍</div><button class="btn" onclick="home()">戻る</button></div>';return}start(l)}home();
