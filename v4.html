<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13263d"><title>TOEIC Quick Practice</title><style>body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#18212b}.app{max-width:560px;margin:auto;background:#fff;min-height:100vh}header{background:#13263d;color:#fff;padding:21px}h1{margin:0;font-size:22px}header p{margin:6px 0 0;font-size:12px;opacity:.82}main{padding:18px}.grid{display:grid;gap:10px}.part,.opt,.btn{width:100%;padding:14px;border-radius:12px;font-size:15px}.part,.opt{background:#fff;border:1px solid #dce2e8;text-align:left}.part b{display:block}.part span,.small{font-size:12px;color:#687584;line-height:1.6}.btn{border:0;background:#13263d;color:#fff;font-weight:700;margin-top:10px}.gray{background:#edf0f3;color:#263746}.q{font-size:18px;line-height:1.65;margin:17px 0}.card{border:1px solid #dce2e8;border-radius:16px;padding:17px}.bar{font-size:12px;color:#687584;display:flex;justify-content:space-between}.prog{height:7px;background:#e8ecf0;border-radius:9px;margin:8px 0 16px;overflow:hidden}.fill{height:100%;background:#2676c9}.ok{background:#e7f7ed;border-color:#42a36a}.ng{background:#fff0f0;border-color:#d55}.feedback{display:none;margin-top:13px;border-radius:13px;background:#f5f8fb;padding:14px;font-size:13px;line-height:1.75}.show{display:block}.feedback h3{margin:0 0 8px;font-size:16px}.label{display:inline-block;font-size:10px;font-weight:700;background:#e9f2ff;color:#1768bb;padding:4px 8px;border-radius:99px;margin:3px 4px 5px 0}.score{text-align:center;font-size:48px;font-weight:800;color:#1768bb}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.stat div{border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center}.stat b{font-size:20px;display:block}.tip{background:#fff9e8;border-left:4px solid #e5b73b;padding:10px;margin-top:10px}.translation{background:#eef6ff;padding:10px;border-radius:9px;margin-top:8px}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><p>Part 1〜7 ・ 200問 ・ 詳細解説</p></header><main id="app"></main></div><script>
var names=['','写真描写','応答問題','会話問題','説明文問題','短文穴埋め','長文穴埋め','読解問題'];
var seeds={
1:[['👩‍💻📄','A woman is working at a computer.'],['☕🪑','A cup is on a table.'],['🚲🌳','A bicycle is parked near a tree.'],['👨‍🍳🍳','A chef is preparing food.'],['📦🚚','Boxes are being loaded onto a truck.']],
2:[['When will the meeting begin?',['At nine o’clock.','In the conference room.','Yes, it began.'],0],['Where is the report?',['On my desk.','Tomorrow morning.','Yes, I reported it.'],0],['Why was the train delayed?',['Because of heavy rain.','At the station.','For two hours.'],0],['Could you help me?',['Of course.','At noon.','It is helpful.'],0],['Who ordered the supplies?',['Ms. Kim did.','Last Tuesday.','At the office.'],0]],
3:[['Woman: Did you send the invoice? Man: Yes, I sent it this morning.\n\nWhat did the man send?',['An invoice.','A schedule.','A package.','A letter.'],0],['Man: The printer needs paper. Woman: I will get some.\n\nWhat will the woman do?',['Get paper.','Repair the printer.','Call a client.','Leave the office.'],0],['Woman: When is the meeting? Man: At three.\n\nWhen is the meeting?',['At three.','At two.','At four.','At five.'],0],['Man: Are you joining lunch? Woman: No, I have an appointment.\n\nWhy will she not join?',['She has an appointment.','She is hungry.','She is traveling.','She is working late.'],0],['Woman: Did you reserve a room? Man: Yes, for Friday.\n\nWhen is the reservation?',['Friday.','Monday.','Tuesday.','Thursday.'],0]],
4:[['Attention passengers: Flight 218 will depart from Gate 12.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0],['The library closes at six today because of staff training.\n\nWhy does it close early?',['Staff training.','A holiday.','Repairs.','A meeting.'],0],['The store offers free delivery this weekend.\n\nWhen is free delivery available?',['This weekend.','Every day.','Next month.','Today only.'],0],['Visitors must sign in at the front desk.\n\nWhat must visitors do?',['Sign in.','Buy a ticket.','Call a manager.','Wear a uniform.'],0],['The theater doors open at 6:30 and the show starts at 7.\n\nWhen do the doors open?',['6:30.','7:00.','6:00.','7:30.'],0]],
5:[['The company has ______ the deadline.',['extended','extending','extension','extensively'],0],['Please make sure the forms are ______.',['complete','completed','completion','completing'],1],['She can ______ difficult problems quickly.',['solve','solved','solving','solution'],0],['The room is available ______ 2 and 4 p.m.',['among','between','during','while'],1],['Please respond ______ to customers.',['prompt','promptly','promptness','prompted'],1]],
6:[['The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors only.','The manager only.'],0],['A survey is available online for seminar participants.\n\nWhat is available online?',['A survey.','A receipt.','A map.','A ticket.'],0],['Your order has shipped and can be tracked online.\n\nWhat can the customer do?',['Track the order.','Change the store.','Cancel the building.','Attend a seminar.'],0],['The east elevator is out of service. Use the west elevator.\n\nWhich elevator should visitors use?',['The west elevator.','The east elevator.','The freight elevator.','The service elevator.'],0],['New security badges will be distributed Wednesday. Bring your current badge.\n\nWhat should employees bring?',['Their current badge.','A passport.','A receipt.','A laptop.'],0]],
7:[['City Hotel: Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0],['Office chairs are 20% off. Customers buying three or more receive free delivery.\n\nWho gets free delivery?',['Customers buying three or more chairs.','Everyone.','Customers buying one chair.','Employees only.'],0],['The 10 a.m. meeting has moved to 11 a.m. because the client’s flight is delayed.\n\nWhy was it moved?',['The flight is delayed.','The room is unavailable.','Sales changed.','The employee was late.'],0],['The west entrance is closed. Please use the main entrance.\n\nWhich entrance should visitors use?',['The main entrance.','The west entrance.','The staff entrance.','The parking entrance.'],0],['Job Fair: Bring several copies of your résumé.\n\nWhat should visitors bring?',['Résumés.','Tickets.','Lunch.','Uniforms.'],0]]};
var counts=[0,20,30,30,30,40,20,30],parts={};for(var p=1;p<=7;p++){parts[p]=[];for(var n=0;n<counts[p];n++){var s=seeds[p][n%seeds[p].length];if(p===1)parts[p].push([s[0],[s[1],'A man is repairing a bicycle.','Several people are swimming.','The room is being cleaned.'],0]);else parts[p].push([s[0],s[1].slice(),s[2]]);}}
var part=0,index=0,score=0,locked=false,stats=JSON.parse(localStorage.getItem('toeic-v4-stats')||'{}');
function explain(q,a,j){var text='';if(part===1){text='<h3>📷 Part 1 解説</h3><b>正解の根拠：</b>写真の中心となる人物・物・動作に注目します。正解文は「woman + working + computer」で、写真の情報と一致します。<div class="tip"><b>ひっかけ注意：</b>写真に「自転車」が写っていても、実際に修理しているとは限りません。<b>見えている事実</b>と、想像を区別しましょう。</div>'}else if(part===2){text='<h3>🎧 Part 2 解説</h3><b>正解の根拠：</b>最初の疑問詞に注目します。<br>'+q.split('?')[0]+'? に対して、正解は内容的に直接答えています。<div class="tip"><b>攻略：</b>When→時間、Where→場所、Who→人、Why→理由、How→方法・程度。質問の種類と答えの種類を一致させます。</div>'}else if(part===3){text='<h3>🎧 Part 3 解説</h3><b>正解の根拠：</b>会話の中から、設問で聞かれている情報をそのまま拾います。特に「Who / What / When / Why」を先に確認してから会話を聞くと、必要な情報を絞れます。<div class="tip"><b>攻略：</b>会話全体を日本語に訳そうとせず、設問のキーワードを探す「部分聞き」が有効です。</div>'}else if(part===4){text='<h3>🎧 Part 4 解説</h3><b>正解の根拠：</b>アナウンス・説明文から、設問が指定した情報を特定します。日時・場所・変更点は特に重要です。<div class="tip"><b>攻略：</b>「instead of」「because」「will」など、変更・理由・予定を示す表現を聞き逃さないようにしましょう。</div>'}else if(part===5){text='<h3>✏️ Part 5 解説</h3><b>正解の根拠：</b>空欄の前後から、必要な品詞・文法を判断します。正解は文の構造と意味の両方に合います。<div class="tip"><b>攻略：</b>まず空欄の前後だけで「名詞・動詞・形容詞・副詞」のどれが必要かを判断し、その後に意味を確認します。</div>'}else if(part===6){text='<h3>📄 Part 6 解説</h3><b>正解の根拠：</b>文章全体の流れと前後関係から答えを決めます。単語だけでなく、誰が・何を・いつ行うのかを確認することが重要です。<div class="tip"><b>攻略：</b>空欄の直前だけで決めず、前後1〜2文まで読んで文脈を確認しましょう。</div>'}else{text='<h3>📚 Part 7 解説</h3><b>正解の根拠：</b>設問のキーワードを本文から探し、該当箇所の前後を読んで判断します。正解の選択肢は本文の内容を言い換えていることがあります。<div class="tip"><b>攻略：</b>最初から全文を精読するより、設問→キーワード→本文確認の順に読むと時間を短縮できます。</div>'}text+='<div class="translation"><b>正解：</b>'+String.fromCharCode(65+a)+'. '+qAnswer(q,a)+'</div><div style="margin-top:8px"><b>今回のポイント：</b>'+point(q,a)+'</div>';if(j!==a)text+='<div style="margin-top:8px"><b>あなたの選択：</b>'+String.fromCharCode(65+j)+'. '+qAnswer(q,j)+'<br>この選択肢は本文・会話・文法条件のいずれかと一致しません。</div>';return text}
function qAnswer(q,i){return parts[part][index][1][i]}
function point(q,a){if(part===5){if(q.indexOf('has ______')>=0)return '<b>has + 過去分詞</b>で現在完了。「has extended」が正しい形です。';if(q.indexOf('are ______')>=0)return '<b>be動詞 + 過去分詞</b>で受動態。「are completed」。';if(q.indexOf('can ______')>=0)return '<b>can + 動詞の原形</b>。「can solve」。';if(q.indexOf('______ 2 and 4')>=0)return '<b>between A and B</b>で「AとBの間」。';return '<b>respond</b>を修飾するので副詞「promptly」が必要です。'}if(part===2){var w=q.split(' ')[0];return '質問文の疑問詞「'+w+'」が求める情報と、正解の種類が一致しています。'}return '正解は問題文の情報と一致し、他の選択肢には本文・会話から確認できない情報が含まれています。'}
function home(){var a=0,c=0,k;for(k in stats){a+=stats[k].a||0;c+=stats[k].c||0}var h='<h2>TOEIC 総合問題集</h2><p class="small">全200問。正解後に「なぜ正解なのか」「ひっかけポイント」「攻略法」を詳しく表示します。</p><div class="stat"><div><b>'+a+'</b>回答数</div><div><b>'+(a?Math.round(c/a*100):0)+'%</b>総合正答率</div></div><div class="grid">';for(k=1;k<=7;k++){var st=stats[k];h+='<button class="part" onclick="start('+k+')"><b>Part '+k+'　'+names[k]+'</b><span>'+counts[k]+'問'+(st?' ・ 正答率 '+Math.round(st.c/st.a*100)+'%':' ・ 未学習')+'</span></button>'}h+='</div><p class="small">※公式TOEIC問題ではなく、学習用オリジナル問題です。TOEIC L&RはListening 100問＋Reading 100問の形式です。citeturn0search0</p>';app.innerHTML=h}
function start(p){part=p;index=0;score=0;locked=false;showQuestion();window.scrollTo(0,0)}function showQuestion(){var q=parts[part][index],html='<div class="bar"><span>Part '+part+'　'+(index+1)+' / '+counts[part]+'</span><span>正解 '+score+'</span></div><div class="prog"><div class="fill" style="width:'+(index/counts[part]*100)+'%"></div></div><div class="card">';if(part===1)html+='<div style="font-size:60px;text-align:center;background:#f7f8fa;border-radius:12px;padding:20px">'+q[0]+'</div><div class="q">写真について最も適切な英文を選んでください。</div>';else html+='<div class="q" style="white-space:pre-line">'+q[0]+'</div>';html+='<div class="grid">';for(var j=0;j<q[1].length;j++)html+='<button class="opt" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+q[1][j]+'</button>';html+='</div><div id="feedback" class="feedback"></div><button id="next" class="btn" style="display:none" onclick="next()">次の問題 →</button><button class="btn gray" onclick="home()">Part選択へ</button></div>';app.innerHTML=html}
function answer(j){if(locked)return;locked=true;var q=parts[part][index],a=q[2],bs=document.querySelectorAll('.opt');for(var x=0;x<bs.length;x++){bs[x].disabled=true;if(x===a)bs[x].classList.add('ok');if(x===j&&j!==a)bs[x].classList.add('ng')}if(j===a)score++;if(!stats[part])stats[part]={a:0,c:0};stats[part].a++;if(j===a)stats[part].c++;localStorage.setItem('toeic-v4-stats',JSON.stringify(stats));document.getElementById('feedback').innerHTML=explain(q[0],a,j);document.getElementById('feedback').className='feedback show';document.getElementById('next').style.display='block';document.getElementById('next').scrollIntoView({behavior:'smooth',block:'nearest'})}function next(){index++;locked=false;if(index>=counts[part])result();else{showQuestion();window.scrollTo(0,0)}}function result(){app.innerHTML='<div class="score">'+score+' / '+counts[part]+'</div><h2 style="text-align:center">Part '+part+' 終了</h2><p style="text-align:center">正答率 '+Math.round(score/counts[part]*100)+'%</p><p class="small">間違えた問題は、解説を読んでから同じタイプをもう一度解くのがおすすめです。</p><button class="btn" onclick="start('+part+')">もう一度</button><button class="btn gray" onclick="home()">Part選択へ</button>}home();
</script></body></html>
