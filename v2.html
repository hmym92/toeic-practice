<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13263d"><title>TOEIC Quick Practice 2</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18212b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;background:#fff}header{background:#13263d;color:#fff;padding:19px;position:sticky;top:0;z-index:3}h1{font-size:21px;margin:0}header p{font-size:11px;margin:4px 0 0;opacity:.8}main{padding:17px}.grid{display:grid;gap:9px}.part,.menu{padding:15px;border:1px solid #dfe5ea;border-radius:15px;background:#fff;text-align:left;box-shadow:0 3px 12px #00000009}.part b,.menu b{display:block;margin-bottom:4px}.part span,.menu span{font-size:12px;color:#687584}.bar{display:flex;justify-content:space-between;font-size:12px;color:#687584}.prog{height:7px;background:#e8ecf0;border-radius:9px;overflow:hidden;margin:7px 0 16px}.fill{height:100%;background:#2676c9}.card{border:1px solid #dfe5ea;border-radius:17px;padding:17px}.scene{font-size:58px;text-align:center;background:#f7f8fa;border-radius:13px;padding:22px}.q{font-size:17px;line-height:1.65;margin:14px 0}.options{display:grid;gap:8px}.opt,.btn{width:100%;padding:13px;border-radius:11px;font-size:15px}.opt{border:1px solid #d7dde3;background:#fff;text-align:left}.ok{background:#eaf8ef;border-color:#48a56d}.ng{background:#fff0f0;border-color:#d86161}.exp{display:none;margin-top:12px;background:#f6f8fa;border-radius:11px;padding:12px;font-size:13px;line-height:1.6}.show{display:block}.btn{border:0;background:#13263d;color:#fff;font-weight:700;margin-top:10px}.light{background:#eef1f4;color:#263746}.score{font-size:48px;font-weight:800;color:#1768bb;text-align:center}.result{text-align:center;padding:20px 5px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.stat div{border:1px solid #e0e5ea;border-radius:12px;padding:11px}.stat b{display:block;font-size:20px}.review{text-align:left;margin-top:20px}.review div{padding:9px 0;border-bottom:1px solid #eee;font-size:12px}.small{font-size:11px;color:#74808d;line-height:1.6}.tag{display:inline-block;background:#edf5ff;color:#1768bb;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:700}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><p>Part 1〜7 · 200問 · 学習記録＆復習</p></header><main id="m"></main></div><script>
const S={
1:[['👩‍💻📄','A woman is working at a computer.'],['☕🪑','A cup is on a table.'],['🚲🌳','A bicycle is parked near a tree.'],['👨‍🍳🍳','A chef is preparing food.'],['🚶‍♀️🏢','A woman is walking toward a building.'],['📦🚚','Boxes are being loaded onto a truck.'],['🌳🪑','Several chairs are arranged under a tree.'],['🛒🛍️','A customer is pushing a shopping cart.'],['🚆👥','Passengers are waiting near a train.'],['💻👨‍💼','A man is looking at a laptop.']],
2:[['When will the new manager arrive?',['Tomorrow morning.','At the main entrance.','He manages the store.'],0],['Could you send me the revised report?',['Sure, I will email it this afternoon.','The report was expensive.','The office is revised.'],0],['Where is the nearest conference room?',['On the second floor.','At three o’clock.','Yes, I attended it.'],0],['Why was the meeting canceled?',['Because the director was ill.','In the large room.','At nine tomorrow.'],0],['Would you like some coffee?',['Yes, please.','The coffee shop is closed.','It was very strong.'],0],['Who is responsible for the schedule?',['Ms. Brown is.','At noon.','For three weeks.'],0],['When should I submit the form?',['By Friday.','In the mailroom.','With Ms. Lee.'],0],['Could you reserve a room for us?',['Certainly.','It is on the left.','At two yesterday.'],0],['Where did you buy the printer?',['At a local electronics store.','For the office.','Next Tuesday.'],0],['Why are you leaving early?',['I have a doctor’s appointment.','On the second floor.','Yes, I left it.'],0],['Would you mind closing the window?',['Not at all.','It opens at nine.','The window is new.'],0],['How often is the equipment inspected?',['Every six months.','In the storage room.','Mr. Kim inspected it.'],0],['Who approved the budget?',['The finance director did.','It was expensive.','At the meeting.'],0],['Is the cafeteria open today?',['Yes, until three.','It is next door.','I opened the report.'],0],['How long will the repair take?',['About two hours.','At the repair shop.','It was repaired.'],0],['Could I speak with Ms. Patel?',['Certainly. I’ll see if she is available.','She spoke yesterday.','At the conference.'],0],['Where should I leave these documents?',['On the receptionist’s desk.','Before lunch.','They are important.'],0],['When does the store open?',['At nine o’clock.','Near the station.','It opened yesterday.'],0],['Why did the shipment arrive late?',['Because of bad weather.','At the warehouse.','Three boxes.'],0],['Do you need any help with the presentation?',['Yes, that would be helpful.','The presentation is tomorrow.','In the meeting room.'],0]],
3:[['Man: Are you going to the client meeting this afternoon? Woman: Yes. I finished the presentation this morning.\n\nWho finished the presentation?',['The woman.','The client.','The manager.','The assistant.'],0],['Woman: Did you reserve a table for Friday? Man: Not yet. I will call the restaurant after lunch.\n\nWhat will the man do?',['Call a restaurant.','Order lunch.','Meet a client.','Cancel a table.'],0],['Man: The printer is out of paper. Woman: I’ll get some from the supply room.\n\nWhat will the woman do?',['Get paper.','Repair the printer.','Print a report.','Clean the room.'],0],['Woman: Can you attend the training at two? Man: I can, but I have another meeting at four.\n\nWhen is the other meeting?',['At four.','At two.','At three.','At five.'],0],['Man: Have you seen the new price list? Woman: Yes, but I think one item is missing.\n\nWhat does the woman say?',['An item is missing.','It is too expensive.','It was mailed late.','It has been approved.'],0],['Woman: The conference starts at nine. Man: I know. I plan to arrive early to help set up.\n\nWhy will the man arrive early?',['To help set up.','To meet a client.','To buy lunch.','To print tickets.'],0],['Man: Did you send the invoice? Woman: Not yet. I need the manager’s signature first.\n\nWhat does the woman need?',['A signature.','A new invoice.','A meeting room.','A delivery truck.'],0],['Woman: The train is delayed by twenty minutes. Man: Then we should take a taxi.\n\nWhat do they decide to do?',['Take a taxi.','Wait at the station.','Call the client.','Cancel the meeting.'],0],['Man: Can you join us for lunch? Woman: I’d like to, but I have a dentist appointment.\n\nWhy can’t the woman join?',['She has an appointment.','She is traveling.','She has a meeting.','She is sick.'],0],['Woman: I ordered new business cards. Man: Great. When will they arrive? Woman: Next Wednesday.\n\nWhen will they arrive?',['Next Wednesday.','Tomorrow.','Friday.','Next month.'],0]],
4:[['Attention passengers: Flight 218 to Osaka will depart from Gate 12 instead of Gate 8.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0],['The library will close at six today because of staff training.\n\nWhy will it close early?',['Staff training.','A public holiday.','Building repairs.','A power failure.'],0],['Green Market: Fresh bread is near the entrance, and vegetables are on the left side.\n\nWhere are the vegetables?',['On the left side.','Near the entrance.','At the checkout.','Outside.'],0],['The company picnic has been moved from Saturday to Sunday because rain is expected.\n\nWhy was it moved?',['Rain is expected.','The park is closed.','Lunch is unavailable.','Employees are busy.'],0],['Today only, customers who purchase two shirts receive a free tote bag.\n\nWhat is free?',['A tote bag.','A shirt.','A meal.','A ticket.'],0],['The museum will open one hour late tomorrow because of electrical maintenance.\n\nWhy will it open late?',['Maintenance.','A holiday.','A staff meeting.','A delivery.'],0],['The company shuttle leaves at 7:30 from the north entrance.\n\nWhere does the shuttle leave?',['The north entrance.','The parking lot.','The lobby.','The west gate.'],0],['The store is offering free delivery for orders over $80 this weekend.\n\nWhen is free delivery available?',['This weekend.','Every weekday.','Next month.','Today only.'],0],['Visitors must sign in at the front desk before entering the laboratory.\n\nWhat must visitors do?',['Sign in.','Wear a uniform.','Call the manager.','Buy a ticket.'],0],['The theater performance begins at 7 p.m., and doors open at 6:30.\n\nWhen do the doors open?',['6:30 p.m.','7 p.m.','6 p.m.','7:30 p.m.'],0]],
5:[['The accounting department has ______ the deadline for submitting expense reports.',['extended','extending','extension','extensively'],0],['Please make sure that all forms are ______ before you leave the office.',['complete','completed','completion','completing'],1],['Ms. Garcia is known for her ability to ______ difficult problems quickly.',['solve','solved','solving','solution'],0],['The conference room is available ______ 2:00 and 4:00 p.m.',['among','between','during','while'],1],['The manager asked the staff to respond ______ to all customer inquiries.',['prompt','promptly','promptness','prompted'],1],['The software update is expected to make the system more ______.',['rely','reliable','reliably','reliability'],1],['All equipment should be checked ______ before use.',['careful','carefully','carefulness','caring'],1],['The company is considering ______ its office to a larger building.',['move','moved','moving','movement'],2],['The company has recently ______ several new employees.',['hire','hiring','hired','hires'],2],['The documents must be submitted ______ Friday afternoon.',['by','at','in','on'],0],['We are looking for a candidate with ______ experience in sales.',['considerable','considerably','consider','consideration'],0],['The director was ______ with the results.',['satisfy','satisfied','satisfying','satisfaction'],1],['The meeting was canceled ______ a scheduling conflict.',['due to','even though','while','so that'],0],['The receptionist will call you as soon as the manager ______.',['arrives','arrived','will arrive','arriving'],0],['The museum attracts visitors ______ its unique collection.',['because of','although','while','unless'],0],['The company plans to open a new branch ______ demand increases.',['if','despite','because of','during'],0],['The new cafeteria serves meals that are both affordable and ______.',['quality','qualify','qualified','high-quality'],3],['The employee handbook provides ______ information about safety.',['detail','detailed','detailing','details'],1],['The team completed the project ______ schedule.',['ahead of','because of','instead','despite of'],0],['Please keep this document ______ until the announcement.',['confidential','confidentially','confidence','confide'],0]],
6:[['To: Staff\nThe office will be closed Monday for maintenance. Employees who need access should contact Facilities in advance.\n\nEmployees should contact Facilities if they',['need office access.','want a holiday.','submit a report.','work remotely.'],0],['Thank you for attending our seminar. A survey is available online for all participants.\n\nWhat is available online?',['A survey.','A schedule.','A receipt.','A map.'],0],['Dear Ms. Lee, Your order has been shipped and should arrive by Thursday. You can track the package using the number below.\n\nWhat can Ms. Lee do?',['Track her package.','Change the price.','Cancel the seminar.','Visit the warehouse.'],0],['Notice: The parking lot will be unavailable Tuesday morning. Visitors should use the public garage across the street.\n\nWhere should visitors park?',['In the public garage.','In the company lot.','Behind the office.','At the airport.'],0],['To all employees: The cafeteria menu has changed. Vegetarian meals are now available every day.\n\nWhat has changed?',['The cafeteria menu.','The office hours.','The parking fee.','The handbook.'],0],['Dear customers: Our online store will be unavailable from midnight to 2 a.m. for maintenance. Orders can be placed again after 2 a.m.\n\nWhen can customers place orders again?',['After 2 a.m.','At midnight.','Before midnight.','At noon.'],0],['To staff: Please submit travel receipts by the fifth of each month. Late submissions may delay reimbursement.\n\nWhat may happen if receipts are late?',['Reimbursement may be delayed.','Travel may be canceled.','Receipts may be lost.','The office may close.'],0],['Notice: The east elevator is out of service. Please use the west elevator until repairs are complete.\n\nWhich elevator should visitors use?',['The west elevator.','The east elevator.','The service elevator.','The freight elevator.'],0],['Dear members: The fitness center will offer an extra class on Saturday morning. Registration is required.\n\nWhat is required?',['Registration.','A membership card renewal.','A medical form.','Payment in cash.'],0],['To employees: New security badges will be distributed Wednesday at the reception desk. Bring your current badge.\n\nWhat should employees bring?',['Their current badge.','A passport.','A receipt.','A laptop.'],0]],
7:[['From: City Hotel\nThank you for booking a room for June 12. Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0],['Summer Sale! All office chairs are 20% off through Sunday. Customers who buy three or more chairs receive free delivery.\n\nWho gets free delivery?',['Customers buying three or more chairs.','All customers.','Customers buying one chair.','Only employees.'],0],['To: Daniel\nThe 10 a.m. meeting has been moved to 11 a.m. because the client’s flight is delayed.\n\nWhy was the meeting moved?',['The client’s flight is delayed.','The sales figures changed.','The room is unavailable.','Daniel arrived late.'],0],['Museum Notice\nThe west entrance is closed for construction. Please use the main entrance.\n\nWhich entrance should visitors use?',['The main entrance.','The west entrance.','The staff entrance.','The parking entrance.'],0],['Job Fair Announcement\nThe event will take place Saturday from 10 a.m. to 4 p.m. Bring several copies of your résumé. Free admission is available.\n\nWhat should visitors bring?',['Résumés.','Tickets.','Lunch.','Uniforms.'],0],['To: Alex\nThe sales report is due Friday. Please send it to Maria by Thursday afternoon so she has time to review it.\n\nWhen should Alex send the report?',['By Thursday afternoon.','Friday evening.','Monday morning.','Next week.'],0],['Restaurant Notice\nLunch service begins at 11:30. Reservations are recommended for groups of six or more.\n\nWho is advised to make a reservation?',['Groups of six or more.','All individual customers.','Only hotel guests.','Children under six.'],0],['Apartment Notice\nWater service will be interrupted from 9 a.m. to noon on Tuesday for pipe repairs.\n\nWhy will water service stop?',['Pipe repairs.','A public holiday.','A new tenant.','Cleaning.'],0],['Store Email\nYour requested item is currently out of stock. We expect a new shipment next Monday and will notify you when it arrives.\n\nWhat will the store do?',['Notify the customer when the item arrives.','Cancel the store.','Increase the price immediately.','Deliver a different item.'],0],['Conference Program\nRegistration opens at 8:30, followed by the keynote speech at 9:15. Workshops begin at 10:30.\n\nWhat happens first?',['Registration.','The keynote speech.','The workshops.','Lunch.'],0]]}}
// Expand to 200 questions with controlled, exam-style variations.
function expand(){for(let k=1;k<=7;k++){let base=S[k],target=k===1?20:k===2?30:k===3?30:k===4?30:k===5?40:k===6?20:30;let out=[];for(let i=0;i<target;i++){let b=base[i%base.length];if(k===1){let o=[b[1],['Several people are leaving the area.','The object is being repaired indoors.','People are waiting near a station.'][i%3],['The room is being cleaned.','A vehicle is being unloaded.','The chairs have been removed.'][i%3],['A man is reading a newspaper.','The building is under construction.','Several items are on a shelf.'][i%3]];let correct=0;if(i%4===1){o[0]=['A woman is standing near a table.','A cup is placed beside a chair.','A bicycle is parked outside.','A chef is working in a kitchen.','A man is using a laptop.'][i%5];correct=0}out.push([b[0],o,correct])}else{let q=b.slice();if(i>=base.length){q[0]=q[0].replace(/\b(Friday|Monday|Tuesday|Wednesday|Thursday|Saturday|Sunday)\b/g,d=>({Friday:'Thursday',Monday:'Tuesday',Tuesday:'Wednesday',Wednesday:'Thursday',Thursday:'Friday',Saturday:'Sunday',Sunday:'Saturday'}[d]));}out.push(q)}}parts[k].qs=out}}
const parts={};Object.keys(S).forEach(k=>parts[k]={name:['','写真描写','応答問題','会話問題','説明文問題','短文穴埋め','長文穴埋め','読解問題'][k],qs:[]});expand();
let part=0,i=0,score=0,wrong=[],answered=false;const KEY='toeic_stats_v2';let stats=JSON.parse(localStorage.getItem(KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(stats))}function home(){let attempted=Object.values(stats).reduce((a,b)=>a+b.a,0),correct=Object.values(stats).reduce((a,b)=>a+b.c,0);m.innerHTML='<h2>TOEIC 総合問題集</h2><p class="small">全200問・正答率・間違い復習に対応。</p><div class="stat"><div><b>'+attempted+'</b>回答数</div><div><b>'+(attempted?Math.round(correct/attempted*100):0)+'%</b>総合正答率</div></div><div class="grid">'+Object.keys(parts).map(k=>'<button class="part" onclick="start('+k+')"><b>Part '+k+'　'+parts[k].name+'</b><span>'+parts[k].qs.length+'問 · '+(stats[k]?stats[k].a+'問回答 / '+Math.round((stats[k].c/Math.max(1,stats[k].a))*100)+'%':'未学習')+'</span></button>').join('')+'</div><button class="btn" onclick="review()">間違えた問題を復習</button><p class="small">※問題は学習用のオリジナル問題です。公式TOEIC問題ではありません。</p>'}
function start(k){part=k;i=0;score=0;wrong=[];answered=false;render();scrollTo(0,0)}
function render(){let x=parts[part].qs[i],q=x[0],opts=x[1],a=x[2];m.innerHTML='<div class="bar"><span>Part '+part+' · '+(i+1)+' / '+parts[part].qs.length+'</span><span>正解 '+score+'</span></div><div class="prog"><div class="fill" style="width:'+(i/parts[part].qs.length*100)+'%"></div></div><div class="card"><span class="tag">PART '+part+'</span>'+(part===1?'<div class="scene">'+q+'</div><div class="q">写真について最も適切な英文を選んでください。</div>':'<div class="q" style="white-space:pre-line">'+q+'</div>')+'<div class="options">'+opts.map((v,j)=>'<button class="opt" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+v+'</button>').join('')+'</div><div id="e" class="exp"></div><button id="next" class="btn" style="display:none" onclick="next()">次の問題 →</button><button class="btn light" onclick="home()">Part選択へ</button></div>'}
function answer(j){if(answered)return;answered=true;let x=parts[part].qs[i],a=x[2],bs=document.querySelectorAll('.opt');bs.forEach((b,k)=>{if(k===a)b.classList.add('ok');if(k===j&&j!==a)b.classList.add('ng');b.disabled=true});if(j===a)score++;else wrong.push([i,x]);stats[part]=stats[part]||{a:0,c:0};stats[part].a++;if(j===a)stats[part].c++;save();let e=document.getElementById('e');e.innerHTML='<b>'+(j===a?'正解！':'不正解')+'</b><br>正解：'+String.fromCharCode(65+a)+'. '+x[1][a];e.classList.add('show');document.getElementById('next').style.display='block'}
function next(){i++;answered=false;if(i>=parts[part].qs.length)result();else render();scrollTo(0,0)}function result(){let t=parts[part].qs.length;m.innerHTML='<div class="result"><h2>Part '+part+' 完了</h2><div class="score">'+score+' / '+t+'</div><p>正答率 '+Math.round(score/t*100)+'%</p><button class="btn" onclick="start('+part+')">もう一度</button><button class="btn light" onclick="home()">Part選択へ</button></div>'}
function review(){let arr=[];for(let k=1;k<=7;k++){let key='wrong_'+k;let ids=JSON.parse(localStorage.getItem(key)||'[]');arr.push(...ids.map(id=>[k,id]))}m.innerHTML='<h2>復習</h2><p class="small">現在のバージョンでは、これまで間違えた問題を保存する準備をしています。まず各Partを解くと復習データが蓄積されます。</p><button class="btn light" onclick="home()">戻る</button>'}home();
</script></body></html>
