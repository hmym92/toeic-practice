<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Quick Practice v8</title><style>body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#17212b}.app{max-width:620px;margin:auto;background:#fff;min-height:100vh}header{background:#13263d;color:white;padding:20px}main{padding:16px}.btn,.choice{width:100%;padding:15px;margin:6px 0;border-radius:12px;border:1px solid #d8dfe6;background:white;font-size:16px;text-align:left}.btn{background:#13263d;color:white;text-align:center;border:0;font-weight:bold}.sub{background:#edf1f4;color:#17212b}.ok{background:#e6f7ed;border-color:#4ba66d}.ng{background:#fff0f0;border-color:#d45c5c}.card{border:1px solid #d8dfe6;border-radius:16px;padding:16px}.q{font-size:18px;line-height:1.7;margin:16px 0}.small{font-size:13px;color:#687584;line-height:1.6}.box{padding:13px;border-radius:12px;background:#f4f7fa;margin-top:10px;line-height:1.7}.tip{background:#fff8df;padding:13px;border-left:4px solid #d9ae37;margin-top:10px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{border:1px solid #ddd;border-radius:10px;text-align:center;padding:10px;font-size:12px}.stat b{display:block;font-size:22px}.hidden{display:none}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><div class="small" style="color:white">Part 1〜7｜問題・解説・復習・学習記録</div></header><main id="app"></main></div><script>
(function(){
const A=document.getElementById('app');
const parts={1:{name:'写真描写',qs:[['📷 👩‍💻','A woman is working at a computer.',['A woman is working at a computer.','A man is repairing a bicycle.','Several people are swimming.','The room is being cleaned.'],0,'人物＋動作','写真に実際に見える動作だけを選びます。'],['📷 ☕','A cup is on a table.',['A cup is on a table.','A man is opening a door.','The table is being moved.','People are waiting outside.'],0,'物＋位置','on は「〜の上に」。位置関係を確認します.'],['📷 🚲','A bicycle is parked near a tree.',['A bicycle is parked near a tree.','A woman is riding a bus.','A tree is being cut down.','The bicycle is being repaired.'],0,'状態','parked は「停められている」。'] ]},2:{name:'応答問題',qs:[['When will the meeting begin?',['At nine o’clock.','In the conference room.','Yes, it began.'],0,'疑問詞','When は時間を尋ねる語です。'],['Where is the report?',['On my desk.','Tomorrow morning.','Yes, I reported it.'],0,'疑問詞','Where なら場所の答えを探します。'],['Why was the train delayed?',['Because of heavy rain.','At the station.','For two hours.'],0,'疑問詞','Why なら理由の答えです。']]},3:{name:'会話問題',qs:[['Did you send the invoice? Yes, I sent it this morning.\n\nWhat did the man send?',['An invoice.','A schedule.','A package.','A letter.'],0,'What問題','invoice＝請求書。設問の名詞を会話から探します。'],['The printer needs paper. I will get some.\n\nWhat will the woman do?',['Get paper.','Repair the printer.','Call a client.','Leave the office.'],0,'What問題','will はこれからする行動の手掛かりです。']]},4:{name:'説明文問題',qs:[['Attention passengers: Flight 218 will depart from Gate 12.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0,'場所','Gate＝搭乗口。場所情報を拾います。'],['The library closes at six today because of staff training.\n\nWhy does it close early?',['Staff training.','A holiday.','Repairs.','A meeting.'],0,'理由','because of の後ろが理由です。']]},5:{name:'短文穴埋め',qs:[['The company has ______ the deadline.',['extended','extending','extension','extensively'],0,'現在完了','has＋過去分詞。extended が正解です。'],['Please make sure the forms are ______.',['complete','completed','completion','completing'],1,'受動態','are＋過去分詞。completed が正解です。'],['She can ______ difficult problems quickly.',['solve','solved','solving','solution'],0,'助動詞','can＋動詞原形です。']]},6:{name:'長文穴埋め',qs:[['The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors only.','The manager only.'],0,'人物特定','who が尋ねている人物を本文から確認します。'],['A survey is available online for seminar participants.\n\nWhat is available online?',['A survey.','A receipt.','A map.','A ticket.'],0,'内容特定','available online の対象を探します。']]},7:{name:'読解問題',qs:[['City Hotel: Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0,'情報検索','included の直前後に注目します。'],['Office chairs are 20% off. Customers buying three or more receive free delivery.\n\nWho gets free delivery?',['Customers buying three or more chairs.','Everyone.','Customers buying one chair.','Employees only.'],0,'条件','three or more＝3つ以上です。']]}};
let data={ans:{},wrong:{},history:[]};try{data=JSON.parse(localStorage.toeic8||JSON.stringify(data))}catch(e){}function save(){localStorage.toeic8=JSON.stringify(data)}
let st={p:0,i:0,score:0,locked:false};
function home(){let total=Object.keys(data.ans).length,correct=Object.values(data.ans).filter(x=>x).length;A.innerHTML='<h2>TOEIC 総合問題集</h2><p class="small">まずは各Partを練習。回答後に「正解の理由・全選択肢・日本語・攻略ポイント」を確認できます。</p><div class="stat"><div><b>'+total+'</b>回答</div><div><b>'+(total?Math.round(correct/total*100):0)+'%</b>正答率</div><div><b>'+Object.keys(data.wrong).length+'</b>復習</div></div><button class="btn" onclick="T.record()">📊 学習記録</button><button class="btn" onclick="T.review()">🔁 間違い復習</button><h3>Partを選ぶ</h3>';for(let p=1;p<=7;p++)A.innerHTML+='<button class="btn sub" onclick="T.start('+p+')">Part '+p+'　'+parts[p].name+'</button>'}
function start(p,i=0){st={p:p,i:i,score:0,locked:false};show()}
function show(){let q=parts[st.p].qs[st.i];A.innerHTML='<p class="small">Part '+st.p+'｜'+parts[st.p].name+'｜問題 '+(st.i+1)+' / '+parts[st.p].qs.length+'</p><div class="card"><div class="q" style="white-space:pre-line">'+q[0]+'</div>';q[2].forEach((x,n)=>A.innerHTML+='<button class="choice" onclick="T.answer('+n+')">'+String.fromCharCode(65+n)+'. '+x+'</button>');A.innerHTML+='<div id="exp"></div><button id="next" class="btn hidden" onclick="T.next()">次の問題 →</button></div><button class="btn sub" onclick="T.home()">ホームへ</button>'}
function answer(n){if(st.locked)return;st.locked=true;let q=parts[st.p].qs[st.i],ok=n===q[3];if(ok)st.score++;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('ok');if(i===n&&!ok)b.classList.add('ng')});let k=st.p+'-'+st.i;data.ans[k]=ok;if(ok)delete data.wrong[k];else data.wrong[k]=1;data.history.unshift({p:st.p,i:st.i,ok:ok});data.history=data.history.slice(0,100);save();let h='<div class="box"><b>① 正解の理由</b><br>'+q[5]+'</div><div class="box"><b>② 全選択肢</b><br>';q[2].forEach((x,i)=>h+=String.fromCharCode(65+i)+'. '+x+' — '+(i===q[3]?'⭕ 正解':'❌ 今回の答えには合いません')+'<br>');h+='</div><div class="box"><b>③ 日本語</b><br>'+translate(q[2][q[3]])+'</div><div class="box"><b>④ 重要ポイント</b><br>'+q[4]+'</div><div class="tip"><b>⑤ TOEIC攻略</b><br>'+tip(st.p)+'</div>';if(!ok)h+='<div class="box"><b>⑥ 今回の弱点</b><br>間違えた問題は自動的に「間違い復習」に入ります。</div>';document.getElementById('exp').innerHTML=h;document.getElementById('next').classList.remove('hidden')}
function translate(s){let d={'A woman is working at a computer.':'女性がコンピューターで仕事をしています。','A cup is on a table.':'カップがテーブルの上にあります。','A bicycle is parked near a tree.':'自転車が木の近くに停められています。','At nine o’clock.':'9時です。','On my desk.':'私の机の上です。','Because of heavy rain.':'大雨が理由です。','An invoice.':'請求書です。','Get paper.':'紙を取りに行きます。','Gate 12':'12番ゲートです。','Staff training.':'職員研修です。','extended':'延長した','completed':'完了した','solve':'解決する','Breakfast.':'朝食です。','Customers buying three or more chairs.':'椅子を3脚以上購入する顧客です。'};return d[s]||'正解の選択肢の意味を確認しましょう。'}
function tip(p){return p===1?'写真にないことを想像しない。':p===2?'疑問詞を最初に聞き取る。':p===3||p===4?'設問を先に読み、必要な情報だけを拾う。':p===5?'空欄の前後から品詞・文法を判断する。':p===6?'空欄だけでなく文全体の意味を見る。':'設問のキーワードを本文から探す。'}
function next(){st.i++;if(st.i>=parts[st.p].qs.length){A.innerHTML='<h2>Part '+st.p+' 終了</h2><div class="stat"><div><b>'+st.score+'</b>正解</div><div><b>'+Math.round(st.score/parts[st.p].qs.length*100)+'%</b>正答率</div><div><b>'+parts[st.p].qs.length+'</b>問</div></div><button class="btn" onclick="T.start('+st.p+')">もう一度</button><button class="btn sub" onclick="T.home()">ホームへ</button>'}else show()}
function review(){let ks=Object.keys(data.wrong);A.innerHTML='<h2>🔁 間違い復習</h2><p class="small">間違えた問題だけをもう一度解きます。正解するとリストから外れます。</p>';if(!ks.length)A.innerHTML+='<div class="box">現在、復習待ちの問題はありません。</div>';ks.forEach(k=>{let [p,i]=k.split('-').map(Number);A.innerHTML+='<button class="btn sub" onclick="T.reviewOne('+p+','+i+')">Part '+p+'｜問題 '+(i+1)+'</button>'});A.innerHTML+='<button class="btn sub" onclick="T.home()">ホームへ</button>'}
function reviewOne(p,i){start(p,i)}
function record(){A.innerHTML='<h2>📊 学習記録</h2>';for(let p=1;p<=7;p++){let keys=Object.keys(data.ans).filter(k=>k.startsWith(p+'-')),c=keys.filter(k=>data.ans[k]).length;A.innerHTML+='<div class="box"><b>Part '+p+' '+parts[p].name+'</b><br>回答 '+keys.length+'問　正答率 '+(keys.length?Math.round(c/keys.length*100):0)+'%<br>復習 '+Object.keys(data.wrong).filter(k=>k.startsWith(p+'-')).length+'問</div>'}A.innerHTML+='<button class="btn sub" onclick="T.home()">ホームへ</button>'}
window.T={home,start,answer,next,review,reviewOne,record};home();
})();</script></body></html>
