<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13263d"><title>TOEIC Quick Practice</title><style>body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#18212b}.app{max-width:560px;margin:auto;background:#fff;min-height:100vh}header{background:#13263d;color:#fff;padding:22px}h1{margin:0;font-size:22px}header p{margin:6px 0 0;font-size:12px;opacity:.8}main{padding:18px}.grid{display:grid;gap:10px}.part,.opt,.btn{width:100%;padding:14px;border-radius:12px;font-size:15px}.part,.opt{background:#fff;border:1px solid #dce2e8;text-align:left}.part b{display:block}.part span,.small{font-size:12px;color:#687584;line-height:1.6}.btn{border:0;background:#13263d;color:#fff;font-weight:700;margin-top:10px}.gray{background:#edf0f3;color:#263746}.q{font-size:18px;line-height:1.65;margin:17px 0}.card{border:1px solid #dce2e8;border-radius:16px;padding:17px}.bar{font-size:12px;color:#687584;display:flex;justify-content:space-between}.prog{height:7px;background:#e8ecf0;border-radius:9px;margin:8px 0 16px;overflow:hidden}.fill{height:100%;background:#2676c9}.ok{background:#e7f7ed;border-color:#42a36a}.ng{background:#fff0f0;border-color:#d55}.feedback{display:none;margin-top:13px;border-radius:13px;background:#f5f8fb;padding:14px;font-size:13px;line-height:1.8}.show{display:block}.feedback h3{margin:0 0 8px;font-size:16px}.tip{background:#fff8e5;border-left:4px solid #e3b73d;padding:10px;margin-top:10px}.translation{background:#eef6ff;padding:10px;border-radius:9px;margin-top:9px}.score{text-align:center;font-size:48px;font-weight:800;color:#1768bb;margin-top:30px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.stat div{border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center}.stat b{font-size:20px;display:block}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><p>Part 1〜7 ・ 200問 ・ 詳細解説</p></header><main id="screen"></main></div><script>
(function(){
'use strict';
var screen=document.getElementById('screen');
var names=['','写真描写','応答問題','会話問題','説明文問題','短文穴埋め','長文穴埋め','読解問題'];
var counts=[0,20,30,30,30,40,20,30];
var seed={
1:[['👩‍💻📄','A woman is working at a computer.'],['☕🪑','A cup is on a table.'],['🚲🌳','A bicycle is parked near a tree.'],['👨‍🍳🍳','A chef is preparing food.'],['📦🚚','Boxes are being loaded onto a truck.']],
2:[['When will the meeting begin?',['At nine o’clock.','In the conference room.','Yes, it began.'],0],['Where is the report?',['On my desk.','Tomorrow morning.','Yes, I reported it.'],0],['Why was the train delayed?',['Because of heavy rain.','At the station.','For two hours.'],0],['Could you help me?',['Of course.','At noon.','It is helpful.'],0],['Who ordered the supplies?',['Ms. Kim did.','Last Tuesday.','At the office.'],0]],
3:[['Woman: Did you send the invoice? Man: Yes, I sent it this morning.\n\nWhat did the man send?',['An invoice.','A schedule.','A package.','A letter.'],0],['Man: The printer needs paper. Woman: I will get some.\n\nWhat will the woman do?',['Get paper.','Repair the printer.','Call a client.','Leave the office.'],0],['Woman: When is the meeting? Man: At three.\n\nWhen is the meeting?',['At three.','At two.','At four.','At five.'],0],['Man: Are you joining lunch? Woman: No, I have an appointment.\n\nWhy will she not join?',['She has an appointment.','She is hungry.','She is traveling.','She is working late.'],0],['Woman: Did you reserve a room? Man: Yes, for Friday.\n\nWhen is the reservation?',['Friday.','Monday.','Tuesday.','Thursday.'],0]],
4:[['Attention passengers: Flight 218 will depart from Gate 12.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0],['The library closes at six today because of staff training.\n\nWhy does it close early?',['Staff training.','A holiday.','Repairs.','A meeting.'],0],['The store offers free delivery this weekend.\n\nWhen is free delivery available?',['This weekend.','Every day.','Next month.','Today only.'],0],['Visitors must sign in at the front desk.\n\nWhat must visitors do?',['Sign in.','Buy a ticket.','Call a manager.','Wear a uniform.'],0],['The theater doors open at 6:30 and the show starts at 7.\n\nWhen do the doors open?',['6:30.','7:00.','6:00.','7:30.'],0]],
5:[['The company has ______ the deadline.',['extended','extending','extension','extensively'],0,'現在完了'],['Please make sure the forms are ______.',['complete','completed','completion','completing'],1,'受動態'],['She can ______ difficult problems quickly.',['solve','solved','solving','solution'],0,'助動詞'],['The room is available ______ 2 and 4 p.m.',['among','between','during','while'],1,'前置詞'],['Please respond ______ to customers.',['prompt','promptly','promptness','prompted'],1,'品詞'],['The manager spoke very ______ during the meeting.',['clear','clearly','clarity','clearing'],1,'品詞']],
6:[['The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors only.','The manager only.'],0],['A survey is available online for seminar participants.\n\nWhat is available online?',['A survey.','A receipt.','A map.','A ticket.'],0],['Your order has shipped and can be tracked online.\n\nWhat can the customer do?',['Track the order.','Change the store.','Cancel the building.','Attend a seminar.'],0],['The east elevator is out of service. Use the west elevator.\n\nWhich elevator should visitors use?',['The west elevator.','The east elevator.','The freight elevator.','The service elevator.'],0],['New security badges will be distributed Wednesday. Bring your current badge.\n\nWhat should employees bring?',['Their current badge.','A passport.','A receipt.','A laptop.'],0]],
7:[['City Hotel: Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0],['Office chairs are 20% off. Customers buying three or more receive free delivery.\n\nWho gets free delivery?',['Customers buying three or more chairs.','Everyone.','Customers buying one chair.','Employees only.'],0],['The 10 a.m. meeting has moved to 11 a.m. because the client’s flight is delayed.\n\nWhy was it moved?',['The flight is delayed.','The room is unavailable.','Sales changed.','The employee was late.'],0],['The west entrance is closed. Please use the main entrance.\n\nWhich entrance should visitors use?',['The main entrance.','The west entrance.','The staff entrance.','The parking entrance.'],0],['Job Fair: Bring several copies of your résumé.\n\nWhat should visitors bring?',['Résumés.','Tickets.','Lunch.','Uniforms.'],0]]};
var parts={};
for(var p=1;p<=7;p++){parts[p]=[];for(var n=0;n<counts[p];n++){var s=seed[p][n%seed[p].length];parts[p].push([s[0],s[1].slice(),s[2]||0,s[3]||'']);}}
var currentPart=0,current=0,score=0,locked=false;
var stats={};try{stats=JSON.parse(localStorage.getItem('toeic-v5-stats')||'{}')}catch(e){stats={};}
function save(){try{localStorage.setItem('toeic-v5-stats',JSON.stringify(stats))}catch(e){}}
function home(){var a=0,c=0,k,st,h='<h2>TOEIC 総合問題集</h2><p class="small">全200問。正解後に、正解の理由・日本語の意味・ひっかけ・攻略法を表示します。</p>';for(k in stats){a+=stats[k].a||0;c+=stats[k].c||0}h+='<div class="stat"><div><b>'+a+'</b>回答数</div><div><b>'+(a?Math.round(c/a*100):0)+'%</b>総合正答率</div></div><div class="grid">';for(k=1;k<=7;k++){st=stats[k];h+='<button class="part" onclick="window.TOEIC.start('+k+')"><b>Part '+k+'　'+names[k]+'</b><span>'+counts[k]+'問'+(st?' ・ 正答率 '+Math.round(st.c/st.a*100)+'%':' ・ 未学習')+'</span></button>'}h+='</div><p class="small">※公式問題ではなく、学習用オリジナル問題です。</p>';screen.innerHTML=h}
function start(p){currentPart=p;current=0;score=0;locked=false;show();window.scrollTo(0,0)}
function show(){var q=parts[currentPart][current],h='<div class="bar"><span>Part '+currentPart+'　'+(current+1)+' / '+counts[currentPart]+'</span><span>正解 '+score+'</span></div><div class="prog"><div class="fill" style="width:'+(current/counts[currentPart]*100)+'%"></div></div><div class="card">';if(currentPart===1){h+='<div style="font-size:60px;text-align:center;background:#f7f8fa;border-radius:12px;padding:20px">'+q[0]+'</div><div class="q">写真について最も適切な英文を選んでください。</div>'}else{h+='<div class="q" style="white-space:pre-line">'+q[0]+'</div>'}h+='<div class="grid">';for(var j=0;j<q[1].length;j++)h+='<button class="opt" onclick="window.TOEIC.answer('+j+')">'+String.fromCharCode(65+j)+'. '+q[1][j]+'</button>';h+='</div><div id="feedback" class="feedback"></div><button id="next" class="btn" style="display:none" onclick="window.TOEIC.next()">次の問題 →</button><button class="btn gray" onclick="window.TOEIC.home()">Part選択へ</button></div>';screen.innerHTML=h}
function detail(q,a,j){var ans=q[1][a],chosen=q[1][j],text='';if(currentPart===1){text='<h3>📷 Part 1 詳細解説</h3><b>正解の理由：</b>写真に実際に写っている人物・物・動作だけを確認します。正解文は「woman（女性）」「working（仕事をしている）」「computer（コンピューター）」の3点が写真と一致します。<div class="tip"><b>ひっかけ：</b>写真に自転車などが写っていても、repairing（修理している）とは限りません。TOEICでは「写真から推測できること」ではなく「写真で確認できること」を選びます。</div>'}else if(currentPart===2){text='<h3>🎧 Part 2 詳細解説</h3><b>正解の理由：</b>質問の最初の疑問詞を確認します。Whenなら時間、Whereなら場所、Whoなら人、Whyなら理由が答えになります。<div class="tip"><b>攻略：</b>質問を聞いた瞬間に「何を答える問題か」を決めると、選択肢を聞き分けやすくなります。</div>'}else if(currentPart===3||currentPart===4){text='<h3>🎧 Part '+currentPart+' 詳細解説</h3><b>正解の理由：</b>設問で聞かれている情報を、会話・アナウンス本文から探します。日時・場所・人物・理由などのキーワードに注目します。<div class="tip"><b>攻略：</b>全部を日本語に訳す必要はありません。設問を先に確認し、必要な情報だけを拾う練習をしましょう。</div>'}else if(currentPart===5){text='<h3>✏️ Part 5 詳細解説</h3><b>正解の理由：</b>空欄の前後から必要な文法・品詞を判断します。'+(q[3]?'<br><br><b>今回の文法：</b>'+q[3]:'')+'<div class="tip"><b>攻略：</b>まず「名詞・動詞・形容詞・副詞のどれが必要か」を考え、その後に意味を確認します。</div>'}else if(currentPart===6){text='<h3>📄 Part 6 詳細解説</h3><b>正解の理由：</b>文章の前後関係を確認し、誰が・何を・いつ行うのかを本文から特定します。<div class="tip"><b>攻略：</b>空欄だけで判断せず、前後の文まで読んで文脈をつかみましょう。</div>'}else{text='<h3>📚 Part 7 詳細解説</h3><b>正解の理由：</b>設問のキーワードを本文から探し、該当部分の前後を確認します。正解は本文の表現を言い換えている場合があります。<div class="tip"><b>攻略：</b>「設問→キーワード→本文」の順で読むと時間を節約できます。</div>'}text+='<div class="translation"><b>正解：</b>'+String.fromCharCode(65+a)+'. '+ans+'</div><div style="margin-top:9px"><b>日本語の意味：</b>'+translate(ans)+'</div>';if(j!==a)text+='<div style="margin-top:9px"><b>あなたの答え：</b>'+String.fromCharCode(65+j)+'. '+chosen+'<br>この選択肢は問題文の条件と一致しません。</div>';return text}
function translate(s){var d={'A woman is working at a computer.':'女性がコンピューターで仕事をしています。','At nine o’clock.':'9時です。','In the conference room.':'会議室です。','Yes, it began.':'はい、始まりました。','On my desk.':'私の机の上です。','Tomorrow morning.':'明日の朝です。','Because of heavy rain.':'大雨のためです。','At the station.':'駅です。','Of course.':'もちろんです。','Ms. Kim did.':'キムさんです。','An invoice.':'請求書です。','Get paper.':'紙を取りに行きます。','At three.':'3時です。','Friday.':'金曜日です。','Gate 12':'12番ゲートです。','Staff training.':'職員研修です。','This weekend.':'今週末です。','Sign in.':'受付で記名します。','6:30.':'6時30分です。','extended':'延長した','completed':'完了した','solve':'解決する','between':'〜の間に','promptly':'迅速に','clearly':'明確に','Breakfast.':'朝食です。','The main entrance.':'正面入口です。','Résumés.':'履歴書です。','Track the order.':'注文品を追跡する。','The west elevator.':'西側のエレベーターです。','Their current badge.':'現在のバッジです。','Customers buying three or more chairs.':'椅子を3脚以上購入する顧客です。','The flight is delayed.':'フライトが遅れているためです。','Employees who need access.':'入室する必要がある従業員です。','A survey.':'アンケートです。'};return d[s]||'本文・選択肢の内容を確認して意味を考えましょう。'}
function answer(j){if(locked)return;locked=true;var q=parts[currentPart][current],a=q[2],bs=document.querySelectorAll('.opt');for(var x=0;x<bs.length;x++){bs[x].disabled=true;if(x===a)bs[x].classList.add('ok');if(x===j&&j!==a)bs[x].classList.add('ng')}if(j===a)score++;if(!stats[currentPart])stats[currentPart]={a:0,c:0};stats[currentPart].a++;if(j===a)stats[currentPart].c++;save();document.getElementById('feedback').innerHTML=detail(q,a,j);document.getElementById('feedback').className='feedback show';document.getElementById('next').style.display='block'}
function next(){current++;locked=false;if(current>=counts[currentPart])result();else{show();window.scrollTo(0,0)}}
function result(){screen.innerHTML='<div class="score">'+score+' / '+counts[currentPart]+'</div><h2 style="text-align:center">Part '+currentPart+' 終了</h2><p style="text-align:center">正答率 '+Math.round(score/counts[currentPart]*100)+'%</p><button class="btn" onclick="window.TOEIC.start('+currentPart+')">もう一度</button><button class="btn gray" onclick="window.TOEIC.home()">Part選択へ</button>'}
window.TOEIC={home:home,start:start,answer:answer,next:next};home();
})();
</script></body></html>
