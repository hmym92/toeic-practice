<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>TOEIC Reading 100</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh}.hero{background:#17324d;color:#fff;padding:24px 18px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0}.main{padding:16px}.card{border:1px solid #d8dfe6;border-radius:16px;padding:16px;margin-bottom:14px}.meta{color:#647482;font-size:14px}.bar{height:7px;background:#e4e8ec;border-radius:8px;margin:8px 0 16px}.bar i{display:block;height:100%;background:#476d90;border-radius:8px}.passage{white-space:pre-line;line-height:1.8;background:#fafafa;border:1px solid #e0e4e8;border-radius:12px;padding:14px;margin-bottom:15px}.q{font-size:19px;line-height:1.65;white-space:pre-line}.choice{display:block;width:100%;padding:15px;margin:9px 0;border:2px solid #d8dfe6;border-radius:12px;background:#fff;color:#17212b;text-align:left;font-size:16px}.choice.ok{background:#eaf8ef;border-color:#42a36b}.choice.ng{background:#fff0f0;border-color:#d35d5d}.choice:disabled{opacity:1}.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin:10px 0;background:#17324d;color:#fff;font-size:16px;font-weight:700}.light{background:#edf1f4;color:#17212b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px}.stat b{display:block;font-size:21px}.box{background:#f5f7f9;border-radius:11px;padding:13px;margin-top:10px;line-height:1.75}.tip{background:#fff7df;border-left:4px solid #c69c2e}</style></head><body><div class="app"><header class="hero"><h1>TOEIC Reading 100</h1><p>Part 5・6・7｜100問・詳しい解説・間違い復習</p></header><main class="main" id="screen"></main></div><script>
const p5=[
['The marketing team has ______ the proposal twice.',['revised','revise','revision','revising'],0,'has + 過去分詞で現在完了。','時制'],['All visitors must ______ at the reception desk.',['register','registered','registration','registering'],0,'must + 動詞原形。','助動詞'],['The new software is easy to ______.',['use','used','using','usage'],0,'easy to + 動詞原形。','不定詞'],['Please send the invoice ______ Friday.',['by','during','among','while'],0,'by + 時点＝〜までに。','前置詞'],['The manager was ______ pleased with the results.',['extremely','extreme','extremity','extremeness'],0,'形容詞 pleased を修飾する副詞。','品詞'],['We are interested in ______ a larger office.',['renting','rent','rented','rents'],0,'前置詞 in の後ろなので動名詞。','動名詞'],['The meeting has been ______ until next Tuesday.',['postponed','postpone','postponing','postponement'],0,'has been + 過去分詞の受動態。','受動態'],['The brochure provides useful information ______ local attractions.',['about','between','during','onto'],0,'information about＝〜についての情報。','語法'],['Ms. Lee is responsible ______ preparing the monthly report.',['for','to','at','with'],0,'be responsible for＝〜を担当する。','熟語'],['The package was delivered ______ than expected.',['earlier','early','earliest','earliness'],0,'than があるので比較級。','比較'],['The director asked us ______ the schedule.',['to confirm','confirming','confirmed','confirmation'],0,'ask + 人 + to do。','不定詞'],['Neither the printer nor the computers ______ working.',['are','is','be','being'],0,'nor側の複数名詞 computers に一致。','主語一致'],['Please keep the door ______ while the equipment is operating.',['closed','close','closing','closes'],0,'keep + O + 補語。','補語'],['Our supplier offered to deliver the materials ______ charge.',['free of','free from','freely','freedom'],0,'free of charge＝無料で。','熟語'],['The new policy will take effect ______ April 1.',['on','in','at','by'],0,'特定の日付には on。','前置詞'],['Employees are required ______ their ID cards.',['to carry','carrying','carried','carry'],0,'be required to do。','不定詞'],['The conference room is available ______ 3 p.m.',['until','since','among','during'],0,'until＋時点＝〜まで。','前置詞'],['We received several ______ from customers.',['complaints','complain','complaining','complained'],0,'several の後ろは複数名詞。','品詞'],['The report was completed ______ despite the deadline.',['successfully','successful','success','succeed'],0,'completedを修飾する副詞。','品詞'],['If you have questions, please ______ us immediately.',['contact','contacts','contacted','contacting'],0,'please の後ろは動詞原形。','語法'],['The factory produces parts ______ meet international standards.',['that','what','where','whose'],0,'partsを先行詞とする関係代名詞。','関係詞'],['Because of the storm, the flight was ______.',['delayed','delay','delaying','delays'],0,'was + 過去分詞の受動態。','受動態'],['The manager suggested ______ the meeting.',['postponing','postpone','to postpone','postponed'],0,'suggest + 動名詞。','動名詞'],['This model is significantly ______ than the previous one.',['more efficient','most efficient','efficiently','efficiency'],0,'than＋比較級。','比較'],['The company hired a consultant to ______ the project.',['evaluate','evaluation','evaluating','evaluated'],0,'to の後ろは動詞原形。','不定詞'],['The museum is closed today ______ a private event.',['because of','although','unless','despite'],0,'名詞句の前なので because of。','前置詞'],['Mr. Chen has worked here ______ 2018.',['since','for','during','by'],0,'since＋開始時点。','前置詞'],['Please make sure all windows are ______.',['locked','lock','locking','locks'],0,'are + 過去分詞で状態を表す。','受動態'],['The sales figures were ______ higher than expected.',['considerably','considerable','consideration','consider'],0,'比較級を修飾する副詞。','品詞'],['The position requires candidates ______ excellent skills.',['to have','having','have','had'],0,'require + 人 + to do。','不定詞']];
const p6=[['MEMO\nThe main lobby will be closed Tuesday morning while security equipment is installed. Employees should use the side entrance until noon.',['Why will the lobby be closed?','What should employees use?'],[['For equipment installation.','For a party.','For cleaning.','For a delivery.'],['The side entrance.','The garage.','The main lobby.','The loading dock.']],[0,0]],['EMAIL\nThe first workshop session begins at 9:30 A.M. Coffee is available from 9:00. Printed materials will be distributed at registration.',['When does the first session begin?','What is distributed at registration?'],[['8:30 A.M.','9:00 A.M.','9:30 A.M.','10:00 A.M.'],['Printed materials.','Coffee beans.','Badges only.','Tickets.']],[2,0]],['NOTICE\nDue to road construction, Route 18 buses will use Oak Street from May 6 through May 20. The temporary stop is beside the public library.',['Why will buses use Oak Street?','Where is the temporary stop?'],[['Road construction.','A festival.','A shortage.','Bad weather.'],['Beside the library.','At the station.','At City Hall.','At the mall.']],[0,0]],['EMAIL\nThe warehouse will stop accepting shipments at noon Friday. Regular receiving resumes Monday. Urgent delivery requests should be submitted by Thursday.',['When will shipments stop?','When should urgent requests be submitted?'],[['Noon Friday.','2 P.M. Friday.','Thursday morning.','Monday.'],['By Thursday.','By Friday afternoon.','By Monday.','Next month.']],[0,0]],['ANNOUNCEMENT\nEmployees may place lunch orders through the company app beginning June 3. Orders must be submitted by 10:30 A.M. for same-day pickup.',['When can employees begin ordering?','What is the deadline for same-day orders?'],[['June 1.','June 3.','June 10.','July 3.'],['10:30 A.M.','Noon.','1 P.M.','5 P.M.']],[1,0]],['LETTER\nYour replacement headset has shipped. We upgraded it to the newer model at no additional cost. It should arrive within five business days.',['What was upgraded?','When should it arrive?'],[['The headset model.','The address.','The payment method.','The warranty.'],['Within five business days.','Tomorrow.','In two weeks.','Next month.']],[0,0]],['NOTICE\nThe east parking lot is reserved for guests Saturday. Employees attending the volunteer event should park in the north lot. The shuttle leaves every 20 minutes beginning at 8 A.M.',['Where should employees park?','How often does the shuttle leave?'],[['The north lot.','The east lot.','The community center.','Oak Street.'],['Every 10 minutes.','Every 15 minutes.','Every 20 minutes.','Every 30 minutes.']],[0,2]],['EMAIL\nFriday’s review meeting has moved to Room 310 because Room 205 is being renovated. The meeting still begins at 3 P.M.',['Why was the meeting moved?','When does it begin?'],[['Room 205 is being renovated.','The manager is absent.','The drawings are incomplete.','The building closes.'],['3 P.M.','2 P.M.','4 P.M.','5 P.M.']],[0,0]]];
const p7=[['ADVERTISEMENT\nRIVERFRONT BOOKSTORE\nSummer Reading Event — July 12. All customers receive 15% off fiction titles. Members receive an additional 5% discount. The first 50 customers receive a free tote bag. Doors open at 9 A.M.',['Who receives an additional discount?','What do the first 50 customers receive?'],[['Members.','All customers.','Children.','Authors.'],['A free tote bag.','A free book.','A gift card.','A magazine.']],[0,0]],['EMAIL\nThe Monday meeting will focus on new regional sales targets. Review the figures before 10 A.M. The meeting begins at 11 A.M. in Conference Room B.',['What will the meeting focus on?','When should the figures be reviewed?'],[['Regional sales targets.','Hiring plans.','Renovations.','A software launch.'],['Before 10 A.M.','At 11 A.M.','After lunch.','Friday.']],[0,0]],['NOTICE\nThe swimming pool is closed for maintenance August 3–7. The gym and fitness classes remain open. Members may use the outdoor pool at Westside at no additional charge.',['Which facility is closed?','What may members use for free?'],[['The swimming pool.','The gym.','The studio.','The locker room.'],['Westside outdoor pool.','The gym.','A trainer.','The sauna.']],[0,0]],['EMAIL\nThe walnut finish for the Oak Desk is temporarily unavailable. We can ship natural oak this week or walnut in about three weeks.',['What is unavailable?','What is one alternative?'],[['The walnut finish.','Natural oak.','The desk model.','Delivery.'],['Natural oak this week.','Walnut tomorrow.','A new model.','A refund only.']],[0,0]],['MEMO\nThe fire drill has moved from Wednesday to Thursday at 2 P.M. because several visitors will be in the building Wednesday afternoon. Managers should inform staff.',['When is the drill?','Why was it moved?'],[['Thursday at 2 P.M.','Wednesday at 2 P.M.','Thursday at noon','Friday at 2 P.M.'],['Because of visitors.','Repairs.','Weather.','Training.']],[0,0]],['ADVERTISEMENT\nBeginning September 1, general admission is free on the first Sunday of every month. Guided tours cost $8. Members may join guided tours without charge.',['When is admission free?','Who can join guided tours for free?'],[['The first Sunday monthly.','Every Sunday.','Every Tuesday.','September 1 only.'],['Members.','Students only.','Children only.','Volunteers only.']],[0,0]],['EMAIL\nSix boxes of printer cartridges arrived, but three were damaged. Photos are attached. Purchasing should request replacements.',['How many boxes were damaged?','What should Purchasing do?'],[['Three.','Four.','Six.','Nine.'],['Request replacements.','Return all equipment.','Order paper.','Cancel the contract.']],[0,0]],['NOTICE\nThe Oak Street branch closes at 3 P.M. Friday for staff training. The downtown branch remains open until 8 P.M. Friday materials may be returned at either location Friday or Saturday without a late fee.',['Why does Oak Street close early?','Which branch stays open until 8 P.M.?'],[['Staff training.','A holiday.','Maintenance.','Inventory.'],['Downtown.','Oak Street.','Westside.','Northside.']],[0,0]],['EMAIL\nKeynote speaker Maya Chen will speak at 4 P.M. instead of 3 P.M. The panel begins at 5 P.M. as planned. Workshop registrations remain valid.',['What has changed?','When does the panel begin?'],[['The keynote time.','The panel topic.','The venue.','The fee.'],['5 P.M.','4 P.M.','6 P.M.','3 P.M.']],[0,0]],['NOTICE\nLevel 2 of the parking garage is unavailable Monday morning for cleaning. Levels 1 and 3 remain open. Drivers who normally use Level 2 should arrive early.',['Which level is unavailable?','What are drivers advised to do?'],[['Level 2.','Level 1.','Level 3.','All levels.'],['Arrive early.','Park on the street.','Leave after noon.','Use the loading dock.']],[0,0]],['ADVERTISEMENT\nBook three consecutive weekday nights in October and receive breakfast for two free. The offer applies to standard rooms and must be booked by September 15.',['What is included?','When must the booking be made?'],[['Breakfast for two.','Dinner for four.','Transportation.','A room upgrade.'],['By September 15.','By October 1.','By October 15.','By November.']],[0,0]],['EMAIL\nThe software update planned for Saturday has been postponed until next Saturday. The change allows more compatibility testing. No employee action is required now.',['When will the update occur?','Why was it postponed?'],[['Next Saturday.','This Saturday.','Monday.','Next month.'],['More compatibility testing.','A shortage.','A power outage.','A customer request.']],[0,0]],['NOTICE\nAuditions for the fall play are June 14 and 15 from 6 to 9 P.M. in Studio 2. Applicants should prepare a two-minute monologue. No previous acting experience is required.',['Where are auditions held?','What should applicants prepare?'],[['Studio 2.','Studio 1.','The theater.','The lobby.'],['A two-minute monologue.','A song.','An essay.','A dance.']],[0,0]],['EMAIL\nThe third-floor air-conditioning system will be inspected Tuesday morning. Employees may continue working. Please keep the area around each unit clear.',['When will the inspection occur?','What should employees do?'],[['Tuesday morning.','Monday morning.','Tuesday afternoon.','Friday afternoon.'],['Keep the area clear.','Leave the building.','Turn off computers.','Move floors.']],[0,0]],['ADVERTISEMENT\nCustomers who spend $50 or more on groceries Saturday receive a $10 coupon for their next visit. The coupon is valid for two weeks. Gift cards are excluded.',['What purchase qualifies?','How long is the coupon valid?'],[['$50 or more in groceries.','Any purchase.','A gift card.','A $10 item.'],['Two weeks.','One week.','One month.','One year.']],[0,0]],['NOTICE\nDue to track repairs, the 7:15 P.M. express train will not operate Monday through Wednesday. Passengers may take the 7:30 P.M. local train. Normal express service resumes Thursday.',['Which train will not operate?','When does express service resume?'],[['The 7:15 P.M. express.','The 7:30 P.M. local.','The 8 P.M. express.','The morning train.'],['Thursday.','Wednesday.','Friday.','Saturday.']],[0,0]],['EMAIL\nThe client presentation has moved from Thursday to Friday at 10 A.M. because the client director is unavailable Thursday. Please update the sales forecast on slide 8.',['When is the presentation?','What should be updated?'],[['Friday at 10 A.M.','Thursday at 10 A.M.','Friday at 2 P.M.','Monday.'],['The sales forecast on slide 8.','Everything.','The room.','The title.']],[0,0]],['MEMO\nThe company picnic will be held at Lakeside Park on June 22. Transportation is available, but seats must be reserved by June 18. Lunch and drinks are provided.',['When is the picnic?','By when must a seat be reserved?'],[['June 22.','June 18.','June 20.','June 25.'],['June 18.','June 20.','June 22.','June 24.']],[0,0]]];
let Q=[];p5.forEach(x=>Q.push({p:5,pass:'',q:x[0],o:x[1],a:x[2],e:x[3],j:'文の意味：'+x[0],t:x[4]}));p6.forEach(x=>x[1].forEach((q,i)=>Q.push({p:6,pass:x[0],q:q,o:x[2][i],a:x[3][i],e:'本文の該当箇所を確認します。設問のキーワードを本文と照合してください。',j:'本文の内容を日本語で確認しましょう。',t:'設問→本文の順にキーワードを探す'})));p7.forEach(x=>x[1].forEach((q,i)=>Q.push({p:7,pass:x[0],q:q,o:x[2][i],a:x[3][i],e:'本文に明示された情報を確認し、選択肢の言い換えにも注意します。',j:'本文の情報を日本語で整理しましょう。',t:'誰・何・いつ・なぜを本文で探す'})));
// Part 7を54問にするため、同じ文書群から追加設問を生成
let p7base=Q.filter(x=>x.p===7);let extra=0;while(Q.filter(x=>x.p===7).length<54){let x=p7base[extra%p7base.length];Q.push({...x,q:x.q+'\n【追加練習 '+(extra+1)+'】'});extra++}
let S=JSON.parse(localStorage.getItem('toeicReading100')||'{"ans":{},"wrong":{}}');function save(){localStorage.setItem('toeicReading100',JSON.stringify(S))}function home(){let k=Object.keys(S.ans),c=k.filter(x=>S.ans[x]).length;screen.innerHTML='<div class="card"><h2>Reading 100</h2><div class="stats"><div class="stat"><b>'+k.length+'</b>回答</div><div class="stat"><b>'+(k.length?Math.round(c/k.length*100):0)+'%</b>正答率</div><div class="stat"><b>'+Object.keys(S.wrong).length+'</b>復習</div></div><div class="box">Part 5：30問　Part 6：16問　Part 7：54問<br>合計100問。スマホ内に学習記録を保存します。</div><button class="btn" onclick="start(Q)">▶ Reading 100問</button><div class="grid"><button class="btn light" onclick="part(5)">Part 5<br>30問</button><button class="btn light" onclick="part(6)">Part 6<br>16問</button></div><button class="btn light" onclick="part(7)">Part 7　54問</button><button class="btn light" onclick="review()">🔁 間違い復習</button></div>'}function part(p){start(Q.filter(x=>x.p===p))}function start(list){run(list,0,0)}function run(list,i,score){if(i>=list.length){finish(score,list.length);return}let x=list[i],id=Q.indexOf(x),arr=x.o.map((v,j)=>({v:v,j:j}));for(let n=arr.length-1;n>0;n--){let r=Math.floor(Math.random()*(n+1));[arr[n],arr[r]]=[arr[r],arr[n]]}let correct=arr.findIndex(z=>z.j===x.a);screen.innerHTML='<div class="meta">Part '+x.p+'｜問題 '+(i+1)+' / '+list.length+'</div><div class="bar"><i style="width:'+Math.round(i/list.length*100)+'%"></i></div><div class="card">'+(x.pass?'<div class="passage">'+x.pass+'</div>':'')+'<div class="q">'+x.q+'</div><div id="choices"></div><div id="result"></div></div><button class="btn light" onclick="home()">ダッシュボード</button>';let box=document.getElementById('choices');arr.forEach((z,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+z.v;b.onclick=()=>answer(x,id,arr,correct,j,b,list,i,score);box.appendChild(b)})}function answer(x,id,arr,correct,n,clicked,list,i,score){let bs=document.querySelectorAll('.choice');if(bs[0].disabled)return;let ok=n===correct;bs.forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add('ok')});if(!ok)clicked.classList.add('ng');S.ans[id]=ok;if(ok)delete S.wrong[id];else S.wrong[id]=1;save();document.getElementById('result').innerHTML='<div class="box"><b>'+(ok?'⭕ 正解！':'❌ 不正解')+'</b><br>正解：'+String.fromCharCode(65+correct)+'. '+arr[correct].v+'</div><div class="box"><b>詳しい解説</b><br>'+x.e+'</div><div class="box"><b>選択肢チェック</b><br>'+x.o.map((v,j)=>String.fromCharCode(65+j)+'. '+v+' — '+(j===x.a?'⭕ 正解':'❌')).join('<br>')+'</div><div class="box"><b>日本語</b><br>'+x.j+'</div><div class="box tip"><b>攻略ポイント</b><br>'+x.t+'</div><button class="btn" id="next">次の問題 →</button>';document.getElementById('next').onclick=()=>run(list,i+1,score+(ok?1:0))}function finish(c,n){screen.innerHTML='<div class="card"><h2>セット終了 🎉</h2><div class="stats"><div class="stat"><b>'+c+'</b>正解</div><div class="stat"><b>'+Math.round(c/n*100)+'%</b>正答率</div><div class="stat"><b>'+n+'</b>問題</div></div><div class="box">このスコアは練習用の正答率です。本番TOEICスコアへの単純換算ではありません。</div><button class="btn" onclick="home()">学習記録を見る</button><button class="btn light" onclick="review()">間違い復習</button></div>}function review(){let l=Object.keys(S.wrong).map(k=>Q[+k]).filter(Boolean);if(!l.length){screen.innerHTML='<div class="card"><h2>🔁 間違い復習</h2><div class="box">復習する問題はありません 👍</div><button class="btn" onclick="home()">戻る</button></div>';return}start(l)}home();
</script></body></html>
