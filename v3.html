<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Quick Practice</title><style>body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#18212b}.app{max-width:540px;margin:auto;background:white;min-height:100vh}header{background:#13263d;color:white;padding:22px}h1{margin:0;font-size:22px}header p{margin:6px 0 0;font-size:12px;opacity:.8}main{padding:18px}.grid{display:grid;gap:10px}.part,.opt,.btn{width:100%;padding:15px;border-radius:12px;font-size:15px}.part,.opt{background:white;border:1px solid #dce2e8;text-align:left}.part b{display:block}.part span{font-size:12px;color:#71808e}.btn{border:0;background:#13263d;color:white;font-weight:bold;margin-top:10px}.gray{background:#edf0f3;color:#263746}.q{font-size:18px;line-height:1.6;margin:18px 0}.card{border:1px solid #dce2e8;border-radius:16px;padding:17px}.bar{font-size:12px;color:#687584;display:flex;justify-content:space-between}.prog{height:7px;background:#e8ecf0;border-radius:9px;margin:8px 0 16px;overflow:hidden}.fill{height:100%;background:#2676c9}.ok{background:#e7f7ed;border-color:#42a36a}.ng{background:#fff0f0;border-color:#d55}.answer{display:none;background:#f6f8fa;border-radius:10px;padding:12px;margin-top:12px;font-size:13px}.show{display:block}.score{text-align:center;font-size:48px;font-weight:bold;color:#1768bb}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.stat div{border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center}.stat b{font-size:20px;display:block}.small{font-size:12px;color:#687584;line-height:1.6}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><p>Part 1〜7 ・ 200問</p></header><main id="app"></main></div><script>
var names=['','写真描写','応答問題','会話問題','説明文問題','短文穴埋め','長文穴埋め','読解問題'];
var seeds={
1:[['👩‍💻📄','A woman is working at a computer.'],['☕🪑','A cup is on a table.'],['🚲🌳','A bicycle is parked near a tree.'],['👨‍🍳🍳','A chef is preparing food.'],['📦🚚','Boxes are being loaded onto a truck.']],
2:[['When will the meeting begin?',['At nine o’clock.','In the conference room.','Yes, it began.']],['Where is the report?',['On my desk.','Tomorrow morning.','Yes, I reported it.']],['Why was the train delayed?',['Because of heavy rain.','At the station.','For two hours.']],['Could you help me?',['Of course.','At noon.','It is helpful.']],['Who ordered the supplies?',['Ms. Kim did.','Last Tuesday.','At the office.']]],
3:[['Woman: Did you send the invoice? Man: Yes, I sent it this morning.\n\nWhat did the man send?',['An invoice.','A schedule.','A package.','A letter.']],['Man: The printer needs paper. Woman: I will get some.\n\nWhat will the woman do?',['Get paper.','Repair the printer.','Call a client.','Leave the office.']],['Woman: When is the meeting? Man: At three.\n\nWhen is the meeting?',['At three.','At two.','At four.','At five.']],['Man: Are you joining lunch? Woman: No, I have an appointment.\n\nWhy will she not join?',['She has an appointment.','She is hungry.','She is traveling.','She is working late.']],['Woman: Did you reserve a room? Man: Yes, for Friday.\n\nWhen is the reservation?',['Friday.','Monday.','Tuesday.','Thursday.']]],
4:[['Attention passengers: Flight 218 will depart from Gate 12.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20']],['The library closes at six today because of staff training.\n\nWhy does it close early?',['Staff training.','A holiday.','Repairs.','A meeting.']],['The store offers free delivery this weekend.\n\nWhen is free delivery available?',['This weekend.','Every day.','Next month.','Today only.']],['Visitors must sign in at the front desk.\n\nWhat must visitors do?',['Sign in.','Buy a ticket.','Call a manager.','Wear a uniform.']],['The theater doors open at 6:30 and the show starts at 7.\n\nWhen do the doors open?',['6:30.','7:00.','6:00.','7:30.']]],
5:[['The company has ______ the deadline.',['extended','extending','extension','extensively'],0],['Please make sure the forms are ______.',['complete','completed','completion','completing'],1],['She can ______ difficult problems quickly.',['solve','solved','solving','solution'],0],['The room is available ______ 2 and 4 p.m.',['among','between','during','while'],1],['Please respond ______ to customers.',['prompt','promptly','promptness','prompted'],1]],
6:[['The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors only.','The manager only.'],0],['A survey is available online for seminar participants.\n\nWhat is available online?',['A survey.','A receipt.','A map.','A ticket.'],0],['Your order has shipped and can be tracked online.\n\nWhat can the customer do?',['Track the order.','Change the store.','Cancel the building.','Attend a seminar.'],0],['The east elevator is out of service. Use the west elevator.\n\nWhich elevator should visitors use?',['The west elevator.','The east elevator.','The freight elevator.','The service elevator.'],0],['New security badges will be distributed Wednesday. Bring your current badge.\n\nWhat should employees bring?',['Their current badge.','A passport.','A receipt.','A laptop.'],0]],
7:[['City Hotel: Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0],['Office chairs are 20% off. Customers buying three or more receive free delivery.\n\nWho gets free delivery?',['Customers buying three or more chairs.','Everyone.','Customers buying one chair.','Employees only.'],0],['The 10 a.m. meeting has moved to 11 a.m. because the client’s flight is delayed.\n\nWhy was it moved?',['The flight is delayed.','The room is unavailable.','Sales changed.','The employee was late.'],0],['The west entrance is closed. Please use the main entrance.\n\nWhich entrance should visitors use?',['The main entrance.','The west entrance.','The staff entrance.','The parking entrance.'],0],['Job Fair: Bring several copies of your résumé.\n\nWhat should visitors bring?',['Résumés.','Tickets.','Lunch.','Uniforms.'],0]]};
var counts=[0,20,30,30,30,40,20,30];var parts={};
for(var p=1;p<=7;p++){parts[p]=[];for(var n=0;n<counts[p];n++){var s=seeds[p][n%seeds[p].length];if(p===1){parts[p].push([s[0],[s[1],'A man is repairing a bicycle.','Several people are swimming.','The room is being cleaned.'],0]);}else{var q=[s[0],s[1].slice(),s.length>2?s[2]:0];parts[p].push(q);}}}
var part=0,index=0,score=0,locked=false;var stats=JSON.parse(localStorage.getItem('toeic-v3-stats')||'{}');
function home(){var a=0,c=0,k;for(k in stats){a+=stats[k].a||0;c+=stats[k].c||0}var h='<h2>TOEIC 総合問題集</h2><p class="small">Part 1〜7、全200問。回答すると正答率を保存します。</p><div class="stat"><div><b>'+a+'</b>回答数</div><div><b>'+(a?Math.round(c/a*100):0)+'%</b>総合正答率</div></div><div class="grid">';for(k=1;k<=7;k++){var st=stats[k];h+='<button class="part" onclick="start('+k+')"><b>Part '+k+'　'+names[k]+'</b><span>'+counts[k]+'問'+(st?' ・ 正答率 '+Math.round(st.c/st.a*100)+'%':' ・ 未学習')+'</span></button>'}h+='</div><p class="small">※公式TOEIC問題ではなく、学習用オリジナル問題です。</p>';app.innerHTML=h}
function start(p){part=p;index=0;score=0;locked=false;showQuestion();window.scrollTo(0,0)}
function showQuestion(){var q=parts[part][index],html='<div class="bar"><span>Part '+part+'　'+(index+1)+' / '+counts[part]+'</span><span>正解 '+score+'</span></div><div class="prog"><div class="fill" style="width:'+(index/counts[part]*100)+'%"></div></div><div class="card">';if(part===1)html+='<div style="font-size:60px;text-align:center;background:#f7f8fa;border-radius:12px;padding:20px">'+q[0]+'</div><div class="q">写真について最も適切な英文を選んでください。</div>';else html+='<div class="q" style="white-space:pre-line">'+q[0]+'</div>';html+='<div class="grid">';for(var j=0;j<q[1].length;j++)html+='<button class="opt" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+q[1][j]+'</button>';html+='</div><div id="answer" class="answer"></div><button id="next" class="btn" style="display:none" onclick="next()">次の問題 →</button><button class="btn gray" onclick="home()">Part選択へ</button></div>';app.innerHTML=html}
function answer(j){if(locked)return;locked=true;var q=parts[part][index],a=q[2];var bs=document.querySelectorAll('.opt');for(var x=0;x<bs.length;x++){bs[x].disabled=true;if(x===a)bs[x].classList.add('ok');if(x===j&&j!==a)bs[x].classList.add('ng')}if(j===a)score++;if(!stats[part])stats[part]={a:0,c:0};stats[part].a++;if(j===a)stats[part].c++;localStorage.setItem('toeic-v3-stats',JSON.stringify(stats));var e=document.getElementById('answer');e.innerHTML='<b>'+(j===a?'正解！':'不正解')+'</b><br>正解：'+String.fromCharCode(65+a)+'. '+q[1][a];e.className='answer show';document.getElementById('next').style.display='block'}
function next(){index++;locked=false;if(index>=counts[part])result();else{showQuestion();window.scrollTo(0,0)}}function result(){app.innerHTML='<div class="score">'+score+' / '+counts[part]+'</div><h2 style="text-align:center">Part '+part+' 終了</h2><p style="text-align:center">正答率 '+Math.round(score/counts[part]*100)+'%</p><button class="btn" onclick="start('+part+')">もう一度</button><button class="btn gray" onclick="home()">Part選択へ</button>'}home();
</script></body></html>
