<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Quick Practice v10</title><style>body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#17212b}.app{max-width:620px;margin:auto;background:#fff;min-height:100vh}header{background:#13263d;color:#fff;padding:20px}main{padding:16px}button{width:100%;padding:15px;margin:6px 0;border-radius:12px;border:1px solid #d8dfe6;background:#fff;font-size:16px;text-align:left}.menu{background:#13263d;color:#fff;border:0;text-align:center;font-weight:bold}.sub{background:#edf1f4}.card{border:1px solid #d8dfe6;border-radius:16px;padding:16px}.q{font-size:18px;line-height:1.7;margin:15px 0}.small{font-size:13px;color:#687584}.ok{background:#e5f7ec}.ng{background:#fff0f0}.box{padding:13px;background:#f4f7fa;border-radius:12px;margin-top:10px;line-height:1.7}.tip{background:#fff8df;padding:13px;margin-top:10px;border-left:4px solid #d9ae37}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:12px}.stat b{display:block;font-size:22px}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><div>問題・詳しい解説・間違い復習・学習記録</div></header><main id="main"></main></div><script>
(function(){
var M=document.getElementById('main');
var P={
1:{name:'写真描写',qs:[{q:'写真について最も適切な英文を選んでください。',pic:'📷 👩‍💻',c:['A woman is working at a computer.','A man is repairing a bicycle.','Several people are swimming.','The room is being cleaned.'],a:0,t:'人物＋動作',e:'写真で実際に見える人物の動作を表しているのはAです。',j:'女性がコンピューターで仕事をしています。'},{q:'写真について最も適切な英文を選んでください。',pic:'📷 ☕',c:['A cup is on a table.','A man is opening a door.','The table is being moved.','People are waiting outside.'],a:0,t:'物＋位置',e:'カップとテーブルの位置関係が一致するのはAです。',j:'カップがテーブルの上にあります。'}]},
2:{name:'応答問題',qs:[{q:'When will the meeting begin?',c:['At nine o’clock.','In the conference room.','Yes, it began.'],a:0,t:'疑問詞',e:'Whenは時間を尋ねるので、時刻を表すAが正解です。',j:'9時です。'},{q:'Where is the report?',c:['On my desk.','Tomorrow morning.','Yes, I reported it.'],a:0,t:'疑問詞',e:'Whereは場所を尋ねるので、場所を表すAが正解です。',j:'私の机の上です。'},{q:'Why was the train delayed?',c:['Because of heavy rain.','At the station.','For two hours.'],a:0,t:'疑問詞',e:'Whyは理由を尋ねるので、Because of heavy rain.が正解です。',j:'大雨が理由です。'}]},
3:{name:'会話問題',qs:[{q:'Did you send the invoice? Yes, I sent it this morning.\n\nWhat did the man send?',c:['An invoice.','A schedule.','A package.','A letter.'],a:0,t:'What問題',e:'会話中のsendの目的語invoiceをそのまま確認します。',j:'請求書です。'},{q:'The printer needs paper. I will get some.\n\nWhat will the woman do?',c:['Get paper.','Repair the printer.','Call a client.','Leave the office.'],a:0,t:'What問題',e:'I will get some.から、紙を取りに行くことが分かります。',j:'紙を取りに行きます。'}]},
4:{name:'説明文問題',qs:[{q:'Attention passengers: Flight 218 will depart from Gate 12.\n\nWhere will the flight depart?',c:['Gate 12','Gate 8','Gate 18','Gate 20'],a:0,t:'場所',e:'depart fromの場所としてGate 12が明示されています。',j:'12番ゲートです。'},{q:'The library closes at six today because of staff training.\n\nWhy does it close early?',c:['Staff training.','A holiday.','Repairs.','A meeting.'],a:0,t:'理由',e:'because of staff trainingが早く閉まる理由です。',j:'職員研修です。'}]},
5:{name:'短文穴埋め',qs:[{q:'The company has ______ the deadline.',c:['extended','extending','extension','extensively'],a:0,t:'現在完了',e:'hasの後ろには過去分詞が必要です。extendedはextendの過去分詞です。',j:'会社は期限を延長しました。'},{q:'Please make sure the forms are ______.',c:['complete','completed','completion','completing'],a:1,t:'受動態',e:'areの後ろで「書類が完成されている状態」を表すため過去分詞completedを使います。',j:'書類が完成していることを確認してください。'},{q:'She can ______ difficult problems quickly.',c:['solve','solved','solving','solution'],a:0,t:'助動詞',e:'canの直後は必ず動詞の原形です。solveが正解です。',j:'彼女は難しい問題を素早く解決できます。'}]},
6:{name:'長文穴埋め',qs:[{q:'The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',c:['Employees who need access.','All customers.','Visitors only.','The manager only.'],a:0,t:'人物特定',e:'Employees who need accessがcontact Facilitiesする対象です。',j:'利用する必要がある従業員です。'},{q:'A survey is available online for seminar participants.\n\nWhat is available online?',c:['A survey.','A receipt.','A map.','A ticket.'],a:0,t:'内容特定',e:'available onlineの対象はA surveyです。',j:'アンケートです。'}]},
7:{name:'読解問題',qs:[{q:'City Hotel: Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',c:['Breakfast.','Dinner.','Parking.','Airport transfer.'],a:0,t:'情報検索',e:'本文にBreakfast is included.と明記されています。',j:'朝食です。'},{q:'Office chairs are 20% off. Customers buying three or more receive free delivery.\n\nWho gets free delivery?',c:['Customers buying three or more chairs.','Everyone.','Customers buying one chair.','Employees only.'],a:0,t:'条件',e:'three or more、つまり3脚以上購入する顧客が対象です。',j:'椅子を3脚以上購入する顧客です。'}]}}
var data={ans:{},wrong:{}};try{data=JSON.parse(localStorage.toeic10||'null')||data}catch(e){}function save(){localStorage.toeic10=JSON.stringify(data)}var st={p:0,i:0,score:0};
function home(){var n=Object.keys(data.ans).length,ok=Object.values(data.ans).filter(Boolean).length;M.innerHTML='<h2>TOEIC 総合問題集</h2><p class="small">今回は「問題→選択肢→回答→解説」が確実に表示される構成にしています。</p><div class="stat"><div><b>'+n+'</b>回答</div><div><b>'+(n?Math.round(ok/n*100):0)+'%</b>正答率</div><div><b>'+Object.keys(data.wrong).length+'</b>復習</div></div><button class="menu" onclick="T.review()">🔁 間違い復習</button><button class="menu" onclick="T.record()">📊 学習記録</button><h3>Partを選ぶ</h3>';for(var p=1;p<=7;p++)M.innerHTML+='<button class="sub" onclick="T.start('+p+')">Part '+p+'　'+P[p].name+'</button>'}
function start(p,i){st={p:p,i:i||0,score:0};show()}
function show(){var q=P[st.p].qs[st.i];var h='<p class="small">Part '+st.p+'｜'+P[st.p].name+'｜問題 '+(st.i+1)+' / '+P[st.p].qs.length+'</p><div class="card">';if(q.pic)h+='<div style="font-size:60px;text-align:center;padding:15px">'+q.pic+'</div>';h+='<div class="q">'+q.q+'</div>';for(var i=0;i<q.c.length;i++)h+='<button class="choice" onclick="T.answer('+i+')">'+String.fromCharCode(65+i)+'. '+q.c[i]+'</button>';h+='<div id="exp"></div><button id="next" class="menu" style="display:none" onclick="T.next()">次の問題 →</button></div><button class="sub" onclick="T.home()">ホームへ</button>';M.innerHTML=h}
function answer(n){var q=P[st.p].qs[st.i],ok=n===q.a,key=st.p+'-'+st.i;if(ok)st.score++;var bs=document.querySelectorAll('.choice');for(var i=0;i<bs.length;i++){bs[i].disabled=true;if(i===q.a)bs[i].classList.add('ok');if(i===n&&!ok)bs[i].classList.add('ng')}data.ans[key]=ok;if(ok)delete data.wrong[key];else data.wrong[key]=1;save();var h='<div class="box"><b>① 正解の理由</b><br>'+q.e+'</div><div class="box"><b>② 全選択肢</b><br>';for(var i=0;i<q.c.length;i++)h+=String.fromCharCode(65+i)+'. '+q.c[i]+' — '+(i===q.a?'⭕ 正解':'❌ 今回の条件には合いません')+'<br>';h+='</div><div class="box"><b>③ 日本語</b><br>'+q.j+'</div><div class="box"><b>④ 重要ポイント</b><br>'+q.t+'</div><div class="tip"><b>⑤ TOEIC攻略</b><br>'+tip(st.p)+'</div>';if(!ok)h+='<div class="box"><b>⑥ 復習</b><br>この問題は間違い復習に自動登録されました。</div>';document.getElementById('exp').innerHTML=h;document.getElementById('next').style.display='block'}
function tip(p){return p===1?'写真にないことを想像せず、見えている事実を選ぶ。':p===2?'疑問詞を最初に聞き、答えの種類を予測する。':p<=4?'設問を先に確認し、必要な情報を聞き取る。':p===5?'空欄の前後から品詞・文法を先に判断する。':p===6?'文全体の意味を確認して空欄を決める。':'設問のキーワードを本文から探す。'}
function next(){st.i++;if(st.i>=P[st.p].qs.length){M.innerHTML='<h2>Part '+st.p+' 終了</h2><div class="stat"><div><b>'+st.score+'</b>正解</div><div><b>'+Math.round(st.score/P[st.p].qs.length*100)+'%</b>正答率</div><div><b>'+P[st.p].qs.length+'</b>問</div></div><button class="menu" onclick="T.start('+st.p+')">もう一度</button><button class="sub" onclick="T.home()">ホームへ</button>'}else show()}
function review(){var ks=Object.keys(data.w);M.innerHTML='<h2>🔁 間違い復習</h2><p class="small">正解すると復習リストから外れます。</p>';if(!ks.length)M.innerHTML+='<div class="box">現在、復習待ちの問題はありません。</div>';for(var i=0;i<ks.length;i++){var z=ks[i].split('-');M.innerHTML+='<button class="sub" onclick="T.start('+z[0]+','+z[1]+')">Part '+z[0]+'｜問題 '+(+z[1]+1)+'</button>'}M.innerHTML+='<button class="sub" onclick="T.home()">ホームへ</button>'}
function record(){M.innerHTML='<h2>📊 学習記録</h2>';for(var p=1;p<=7;p++){var ks=Object.keys(data.ans).filter(function(k){return k.indexOf(p+'-')===0}),c=ks.filter(function(k){return data.ans[k]}).length;M.innerHTML+='<div class="box"><b>Part '+p+' '+P[p].name+'</b><br>回答 '+ks.length+'問　正答率 '+(ks.length?Math.round(c/ks.length*100):0)+'%<br>復習 '+Object.keys(data.wrong).filter(function(k){return k.indexOf(p+'-')===0}).length+'問</div>'}M.innerHTML+='<button class="sub" onclick="T.home()">ホームへ</button>'}
window.T={home:home,start:start,answer:answer,next:next,review:review,record:record};home();})();</script></body></html>
