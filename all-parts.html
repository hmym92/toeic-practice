<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13263d"><title>TOEIC All Parts</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#18212b}.app{max-width:540px;margin:auto;min-height:100vh;background:#fff}header{background:#13263d;color:#fff;padding:20px}h1{margin:0;font-size:22px}header p{margin:5px 0 0;font-size:12px;opacity:.8}main{padding:18px}.grid{display:grid;gap:10px}.part{padding:16px;border:1px solid #e0e5ea;border-radius:15px;background:#fff;text-align:left;font-size:15px;box-shadow:0 3px 12px #0000000a}.part b{display:block;margin-bottom:4px}.part span{font-size:12px;color:#6b7785}.bar{display:flex;justify-content:space-between;font-size:13px;color:#647181}.prog{height:7px;background:#e7ebef;border-radius:9px;margin:8px 0 18px;overflow:hidden}.fill{height:100%;background:#2676c9}.card{border:1px solid #e0e5ea;border-radius:17px;padding:18px}.scene{font-size:65px;text-align:center;padding:22px;background:#f7f8fa;border-radius:13px}.q{font-size:18px;line-height:1.6;margin:15px 0}.options{display:grid;gap:9px}.opt{padding:14px;border:1px solid #d8dee4;border-radius:11px;background:#fff;text-align:left;font-size:15px}.ok{background:#eaf8ef;border-color:#48a56d}.ng{background:#fff0f0;border-color:#d86161}.exp{display:none;margin-top:13px;padding:13px;background:#f6f8fa;border-radius:11px;font-size:14px;line-height:1.6}.show{display:block}.btn{width:100%;margin-top:11px;padding:14px;border:0;border-radius:11px;background:#13263d;color:#fff;font-weight:700;font-size:15px}.muted{background:#eef1f4;color:#263746}.result{text-align:center;padding:25px 5px}.score{font-size:50px;font-weight:800;color:#1768bb}.small{font-size:11px;color:#74808d;line-height:1.6}.back{margin-top:10px}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><p>Part 1〜7 · オリジナル問題</p></header><main id="m"></main></div><script>
const parts={
1:{n:'写真描写',qs:[['👩‍💻📚',['A woman is working at a computer.','A woman is repairing a bicycle.','Several people are swimming.','The computer is being removed.'],0],['☕🪑',['A cup is on the table.','The chairs are being painted.','A man is driving a bus.','The table is outside.'],0],['🚲🌳',['A bicycle is parked near a tree.','A bicycle is being washed indoors.','The tree is being removed.','People are entering a train.'],0]]},
2:{n:'応答問題',qs:[['When will the new manager arrive?',['Tomorrow morning.','At the main entrance.','He manages the store.'],0],['Could you send me the revised report?',['Sure, I will email it this afternoon.','The report was expensive.','Yes, the office is revised.'],0],['Where is the nearest conference room?',['On the second floor.','At three o’clock.','Yes, I attended it.'],0],['Why was the meeting canceled?',['Because the director was ill.','In the large room.','At nine tomorrow.'],0],['Would you like some coffee?',['Yes, please.','The coffee shop is closed.','It was very strong.'],0]]},
3:{n:'会話問題',qs:[['Man: Are you going to the client meeting this afternoon? Woman: Yes. I finished the presentation this morning.\n\nWho finished the presentation?',['The woman.','The client.','The manager.','The assistant.'],0],['Woman: Did you reserve a table for Friday? Man: Not yet. I will call the restaurant after lunch.\n\nWhat will the man do?',['Call a restaurant.','Order lunch.','Meet a client.','Cancel a table.'],0],['Man: The printer is out of paper. Woman: I’ll get some from the supply room.\n\nWhat does the woman plan to do?',['Get paper.','Repair the printer.','Print a report.','Clean the room.'],0],['Woman: Can you attend the training at two? Man: I can, but I have another meeting at four.\n\nWhen is the other meeting?',['At four.','At two.','At three.','At five.'],0],['Man: Have you seen the new price list? Woman: Yes, but I think one item is missing.\n\nWhat does the woman say?',['An item is missing.','It is too expensive.','It was mailed late.','It has been approved.'],0]]},
4:{n:'説明文問題',qs:[['Attention passengers: Flight 218 to Osaka will depart from Gate 12 instead of Gate 8.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0],['The library will close at six today because of staff training.\n\nWhy will the library close early?',['Staff training.','A public holiday.','Building repairs.','A power failure.'],0],['Thank you for visiting Green Market. Fresh bread is near the entrance, and vegetables are on the left side.\n\nWhere are the vegetables?',['On the left side.','Near the entrance.','At the checkout.','Outside the store.'],0],['The company picnic has been moved from Saturday to Sunday because rain is expected.\n\nWhy was it moved?',['Rain is expected.','The park is closed.','Lunch is unavailable.','Employees are busy.'],0],['Today only, customers who purchase two shirts will receive a free tote bag.\n\nWhat is offered for free?',['A tote bag.','A shirt.','A meal.','A ticket.'],0]]},
5:{n:'短文穴埋め',qs:[['The accounting department has ______ the deadline for submitting expense reports.',['extended','extending','extension','extensively'],0],['Please make sure that all forms are ______ before you leave the office.',['complete','completed','completion','completing'],1],['Ms. Garcia is known for her ability to ______ difficult problems quickly.',['solve','solved','solving','solution'],0],['The conference room is available ______ 2:00 and 4:00 p.m.',['among','between','during','while'],1],['The manager asked the staff to respond ______ to all customer inquiries.',['prompt','promptly','promptness','prompted'],1],['The software update is expected to make the system more ______.',['rely','reliable','reliably','reliability'],1],['All equipment should be checked ______ before use.',['careful','carefully','carefulness','caring'],1],['The company is considering ______ its office to a larger building.',['move','moved','moving','movement'],2],['The company has recently ______ several new employees.',['hire','hiring','hired','hires'],2],['The documents must be submitted ______ Friday afternoon.',['by','at','in','on'],0]]},
6:{n:'長文穴埋め',qs:[['To: Staff\nThe office will be closed on Monday for maintenance. Employees who need access should contact the facilities team in advance.\n\nEmployees should contact the facilities team if they',['need office access.','want a holiday.','submit a report.','work on Monday.'],0],['Thank you for attending our seminar. A survey is available online for all participants.\n\nWhat is available online?',['A survey.','A schedule.','A receipt.','A map.'],0],['Dear Ms. Lee, Your order has been shipped and should arrive by Thursday. You can track the package using the number below.\n\nWhat can Ms. Lee do?',['Track her package.','Change the price.','Cancel the seminar.','Visit the warehouse.'],0],['Notice: The parking lot will be unavailable Tuesday morning. Visitors should use the public garage across the street.\n\nWhere should visitors park?',['In the public garage.','In the company lot.','Behind the office.','At the airport.'],0],['To all employees: The cafeteria menu has changed. Vegetarian meals are now available every day.\n\nWhat has changed?',['The cafeteria menu.','The office hours.','The parking fee.','The employee handbook.'],0]]},
7:{n:'読解問題',qs:[['From: City Hotel\nThank you for booking a room for June 12. Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0],['Summer Sale! All office chairs are 20% off through Sunday. Customers who buy three or more chairs receive free delivery.\n\nWho gets free delivery?',['Customers buying three or more chairs.','All customers.','Customers buying one chair.','Only employees.'],0],['To: Daniel\nThe 10 a.m. meeting has been moved to 11 a.m. because the client’s flight is delayed.\n\nWhy was the meeting moved?',['The client’s flight is delayed.','The sales figures changed.','The room is unavailable.','Daniel arrived late.'],0],['Museum Notice\nThe west entrance is closed for construction. Please use the main entrance.\n\nWhich entrance should visitors use?',['The main entrance.','The west entrance.','The staff entrance.','The parking entrance.'],0],['Job Fair Announcement\nThe event will take place Saturday from 10 a.m. to 4 p.m. Bring several copies of your résumé. Free admission is available.\n\nWhat should visitors bring?',['Résumés.','Tickets.','Lunch.','Uniforms.'],0]]}}
let part=0,i=0,score=0,done=false;
function home(){m.innerHTML='<h2>TOEIC 総合問題集</h2><p class="small">Part 1〜7から選んで練習できます。</p><div class="grid">'+Object.keys(parts).map(k=>'<button class="part" onclick="start('+k+')"><b>Part '+k+'　'+parts[k].n+'</b><span>'+parts[k].qs.length+'問 · オリジナル問題</span></button>').join('')+'</div><p class="small">※公式TOEIC問題ではありません。</p>'}
function start(k){part=k;i=0;score=0;done=false;render();scrollTo(0,0)}
function render(){let x=parts[part].qs[i],q=x[0],opts=x[1],a=x[2];m.innerHTML='<div class="bar"><span>Part '+part+' · '+(i+1)+' / '+parts[part].qs.length+'</span><span>正解 '+score+'</span></div><div class="prog"><div class="fill" style="width:'+(i/parts[part].qs.length*100)+'%"></div></div><div class="card">'+(part===1?'<div class="scene">'+q+'</div><div class="q">写真について最も適切な英文を選んでください。</div>':'<div class="q" style="white-space:pre-line">'+q+'</div>')+'<div class="options">'+opts.map((v,j)=>'<button class="opt" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+v+'</button>').join('')+'</div><div id="e" class="exp"></div><button id="next" class="btn" style="display:none" onclick="next()">次の問題 →</button><button class="btn muted" onclick="home()">Part選択へ</button></div>'}
function answer(j){if(done)return;done=true;let x=parts[part].qs[i],a=x[2],bs=document.querySelectorAll('.opt');bs.forEach((b,k)=>{if(k===a)b.classList.add('ok');if(k===j&&j!==a)b.classList.add('ng');b.disabled=true});if(j===a)score++;let e=document.getElementById('e');e.innerHTML='<b>'+(j===a?'正解！':'不正解')+'</b><br>正解：'+String.fromCharCode(65+a)+'. '+x[1][a];e.classList.add('show');document.getElementById('next').style.display='block'}
function next(){i++;done=false;if(i>=parts[part].qs.length)result();else render();scrollTo(0,0)}
function result(){let t=parts[part].qs.length,r=Math.round(score/t*100);m.innerHTML='<div class="result"><h2>Part '+part+' 終了！</h2><div class="score">'+score+' / '+t+'</div><p>正答率 '+r+'%</p><button class="btn" onclick="start('+part+')">もう一度</button><button class="btn muted back" onclick="home()">Part選択へ</button></div>'}home();</script></body></html>
