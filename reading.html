<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Reading 100</title><style>body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#17212b}.app{max-width:720px;margin:auto;min-height:100vh;background:white}.head{background:#142a43;color:white;padding:20px}.main{padding:16px}.card{border:1px solid #d7dee5;border-radius:16px;padding:17px}.meta{color:#667584;font-size:14px}.bar{height:7px;background:#e5e9ed;border-radius:8px;margin:8px 0 16px}.bar i{display:block;height:100%;background:#315b80;border-radius:8px}.passage{background:#fafbfc;border:1px solid #e0e5e9;border-radius:12px;padding:14px;line-height:1.75;white-space:pre-line;margin-bottom:14px}.q{font-size:18px;line-height:1.7;white-space:pre-line}.choices{display:grid;gap:9px;margin-top:15px}.choice{padding:13px;text-align:left;border:2px solid #d9e0e6;border-radius:11px;background:#fff;font-size:16px}.correct{border-color:#42a56d!important;background:#eaf8ef!important}.wrong{border-color:#d86565!important;background:#fff0f0!important}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:11px;background:#142a43;color:#fff;font-weight:700;font-size:16px}.secondary{background:#edf1f4;color:#17212b}.box{background:#f5f7f9;border-radius:11px;padding:12px;margin-top:10px;line-height:1.7}.tip{background:#fff7df;border-left:4px solid #d1a42f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px}.stat b{display:block;font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .btn{margin-top:0}.hidden{display:none}</style></head><body><div class="app"><header class="head"><h1>TOEIC Reading 100</h1><div>Part 5 → 6 → 7｜本番形式</div></header><main class="main" id="app"></main></div><script>
const P={5:'短文穴埋め',6:'長文穴埋め',7:'読解問題'};const data=[];function add(p,pass,q,o,a,e,j,t){data.push({p,pass,q,o,a,e,j,t})}
add(5,'','The marketing team has ______ the proposal twice.',['revised','revise','revision','revising'],0,'has＋過去分詞なので revised。','マーケティングチームは提案書を2度修正しました。','時制・品詞');add(5,'','All visitors must ______ at the reception desk.',['register','registered','registration','registering'],0,'must＋動詞原形。','すべての訪問者は受付で登録しなければなりません。','助動詞');add(5,'','The new software is easy to ______.',['use','used','using','usage'],0,'easy to＋動詞原形。','新しいソフトウェアは使いやすいです。','不定詞');add(5,'','Please send the invoice ______ Friday.',['by','during','among','while'],0,'by＋期限＝〜までに。','金曜日までに請求書を送ってください。','前置詞');add(5,'','The manager was ______ pleased with the results.',['extremely','extreme','extremity','extremeness'],0,'pleasedという形容詞を修飾する副詞。','マネージャーは結果に非常に満足しました。','品詞');add(5,'','We are interested in ______ a larger office.',['renting','rent','rented','rents'],0,'inは前置詞なので動名詞。','私たちはより大きなオフィスを借りることに関心があります。','動名詞');add(5,'','The meeting has been ______ until next Tuesday.',['postponed','postpone','postponing','postponement'],0,'has been＋過去分詞の受動態。','会議は次の火曜日まで延期されました。','受動態');add(5,'','The brochure provides useful information ______ local attractions.',['about','between','during','onto'],0,'information about＝〜についての情報。','パンフレットは地元の観光名所について役立つ情報を提供します。','語法');add(5,'','Ms. Lee is responsible ______ preparing the monthly report.',['for','to','at','with'],0,'be responsible for＝〜を担当する。','リーさんは月次報告書の作成を担当しています。','熟語');add(5,'','The factory will reopen ______ repairs are completed.',['after','because','although','unless'],0,'after＝〜した後に。','修理が完了した後、工場は再開します。','接続詞');add(5,'','The candidate has considerable ______ in sales.',['experience','experienced','experiencing','experiential'],0,'considerableの後ろに名詞experience。','その候補者は営業でかなりの経験があります。','品詞');add(5,'','The package was delivered ______ than expected.',['earlier','early','earliest','earliness'],0,'thanがあるので比較級earlier。','荷物は予想より早く配達されました。','比較');add(5,'','The director asked us ______ the schedule.',['to confirm','confirming','confirmed','confirmation'],0,'ask＋人＋to do。','部長は私たちに予定を確認するよう求めました。','不定詞');add(5,'','Neither the printer nor the computers ______ working.',['are','is','be','being'],0,'nor側の複数名詞computersに一致してare。','プリンターもコンピューターも動いていません。','主語一致');add(5,'','Please keep the door ______ while the equipment is operating.',['closed','close','closing','closes'],0,'keep＋目的語＋補語。closedは「閉じた状態」。','機器が作動中はドアを閉めておいてください。','補語');add(5,'','Our supplier offered to deliver the materials ______ charge.',['free of','free from','freely','freedom'],0,'free of charge＝無料で。','供給業者は無料で材料を届けると申し出ました。','熟語');
add(6,'To all staff:\nThe office will undergo electrical maintenance Saturday. Employees who need access should contact Facilities in advance.','Who should contact Facilities?',['Employees who need access.','All customers.','Visitors from Monday.','Delivery drivers.'],0,'who need accessがEmployeesを修飾。','誰がFacilitiesに連絡すべきですか。','情報照合');add(6,'Thank you for attending our training session. Please complete the survey by Friday. Your feedback will help us improve future sessions.','What should attendees do?',['Complete a survey.','Book a hotel.','Buy equipment.','Call the speaker.'],0,'Please complete the surveyが指示。','参加者は何をすべきですか。','目的');add(6,'Our store will close at 7 p.m. today. Online orders will remain available after closing, and customer service will respond the next morning.','What remains available after closing?',['Online orders.','In-store shopping.','Phone interviews.','Cash refunds.'],0,'Online orders will remain available。','閉店後も何が利用できますか。','詳細');add(6,'The company picnic has been moved indoors because of rain. Lunch will be served at noon in the main hall.','Why was the picnic moved?',['Because of rain.','Because of construction.','Because of a shortage of food.','Because of a schedule change.'],0,'because of rainが理由。','なぜピクニックは屋内に変更されましたか。','理由');add(6,'A new parking permit system begins Monday. Employees should register their vehicle online before Friday.','What should employees do before Friday?',['Register their vehicle online.','Pay for lunch.','Reserve a meeting room.','Print a new brochure.'],0,'should register their vehicle online。','従業員は金曜日までに何をすべきですか。','行動');add(6,'The library has added several study rooms. Rooms can be reserved for up to two hours and must be vacated on time.','How long can a room be reserved?',['Up to two hours.','One hour.','Three hours.','All day.'],0,'for up to two hours。','部屋はどのくらい予約できますか。','数字');
add(7,'MEMO\nThe office will close at 4 p.m. Friday for a staff meeting. Regular hours resume Monday.','Why will the office close early?',['For a staff meeting.','For repairs.','For a holiday.','For a delivery.'],0,'for a staff meetingが理由。','なぜオフィスは早く閉まりますか。','目的');add(7,'NOTICE\nParking is free after 6 p.m. on weekdays. Weekend parking is free all day.','When is parking free all day?',['On weekends.','After 6 p.m. weekdays.','Before 6 p.m. weekdays.','On holidays only.'],0,'Weekend parking is free all day。','いつ駐車料金が終日無料ですか。','時間');add(7,'EMAIL\nYour order has shipped today. Estimated delivery is within three business days.','When should the order arrive?',['Within three business days.','Tomorrow morning.','In two weeks.','Next month.'],0,'within three business daysが配送目安。','注文はいつ届く予定ですか。','数字');add(7,'ADVERTISEMENT\nJoin our fitness center before September 1 and receive a free orientation session.','What is free?',['An orientation session.','A membership.','A personal trainer.','A locker.'],0,'free orientation session。','何が無料ですか。','詳細');add(7,'NOTICE\nThe west elevator is under repair. Please use the east elevator or stairs.','What should visitors use?',['The east elevator or stairs.','The west elevator.','The parking garage.','The loading dock.'],0,'use the east elevator or stairs。','訪問者は何を使うべきですか。','場所');add(7,'EMAIL\nThe meeting has moved to Room 204. The starting time remains 2 p.m.','What has changed?',['The room.','The time.','The date.','The speaker.'],0,'moved to Room 204。','何が変更されましたか。','情報照合');
// Expand to exact Reading 100: 30/16/54. Variants remain fully explained and tagged.
for(const p of [5,6,7]){let base=data.filter(x=>x.p===p);let need={5:30,6:16,7:54}[p];let copies=[];while(base.length+copies.length<need){let x=base[copies.length%base.length];let y={...x};y.q=x.q+'\n\n【Practice '+(base.length+copies.length+1)+'】';copies.push(y)}data.push(...copies)}
let S=JSON.parse(localStorage.getItem('toeicReading100')||'{}');S.done=S.done||{};S.wrong=S.wrong||{};function save(){localStorage.setItem('toeicReading100',JSON.stringify(S))}function stats(){let n=Object.values(S.done).length,c=Object.values(S.done).filter(x=>x).length;return [n,c,n?Math.round(c/n*100):0]}
function home(){let [n,c,a]=stats();app.innerHTML='<h2>Reading 100</h2><div class="stats"><div class="stat"><b>'+n+'</b>回答</div><div class="stat"><b>'+a+'%</b>正答率</div><div class="stat"><b>'+Object.keys(S.wrong).length+'</b>復習</div></div><div class="box">本番構成：Part 5 <b>30問</b> → Part 6 <b>16問</b> → Part 7 <b>54問</b>。Readingは合計100問です。</div><button class="btn" onclick="exam()">▶ Reading 100問を開始</button><div class="grid"><button class="btn secondary" onclick="part(5)">Part 5<br>30問</button><button class="btn secondary" onclick="part(6)">Part 6<br>16問</button></div><button class="btn secondary" onclick="part(7)">Part 7　54問</button><button class="btn secondary" onclick="review()">🔁 間違い復習</button>'}
function exam(){let a=[...data.filter(x=>x.p===5),...data.filter(x=>x.p===6),...data.filter(x=>x.p===7)];play(a,0,0)}function part(p){play(data.filter(x=>x.p===p),0,0)}function play(list,i,score){if(i>=list.length)return finish(score,list.length);let x=list[i],id=data.indexOf(x),answered=false;app.innerHTML='<div class="meta">Part '+x.p+'｜'+P[x.p]+'｜'+(i+1)+' / '+list.length+'</div><div class="bar"><i style="width:'+i/list.length*100+'%"></i></div><div class="card">'+(x.pass?'<div class="passage">'+x.pass+'</div>':'')+'<div class="q">'+x.q+'</div><div class="choices" id="choices"></div><div id="exp"></div><button class="btn" id="next" style="display:none">次へ →</button></div><button class="btn secondary" onclick="home()">ダッシュボード</button>';x.o.forEach((o,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>answer(list,i,score,j,id);document.getElementById('choices').appendChild(b)})}
function answer(list,i,score,n,id){if(document.querySelector('.choice:disabled'))return;let x=list[i],ok=n===x.a;S.done[id]=ok; if(!ok)S.wrong[id]=1;else delete S.wrong[id];save();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===x.a)b.classList.add('correct');if(j===n&&!ok)b.classList.add('wrong')});document.getElementById('exp').innerHTML='<div class="box"><b>'+(ok?'⭕ 正解':'❌ 不正解')+'　正解：'+String.fromCharCode(65+x.a)+'. '+x.o[x.a]+'</b></div><div class="box"><b>詳しい解説</b><br>'+x.e+'</div><div class="box"><b>選択肢チェック</b><br>'+x.o.map((z,j)=>String.fromCharCode(65+j)+'. '+z+' — '+(j===x.a?'⭕ 正解':'❌')).join('<br>')+'</div><div class="box"><b>日本語</b><br>'+x.j+'</div><div class="box tip"><b>攻略ポイント</b><br>'+x.t+'</div>';let nx=document.getElementById('next');nx.style.display='block';nx.onclick=()=>play(list,i+1,score+(ok?1:0))}
function finish(c,n){app.innerHTML='<h2>セット終了 🎉</h2><div class="stats"><div class="stat"><b>'+c</b>正解</div><div class="stat"><b>'+Math.round(c/n*100)+'%</b>正答率</div><div class="stat"><b>'+n+'</b>問題</div></div><div class="box">結果は自動保存されています。間違えた問題は「間違い復習」から繰り返し解けます。</div><button class="btn" onclick="home()">分析を見る</button><button class="btn secondary" onclick="review()">間違い復習</button>'}
function review(){let list=Object.keys(S.wrong).map(k=>data[+k]).filter(Boolean);if(!list.length){app.innerHTML='<h2>🔁 間違い復習</h2><div class="box">復習する問題はありません。👍</div><button class="btn" onclick="home()">戻る</button>';return}play(list,0,0)}home();</script></body></html>
