<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学歴史問題集</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f6f8;color:#222}header{background:#173f5f;color:white;padding:18px}.sub{font-size:12px;margin-top:5px}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;padding:18px;border-radius:16px;margin-bottom:14px;box-shadow:0 2px 9px #0001}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:11px;background:#edf1f4;font-size:16px}.primary{background:#173f5f;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.sel{outline:3px solid #3caea3;background:#eefaf8}.hide{display:none}.q{font-size:19px;font-weight:700;line-height:1.6}.tag{font-size:12px;color:#65727e}.bar{height:7px;background:#ddd;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#3caea3;width:0}.correct{background:#dff5ef!important}.wrong{background:#ffe4df!important}.fb{padding:12px;border-radius:10px;line-height:1.6;margin-top:10px}.ok{background:#e8f7f4}.ng{background:#fff0ec}.score{text-align:center;font-size:32px;font-weight:bold}</style></head><body><header><b>📚 中学歴史・教科書準拠問題集</b><div class="sub">東京書籍「新編 新しい社会 歴史」第1章＋第2章第1節</div></header><main><section id="home" class="card"><h2>学習する範囲</h2><div class="grid"><button id="r0" class="sel" onclick="range='all';pick('r0')">📖 全範囲</button><button id="r1" onclick="range='ch1';pick('r1')">第1章</button><button id="r2" onclick="range='ch2';pick('r2')">第2章 第1節</button></div><h2>レベル</h2><div class="grid"><button id="l0" class="sel" onclick="level='all';pick('l0')">全部</button><button id="l1" onclick="level='basic';pick('l1')">🟢 基礎</button><button id="l2" onclick="level='standard';pick('l2')">🟡 標準</button><button id="l3" onclick="level='advanced';pick('l3')">🔴 応用</button></div><button class="primary" onclick="start()">▶ 20問スタート</button><button onclick="review()">🔄 間違い問題を復習</button><p class="tag">※第1章は「歴史をとらえる見方・考え方」「身近な地域の歴史」を含みます。第2章第1節は「世界の古代文明と宗教のおこり」です。</p></section><section id="quiz" class="card hide"><div id="tag" class="tag"></div><div class="bar"><i id="bar"></i></div><div id="q" class="q"></div><div id="choices"></div><div id="fb"></div><button id="next" class="primary hide" onclick="next()">次の問題 →</button></section><section id="result" class="card hide"><h2>🎉 結果</h2><div id="score" class="score"></div><p id="comment"></p><button onclick="review()">🔄 間違いを復習</button><button onclick="home()">ホームへ</button></section></main><script>
const B=[
['ch1','basic','歴史上の出来事を年代順に並べたものは？',['年表','系図','地図','統計'],0,'年表は時間の流れを整理する資料です。'],['ch1','basic','西暦1年から100年までを何世紀という？',['1世紀','2世紀','3世紀','10世紀'],0,'1～100年は1世紀です。'],['ch1','basic','西暦1年より前の年代を何という？',['紀元前','中世','近代','現代'],0,'西暦1年より前を紀元前と表します。'],['ch1','basic','文字で書かれた歴史資料を何という？',['文献','遺物','遺跡','化石'],0,'文字で残された資料を文献といいます。'],['ch1','basic','過去の人々が使った道具などを何という？',['遺物','文献','年表','地図'],0,'道具や生活用品などは遺物です。'],['ch1','basic','昔の建物や集落などの跡を何という？',['遺跡','文献','系図','年号'],0,'過去の人々の活動の跡を遺跡といいます。'],['ch1','standard','歴史資料を読むときに考えることとして適切なのは？',['作成者・目的・背景','大きさだけ','紙の色だけ','値段だけ'],0,'資料の作成者や目的、背景を考えることが大切です。'],['ch1','standard','複数の資料を比較するよさは？',['過去を多面的に考えられる','必ず答えが一つになる','古い資料が不要になる','年代が消える'],0,'共通点や相違点から多面的に考えられます。'],['ch1','standard','古地図と現在の地図を比べると分かりやすいものは？',['土地利用や町並みの変化','未来の人口','人物の性格','世界の気温'],0,'地域の昔と現在の変化を比較できます。'],['ch1','standard','聞き取り調査を歴史資料として使うとき大切なのは？',['他の資料とも照らし合わせる','すべてを断定する','日時を記録しない','質問しない'],0,'記憶には違いもあるので他資料との照合が重要です。'],['ch1','advanced','一つの資料だけで歴史を判断するのが危険なのはなぜ？',['資料には立場や目的があるから','古い資料は全部間違いだから','写真は全部嘘だから','年表が使えないから'],0,'資料には作成者の立場や目的があります。'],['ch1','advanced','地域の史跡・聞き取り・文献を組み合わせる利点は？',['異なる情報から過去を多角的に考えられる','調査が不要になる','必ず一つの答えになる','現在だけ分かる'],0,'異なる種類の資料を組み合わせることで理解が深まります。'],['ch2','basic','人類が誕生したと考えられている地域は？',['アフリカ','ヨーロッパ','南アメリカ','オーストラリア'],0,'人類はアフリカで誕生したと考えられています。'],['ch2','basic','人類の祖先の特徴の一つは？',['直立二足歩行','えら呼吸','飛行','水中生活'],0,'直立二足歩行は人類の重要な特徴です。'],['ch2','basic','旧石器時代の主な食料獲得方法は？',['狩猟・採集','工場生産','大規模商業','機械農業'],0,'狩猟・採集を中心に生活しました。'],['ch2','basic','石を打ち欠いて作った石器は？',['打製石器','磨製石器','青銅器','鉄器'],0,'打ち欠いて作る石器が打製石器です。'],['ch2','basic','植物を栽培して食料を生産する活動は？',['農耕','牧畜','狩猟','採集'],0,'農耕は植物を育てて食料を生産します。'],['ch2','basic','動物を飼育して利用する活動は？',['牧畜','農耕','採集','狩猟'],0,'牧畜は家畜を飼育して利用します。'],['ch2','basic','農耕・牧畜の開始によって増えた生活は？',['定住生活','移動生活だけ','海上生活','洞窟生活だけ'],0,'食料を生産・蓄えることで定住が進みました。'],['ch2','basic','ナイル川流域で発達した文明は？',['エジプト文明','メソポタミア文明','インダス文明','中国文明'],0,'ナイル川流域でエジプト文明が発達しました。'],['ch2','basic','古代エジプトの象形文字は？',['ヒエログリフ','くさび形文字','甲骨文字','ローマ字'],0,'ヒエログリフは古代エジプトの文字です。'],['ch2','basic','メソポタミア文明の二つの大河は？',['チグリス川とユーフラテス川','ナイル川とインダス川','黄河と長江','アマゾン川とナイル川'],0,'メソポタミアはこの二つの大河の流域です。'],['ch2','basic','メソポタミア文明の文字は？',['くさび形文字','ヒエログリフ','甲骨文字','万葉仮名'],0,'粘土板などにくさび形文字が刻まれました。'],['ch2','basic','インダス川流域で発達した文明は？',['インダス文明','エジプト文明','中国文明','メソポタミア文明'],0,'インダス川流域でインダス文明が発達しました。'],['ch2','basic','インダス文明の代表的な都市遺跡は？',['モヘンジョ・ダロ','アテネ','ローマ','長安'],0,'モヘンジョ・ダロは代表的な都市遺跡です。'],['ch2','basic','中国文明が発達した代表的な大河は？',['黄河','ナイル川','インダス川','ユーフラテス川'],0,'中国では黄河流域を中心に文明が発達しました。'],['ch2','basic','古代中国で使われた文字資料は？',['甲骨文字','ヒエログリフ','くさび形文字','ローマ字'],0,'甲骨文字は亀の甲や牛の骨などに刻まれました。'],['ch2','basic','儒学のもととなる考えを説いた人物は？',['孔子','シャカ','イエス','ムハンマド'],0,'孔子は儒学のもととなる考えを説きました。'],['ch2','basic','仏教を開いた人物は？',['シャカ','孔子','イエス','ムハンマド'],0,'シャカが仏教を開きました。'],['ch2','basic','キリスト教を開いた人物は？',['イエス','シャカ','孔子','ムハンマド'],0,'イエスの教えをもとにキリスト教が成立しました。'],['ch2','basic','イスラム教を開いた人物は？',['ムハンマド','シャカ','孔子','イエス'],0,'ムハンマドがイスラム教を広めました。'],['ch2','standard','農耕・牧畜の開始によって定住が進んだ理由は？',['食料を生産・蓄えられるようになったから','文字が発明されたから','狩猟が消えたから','都市が先にできたから'],0,'食料生産と蓄えが定住を支えました。'],['ch2','standard','食料の余剰生産が分業につながった理由は？',['農業以外の仕事をする人を支えられたから','食料がなくなったから','移動が増えたから','文字が消えたから'],0,'余った食料が分業を支えました。'],['ch2','standard','大河流域で文明が発達した理由の一つは？',['水を農業に利用できたから','必ず寒いから','海がないから','鉄が多いから'],0,'大河の水は農業を支えました。'],['ch2','standard','文字が生まれた理由の一つは？',['社会や経済の情報を記録する必要があったから','石器が作れなくなったから','農業が消えたから','移動が増えたから'],0,'社会が複雑になると記録の必要性が高まりました。'],['ch2','standard','エジプト文明とメソポタミア文明の共通点は？',['大河流域で発達した','同じ川だった','同じ文字だった','同じ王が治めた'],0,'どちらも大河の流域で発達しました。'],['ch2','standard','宗教が広い地域に伝わる要因の一つは？',['人々の移動・交流や交易','交流の停止','都市の消滅','文字の禁止'],0,'人々の移動や交流、交易などで宗教が伝わりました。'],['ch2','advanced','「人類誕生→農耕・牧畜→定住→分業→都市」の流れが成立する理由は？',['食料生産と余剰が生活と社会を変えたから','文字が最初にできたから','工場ができたから','全員が同じ仕事をしたから'],0,'食料生産と余剰が定住・分業・都市の発達を支えました。'],['ch2','advanced','大河の氾濫がもつ二面性として適切なのは？',['災害になる一方、肥沃な土地をもたらすこともあった','利益だけだった','害だけだった','農業と無関係だった'],0,'氾濫は災害にもなりますが肥沃な土をもたらす場合もありました。'],['ch2','advanced','文明の成立を「川があったから」だけで説明するのが不十分なのはなぜ？',['自然環境だけでなく農業・技術・社会の変化も関係するから','川は無関係だから','文字だけが原因だから','人間は関係ないから'],0,'文明は複数の要因を関連づけて考える必要があります。'],['ch2','advanced','古代文明を比較するとき適切な視点は？',['成立地域・河川・文字・社会などの共通点と相違点','名前の長さだけ','現在の人口だけ','国旗だけ'],0,'複数の観点で比較することが大切です。'],['ch2','advanced','年号だけでなく出来事の因果関係を見るよさは？',['変化が起きた理由や影響を考えられる','年号が不要になる','資料が消える','人物名が不要になる'],0,'原因・結果や影響を見ると歴史の流れが理解できます。']
];
let range='all',level='all',A=[],i=0,s=0;function pick(id){document.querySelectorAll('.grid button').forEach(b=>{if(b.id.startsWith(id[0]))b.classList.remove('sel')});document.getElementById(id).classList.add('sel')}function sh(a){return [...a].sort(()=>Math.random()-.5)}function start(){let p=B.filter(x=>(range==='all'||x[0]===range)&&(level==='all'||x[1]===level));if(!p.length){alert('この条件の問題はありません');return}A=sh(p).slice(0,20);i=0;s=0;begin()}function review(){let ids=JSON.parse(localStorage.getItem('historyWrong')||'[]');let p=B.filter((_,n)=>ids.includes(n));if(!p.length){alert('まだ間違い問題がありません。まず問題を解いてみよう！');return}A=sh(p).slice(0,20);i=0;s=0;begin()}function begin(){home.classList.add('hide');result.classList.add('hide');quiz.classList.remove('hide');show()}function show(){let x=A[i];tag.textContent=(x[0]==='ch1'?'第1章':'第2章 第1節')+'・'+(x[1]==='basic'?'基礎':x[1]==='standard'?'標準':'応用')+'　'+(i+1)+' / '+A.length;bar.style.width=(i/A.length*100)+'%';q.textContent='Q'+(i+1)+'　'+x[2];choices.innerHTML='';fb.innerHTML='';fb.className='';next.classList.add('hide');x[3].forEach((v,n)=>{let b=document.createElement('button');b.textContent=(n+1)+'　'+v;b.onclick=()=>ans(n,b);choices.appendChild(b)})}function ans(n,b){let x=A[i],bs=[...choices.children];bs.forEach(z=>z.disabled=true);bs[x[4]].classList.add('correct');if(n===x[4]){s++;b.classList.add('correct');fb.className='fb ok';fb.innerHTML='⭕ 正解！<br>'+x[5]}else{b.classList.add('wrong');fb.className='fb ng';fb.innerHTML='❌ 不正解。正解は「'+x[3][x[4]]+'」<br>'+x[5];let id=B.indexOf(x),ids=JSON.parse(localStorage.getItem('historyWrong')||'[]');if(!ids.includes(id))ids.push(id);localStorage.setItem('historyWrong',JSON.stringify(ids))}next.classList.remove('hide')}function next(){i++;if(i<A.length)show();else finish()}function finish(){quiz.classList.add('hide');result.classList.remove('hide');let p=Math.round(s/A.length*100);score.textContent=s+' / '+A.length+'問（'+p+'%）';comment.textContent=p>=90?'すばらしい！定期テストでも高得点を狙えるレベルです。':p>=70?'いい感じ！間違えた問題を復習するとさらに伸びます。':'教科書を確認して、もう一度挑戦してみよう。'}function home(){quiz.classList.add('hide');result.classList.add('hide');home.classList.remove('hide')}</script></body></html>
