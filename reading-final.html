const storeKey='toeicReadingMaster';let S=JSON.parse(localStorage.getItem(storeKey)||'{"ans":{},"wrong":{},"best":0}');
function save(){localStorage.setItem(storeKey,JSON.stringify(S))}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function home(){let keys=Object.keys(S.ans),ok=keys.filter(k=>S.ans[k]).length,rate=keys.length?Math.round(ok/keys.length*100):0;screen.innerHTML='<div class="card"><h2>Reading 100</h2><div class="stats"><div class="stat"><b>'+keys.length+'</b>回答</div><div class="stat"><b>'+rate+'%</b>正答率</div><div class="stat"><b>'+Object.keys(S.wrong).length+'</b>復習</div></div><div class="box">本番構成：Part 5 <b>30問</b> → Part 6 <b>16問</b> → Part 7 <b>54問</b><br>合計100問。すべてオリジナル問題です。</div></div><div class="card"><h3>練習を選ぶ</h3><button class="btn" onclick="startAll()">▶ Reading 100問を本番形式で開始</button><div class="grid"><button class="btn light" onclick="startPart(5)">Part 5<br>30問</button><button class="btn light" onclick="startPart(6)">Part 6<br>16問</button></div><button class="btn light" onclick="startPart(7)">Part 7　54問</button><button class="btn light" onclick="review()">🔁 間違い問題だけ復習</button></div><div class="card"><h3>学習記録</h3><div class="box">回答データはこのスマホのブラウザに保存されます。別の端末とは共有されません。</div><button class="btn light" onclick="resetData()">学習記録をリセット</button></div>'}
function startAll(){run(Q.slice(),0,0,false)}function startPart(p){run(Q.filter(x=>x.p===p),0,0,false)}
function shuffleChoices(x){let arr=x.o.map((text,i)=>({text:text,idx:i}));for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return {arr:arr,correct:arr.findIndex(z=>z.idx===x.a)}}
function run(list,i,score,timed){if(i>=list.length){finish(score,list.length);return}let x=list[i],key=Q.indexOf(x),sh=shuffleChoices(x);screen.innerHTML='<div class="meta">Part '+x.p+'｜'+(i+1)+' / '+list.length+(timed?'　<span class="timer">Reading練習モード</span>':'')+'</div><div class="bar"><i style="width:'+Math.round(i/list.length*100)+'%"></i></div><div class="card">'+(x.pass?'<div class="passage">'+esc(x.pass)+'</div>':'')+'<div class="q">'+esc(x.q)+'</div><div class="choices" id="choices"></div><div id="result" class="result"></div></div><button class="btn light" onclick="home()">ダッシュボードへ</button>';let c=document.getElementById('choices');sh.arr.forEach((z,i2)=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=String.fromCharCode(65+i2)+'. '+z.text;b.onclick=()=>answer(x,key,sh,i2,b,list,i,score,timed);c.appendChild(b)})}
function answer(x,key,sh,n,clicked,list,i,score,timed){let bs=document.querySelectorAll('.choice');if(bs[0].disabled)return;let ok=n===sh.correct;bs.forEach((b,j)=>{b.disabled=true;if(j===sh.correct)b.classList.add('ok')});if(!ok)clicked.classList.add('ng');S.ans[key]=ok;if(!ok)S.wrong[key]=1;else delete S.wrong[key];save();document.getElementById('result').innerHTML='<div class="box"><b>'+(ok?'⭕ 正解！':'❌ 不正解')+'</b><br>正解：'+String.fromCharCode(65+sh.correct)+'. '+esc(sh.arr[sh.correct].text)+'</div><div class="box"><b>詳しい解説</b><br>'+esc(x.e)+'</div><div class="box"><b>選択肢チェック</b><br>'+x.o.map((z,j)=>String.fromCharCode(65+j)+'. '+esc(z)+' — '+(j===x.a?'⭕ 正解':'❌ 不正解')).join('<br>')+'</div><div class="box"><b>日本語・確認</b><br>'+esc(x.j)+'</div><div class="box tip"><b>攻略ポイント</b><br>'+esc(x.t)+'</div><button class="btn" id="next">次の問題 →</button>';document.getElementById('next').onclick=()=>run(list,i+1,score+(ok?1:0),timed)}
function finish(c,n){let pct=Math.round(c/n*100);let approx=Math.round(5+pct*4.9);screen.innerHTML='<div class="card"><h2>セット終了 🎉</h2><div class="stats"><div class="stat"><b>'+c</b>正解</div><div class="stat"><b>'+pct+'%</b>正答率</div><div class="stat"><b>'+approx+'</b>点目安</div></div><div class="box">スコア目安は正答率から単純換算した練習用の目安です。本番のTOEICスコアとは一致しません。</div><button class="btn" onclick="home()">学習記録を見る</button><button class="btn light" onclick="review()">間違い問題を復習</button></div>'}
function review(){let list=Object.keys(S.wrong).map(k=>Q[+k]).filter(Boolean);if(!list.length){screen.innerHTML='<div class="card"><h2>🔁 間違い復習</h2><div class="box">復習する問題はありません。👍</div><button class="btn" onclick="home()">戻る</button></div>';return}run(list,0,0,false)}
function resetData(){if(confirm('学習記録をすべて消しますか？')){S={ans:{},wrong:{},best:0};save();home()}}home();
</script></body></html>
