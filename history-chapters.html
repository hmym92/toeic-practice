<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学歴史・章別問題集</title><style>body{margin:0;background:#f3f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:#173f5f;color:#fff;padding:18px}main{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}button{width:100%;border:0;border-radius:11px;padding:14px;margin:6px 0;font-size:16px;background:#edf1f4}.primary{background:#173f5f;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.selected{outline:3px solid #3caea3}.hide{display:none}.q{font-size:19px;font-weight:bold;line-height:1.6}.small{font-size:12px;color:#667}.bar{height:7px;background:#ddd;border-radius:8px;margin:12px 0;overflow:hidden}.bar span{display:block;height:100%;background:#3caea3;width:0}.good{background:#dff5ef!important}.bad{background:#ffe4df!important}.feedback{padding:12px;border-radius:10px;line-height:1.6}.score{text-align:center;font-size:34px;font-weight:bold}.chapter{font-size:18px;text-align:left;padding:17px}</style></head><body><header><b>📚 中学歴史・章別問題集</b><div class="small" style="color:#fff">東京書籍「新編 新しい社会 歴史」</div></header><main><div id="home" class="card"><h2>📖 問題を選ぶ</h2><button id="ch1" class="chapter selected">第1章　歴史へのとびら</button><button id="ch2" class="chapter">第2章 第1節　世界の古代文明と宗教のおこり</button><h3>レベル</h3><div class="grid"><button id="all" class="selected">全部</button><button id="basic">🟢 基礎</button><button id="std">🟡 標準</button><button id="adv">🔴 応用</button></div><button id="start" class="primary">▶ この章から20問</button><button id="review">🔄 この章の間違い問題</button></div><div id="quiz" class="card hide"><div id="info" class="small"></div><div class="bar"><span id="prog"></span></div><div id="qq" class="q"></div><div id="ans"></div><div id="fb"></div><button id="next" class="primary hide">次の問題 →</button></div><div id="result" class="card hide"><h2>🎉 結果</h2><div id="sc" class="score"></div><p id="msg"></p><button id="again" class="primary">この章をもう一度</button><button id="back">章選択へ</button></div></main><script>(function(){'use strict';var Q=[];function add(r,l,q,a,c,e){Q.push({r:r,l:l,q:q,a:a,c:c,e:e})}fetch('history100.html?v=1').then(function(res){return res.text()}).then(function(html){var s=html.substring(html.indexOf('var Q=[];function add'),html.indexOf("var range='all'"));s=s.substring(s.indexOf('\n')+1);eval(s);initData();}).catch(function(){alert('問題データを読み込めませんでした。通信を確認してください。')});var chapter='ch1',level='all',list=[],i=0,score=0;function $(x){return document.getElementById(x)}function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}function selectChapter(c){chapter=c;$('ch1').classList.toggle('selected',c==='ch1');$('ch2').classList.toggle('selected',c==='ch2')}function selectLevel(l){level=l;['all','basic','std','adv'].forEach(function(x){$(x).classList.toggle('selected',x===l)})}function initData(){$('ch1').onclick=function(){selectChapter('ch1')};$('ch2').onclick=function(){selectChapter('ch2')};$('all').onclick=function(){selectLevel('all')};$('basic').onclick=function(){selectLevel('basic')};$('std').onclick=function(){selectLevel('std')};$('adv').onclick=function(){selectLevel('adv')};$('start').onclick=function(){var a=Q.filter(function(x){return x.r===chapter&&(level==='all'||x.l===level)});if(!a.length){alert('この条件の問題はありません');return}begin(a)};$('review').onclick=function(){var ids=JSON.parse(localStorage.getItem('historyWrong')||'[]');var a=Q.filter(function(x,n){return x.r===chapter&&ids.indexOf(n)>=0});if(!a.length){alert('この章にはまだ間違い問題がありません。');return}begin(a)};$('again').onclick=function(){var a=Q.filter(function(x){return x.r===chapter&&(level==='all'||x.l===level)});begin(a)};$('back').onclick=function(){$('result').classList.add('hide');$('home').classList.remove('hide')}}function begin(a){list=shuffle(a).slice(0,20);list.forEach(function(x){var p=x.a.map(function(v,n){return{v:v,ok:n===x.c}});p=shuffle(p);x.a=p.map(function(z){return z.v});x.c=p.findIndex(function(z){return z.ok})});i=0;score=0;$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');show()}function show(){var x=list[i];$('info').textContent=(chapter==='ch1'?'第1章　歴史へのとびら':'第2章 第1節　世界の古代文明と宗教のおこり')+'　'+(x.l==='basic'?'基礎':x.l==='std'?'標準':'応用')+'　'+(i+1)+' / '+list.length;$('prog').style.width=(i/list.length*100)+'%';$('qq').textContent='Q'+(i+1)+'　'+x.q;$('ans').innerHTML='';$('fb').innerHTML='';$('fb').className='';$('next').classList.add('hide');x.a.forEach(function(v,n){var b=document.createElement('button');b.textContent=(n+1)+'　'+v;b.onclick=function(){answer(n,b)};$('ans').appendChild(b)})}function answer(n,b){var x=list[i],bs=$('ans').children;for(var j=0;j<bs.length;j++)bs[j].disabled=true;bs[x.c].classList.add('good');if(n===x.c){score++;b.classList.add('good');$('fb').className='feedback good';$('fb').innerHTML='⭕ 正解！<br>'+x.e}else{b.classList.add('bad');$('fb').className='feedback bad';$('fb').innerHTML='❌ 不正解。正解は「'+x.a[x.c]+'」<br>'+x.e;var id=Q.indexOf(x),ids=JSON.parse(localStorage.getItem('historyWrong')||'[]');if(ids.indexOf(id)<0)ids.push(id);localStorage.setItem('historyWrong',JSON.stringify(ids))}$('next').classList.remove('hide')}$('next').onclick=function(){i++;if(i<list.length)show();else finish()};function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');var p=Math.round(score/list.length*100);$('sc').textContent=score+' / '+list.length+'問（'+p+'%）';$('msg').textContent=p>=90?'すばらしい！':p>=70?'いい感じ！':'教科書を確認して、もう一度挑戦しよう。'}})();</script></body></html>
