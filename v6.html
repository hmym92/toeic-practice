<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13263d"><title>TOEIC Quick Practice</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17212b}.app{max-width:620px;margin:auto;background:#fff;min-height:100vh}header{background:#13263d;color:#fff;padding:20px 18px}h1{margin:0;font-size:22px}header p{margin:5px 0 0;font-size:12px;opacity:.82}main{padding:17px}.grid{display:grid;gap:10px}.part,.opt,.btn,.mini{width:100%;border-radius:12px;font-size:15px;padding:14px}.part,.opt,.mini{background:#fff;border:1px solid #d9e0e7;text-align:left}.part b{display:block}.part span,.small{font-size:12px;color:#687584;line-height:1.65}.btn{border:0;background:#13263d;color:#fff;font-weight:700;margin-top:9px}.gray{background:#edf0f3;color:#263746}.blue{background:#2676c9}.q{font-size:18px;line-height:1.7;margin:16px 0}.card{border:1px solid #d9e0e7;border-radius:16px;padding:16px}.bar{font-size:12px;color:#687584;display:flex;justify-content:space-between}.prog{height:7px;background:#e8ecf0;border-radius:9px;margin:8px 0 16px;overflow:hidden}.fill{height:100%;background:#2676c9}.opt:disabled{opacity:1}.ok{background:#e7f7ed;border-color:#45a46b}.ng{background:#fff0f0;border-color:#d45c5c}.feedback{display:none;margin-top:13px;border-radius:13px;background:#f5f8fb;padding:14px;font-size:13px;line-height:1.8}.show{display:block}.feedback h3{margin:0 0 8px;font-size:16px}.tip{background:#fff8e5;border-left:4px solid #e2b63b;padding:11px;margin-top:10px}.translation{background:#eef6ff;padding:11px;border-radius:9px;margin-top:9px}.tags{margin:8px 0}.tag{display:inline-block;background:#e9f1fa;border-radius:99px;padding:4px 8px;font-size:11px;margin:2px}.score{text-align:center;font-size:48px;font-weight:800;color:#1768bb;margin-top:24px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.stat div{border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center;font-size:11px}.stat b{display:block;font-size:20px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.section{border:1px solid #e0e5ea;border-radius:14px;padding:13px;margin:10px 0}.section h3{margin:0 0 8px;font-size:15px}.wrong{border-left:4px solid #d45c5c}.correct{border-left:4px solid #45a46b}.timer{text-align:center;font-size:25px;font-weight:800;margin:8px}.audio{display:flex;gap:8px;margin:10px 0}.audio button{flex:1}.muted{color:#7b8792}.danger{color:#b33}.hidden{display:none!important}</style></head><body><div class="app"><header><h1>TOEIC Quick Practice</h1><p>Part 1〜7 ・ 200問 ・ 解説／復習／学習記録</p></header><main id="screen"></main></div><script>
(function(){'use strict';
var screen=document.getElementById('screen');
var names=['','写真描写','応答問題','会話問題','説明文問題','短文穴埋め','長文穴埋め','読解問題'];
var counts=[0,20,30,30,30,40,20,30];
var seed={
1:[['👩‍💻📄','A woman is working at a computer.',['A woman is working at a computer.','A man is repairing a bicycle.','Several people are swimming.','The room is being cleaned.'],0,'人物＋動作','写真に実際に確認できる動作を選ぶ。'],['☕🪑','A cup is on a table.',['A cup is on a table.','A man is opening a door.','The table is being moved.','People are waiting outside.'],0,'物＋位置','on＝〜の上に。位置関係を確認する。'],['🚲🌳','A bicycle is parked near a tree.',['A bicycle is parked near a tree.','A woman is riding a bus.','A tree is being cut down.','The bicycle is being repaired.'],0,'物＋状態','parked＝駐車・停められている状態。'],['👨‍🍳🍳','A chef is preparing food.',['A chef is preparing food.','The chef is serving customers.','The kitchen is closed.','The food has been delivered.'],0,'人物＋動作','preparing＝準備している。'],['📦🚚','Boxes are being loaded onto a truck.',['Boxes are being loaded onto a truck.','The truck is being repaired.','The boxes are empty.','A driver is leaving the truck.'],0,'受動態','are being loaded＝積み込まれている。']],
2:[['When will the meeting begin?',['At nine o’clock.','In the conference room.','Yes, it began.'],0,'疑問詞','When→時間'],['Where is the report?',['On my desk.','Tomorrow morning.','Yes, I reported it.'],0,'疑問詞','Where→場所'],['Why was the train delayed?',['Because of heavy rain.','At the station.','For two hours.'],0,'疑問詞','Why→理由'],['Could you help me?',['Of course.','At noon.','It is helpful.'],0,'依頼','依頼への自然な応答'],['Who ordered the supplies?',['Ms. Kim did.','Last Tuesday.','At the office.'],0,'疑問詞','Who→人']],
3:[['Woman: Did you send the invoice? Man: Yes, I sent it this morning.\n\nWhat did the man send?',['An invoice.','A schedule.','A package.','A letter.'],0,'What問題','invoice＝請求書'],['Man: The printer needs paper. Woman: I will get some.\n\nWhat will the woman do?',['Get paper.','Repair the printer.','Call a client.','Leave the office.'],0,'What問題','will→これからすること'],['Woman: When is the meeting? Man: At three.\n\nWhen is the meeting?',['At three.','At two.','At four.','At five.'],0,'When問題','時刻を聞く問題'],['Man: Are you joining lunch? Woman: No, I have an appointment.\n\nWhy will she not join?',['She has an appointment.','She is hungry.','She is traveling.','She is working late.'],0,'Why問題','理由を直接聞き取る'],['Woman: Did you reserve a room? Man: Yes, for Friday.\n\nWhen is the reservation?',['Friday.','Monday.','Tuesday.','Thursday.'],0,'When問題','for Friday→金曜日に']],
4:[['Attention passengers: Flight 218 will depart from Gate 12.\n\nWhere will the flight depart?',['Gate 12','Gate 8','Gate 18','Gate 20'],0,'場所','Gate＝搭乗口'],['The library closes at six today because of staff training.\n\nWhy does it close early?',['Staff training.','A holiday.','Repairs.','A meeting.'],0,'理由','because of→〜が理由で'],['The store offers free delivery this weekend.\n\nWhen is free delivery available?',['This weekend.','Every day.','Next month.','Today only.'],0,'時期','this weekend→今週末'],['Visitors must sign in at the front desk.\n\nWhat must visitors do?',['Sign in.','Buy a ticket.','Call a manager.','Wear a uniform.'],0,'行動','must→〜しなければならない'],['The theater doors open at 6:30 and the show starts at 7.\n\nWhen do the doors open?',['6:30.','7:00.','6:00.','7:30.'],0,'時刻','open→開く']],
5:[['The company has ______ the deadline.',['extended','extending','extension','extensively'],0,'現在完了','has＋過去分詞'],['Please make sure the forms are ______.',['complete','completed','completion','completing'],1,'受動態','are＋過去分詞'],['She can ______ difficult problems quickly.',['solve','solved','solving','solution'],0,'助動詞','can＋動詞原形'],['The room is available ______ 2 and 4 p.m.',['among','between','during','while'],1,'前置詞','between A and B'],['Please respond ______ to customers.',['prompt','promptly','promptness','prompted'],1,'品詞','動詞を修飾→副詞'],['The manager spoke very ______ during the meeting.',['clear','clearly','clarity','clearing'],1,'品詞','spokeを修飾→副詞']],
6:[['The office will be closed Monday for maintenance. Employees who need access should contact Facilities.\n\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors only.','The manager only.'],0,'人物特定','who→人物'],['A survey is available online for seminar participants.\n\nWhat is available online?',['A survey.','A receipt.','A map.','A ticket.'],0,'内容特定','survey＝アンケート'],['Your order has shipped and can be tracked online.\n\nWhat can the customer do?',['Track the order.','Change the store.','Cancel the building.','Attend a seminar.'],0,'行動','tracked＝追跡できる'],['The east elevator is out of service. Use the west elevator.\n\nWhich elevator should visitors use?',['The west elevator.','The east elevator.','The freight elevator.','The service elevator.'],0,'場所','out of service＝使用停止'],['New security badges will be distributed Wednesday. Bring your current badge.\n\nWhat should employees bring?',['Their current badge.','A passport.','A receipt.','A laptop.'],0,'持ち物','bring＝持ってくる']],
7:[['City Hotel: Check-in begins at 3 p.m. Breakfast is included.\n\nWhat is included?',['Breakfast.','Dinner.','Parking.','Airport transfer.'],0,'情報検索','included＝含まれている'],['Office chairs are 20% off. Customers buying three or more receive free delivery.\n\nWho gets free delivery?',['Customers buying three or more chairs.','Everyone.','Customers buying one chair.','Employees only.'],0,'条件','three or more＝3つ以上'],['The 10 a.m. meeting has moved to 11 a.m. because the client’s flight is delayed.\n\nWhy was it moved?',['The flight is delayed.','The room is unavailable.','Sales changed.','The employee was late.'],0,'理由','because→理由'],['The west entrance is closed. Please use the main entrance.\n\nWhich entrance should visitors use?',['The main entrance.','The west entrance.','The staff entrance.','The parking entrance.'],0,'指示','closed→使えない'],['Job Fair: Bring several copies of your résumé.\n\nWhat should visitors bring?',['Résumés.','Tickets.','Lunch.','Uniforms.'],0,'持ち物','résumé＝履歴書']]};
var parts={};for(var p=1;p<=7;p++){parts[p]=[];for(var n=0;n<counts[p];n++){var s=seed[p][n%seed[p].length];parts[p].push([s[0],s[1].slice(),s[2]||0,s[3]||'',s[4]||'',n]);}}
var state={part:0,index:0,score:0,locked:false,mode:'normal',mockStart:0};
var data={answers:{},wrong:{},history:[]};try{data=JSON.parse(localStorage.getItem('toeic-v6-data')||JSON.stringify(data))}catch(e){}
function save(){try{localStorage.setItem('toeic-v6-data',JSON.stringify(data))}catch(e){}}
function key(p,i){return p+'-'+i}
function home(){var total=0,correct=0,wrongCount=Object.keys(data.wrong).length;Object.keys(data.answers).forEach(function(k){total++;if(data.answers[k].correct)correct++});var h='<h2>TOEIC 総合問題集</h2><p class="small">問題→回答→詳しい解説→復習まで、ひとつの画面で学習できます。</p><div class="stat"><div><b>'+total+'</b>回答</div><div><b>'+(total?Math.round(correct/total*100):0)+'%</b>正答率</div><div><b>'+wrongCount+'</b>復習</div></div><div class="nav"><button class="mini" onclick="TOEIC.dashboard()">📊 学習記録</button><button class="mini" onclick="TOEIC.review()">🔁 間違い復習</button></div><button class="btn blue" onclick="TOEIC.mock()">🔥 本番モード（200問）</button><h3>Part別練習</h3><div class="grid">';for(var p=1;p<=7;p++){var a=0,c=0;Object.keys(data.answers).forEach(function(k){if(k.indexOf(p+'-')===0){a++;if(data.answers[k].correct)c++}});h+='<button class="part" onclick="TOEIC.start('+p+')"><b>Part '+p+'　'+names[p]+'</b><span>'+counts[p]+'問'+(a?' ・ 学習 '+a+'問 ・ 正答率 '+Math.round(c/a*100)+'%':' ・ 未学習')+'</span></button>'}h+='</div><p class="small">※学習用オリジナル問題です。</p>';screen.innerHTML=h}
function start(p){state={part:p,index:0,score:0,locked:false,mode:'normal',mockStart:0};show();window.scrollTo(0,0)}
function mock(){state={part:1,index:0,score:0,locked:false,mode:'mock',mockStart:Date.now()};show();window.scrollTo(0,0)}
function show(){var p=state.part,i=state.index,q=parts[p][i];var h='<div class="bar"><span>Part '+p+'　'+(i+1)+' / '+counts[p]+'</span><span>正解 '+state.score+'</span></div>';if(state.mode==='mock'){var elapsed=Math.floor((Date.now()-state.mockStart)/1000),remain=Math.max(0,3600-elapsed);h+='<div class="timer" id="timer">⏱ '+Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0')+'</div>'}h+='<div class="prog"><div class="fill" style="width:'+((i)/counts[p]*100)+'%"></div></div><div class="card">';if(p===1)h+='<div style="font-size:60px;text-align:center;background:#f7f8fa;border-radius:12px;padding:18px">'+q[0]+'</div><div class="q">写真について最も適切な英文を選んでください。</div>';else h+='<div class="q" style="white-space:pre-line">'+q[0]+'</div>';if(p>=2&&p<=4)h+='<div class="audio"><button class="btn blue" onclick="TOEIC.speak()">🔊 音声を再生</button><button class="btn gray" onclick="TOEIC.speakSlow()">🐢 ゆっくり</button></div>';h+='<div class="grid">';for(var j=0;j<q[1].length;j++)h+='<button class="opt" onclick="TOEIC.answer('+j+')">'+String.fromCharCode(65+j)+'. '+q[1][j]+'</button>';h+='</div><div id="feedback" class="feedback"></div><button id="next" class="btn" style="display:none" onclick="TOEIC.next()">次の問題 →</button>';if(state.mode!=='mock')h+='<button class="btn gray" onclick="TOEIC.home()">Part選択へ</button>';h+='</div>';screen.innerHTML=h;if(state.mode==='mock')setTimeout(tick,300)}
function tick(){if(state.mode!=='mock')return;var el=document.getElementById('timer');if(!el)return;var remain=Math.max(0,3600-Math.floor((Date.now()-state.mockStart)/1000));el.textContent='⏱ '+Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');if(remain<=0){result();return}setTimeout(tick,1000)}
function answer(j){if(state.locked)return;state.locked=true;var p=state.part,i=state.index,q=parts[p][i],a=q[2],bs=document.querySelectorAll('.opt');for(var x=0;x<bs.length;x++){bs[x].disabled=true;if(x===a)bs[x].classList.add('ok');if(x===j&&j!==a)bs[x].classList.add('ng')}var correct=j===a;if(correct)state.score++;var k=key(p,i);data.answers[k]={correct:correct,at:Date.now(),choice:j};if(!correct)data.wrong[k]={p:p,i:i};else delete data.wrong[k];data.history.unshift({p:p,i:i,correct:correct,at:Date.now()});data.history=data.history.slice(0,100);save();document.getElementById('feedback').innerHTML=detail(q,a,j);document.getElementById('feedback').className='feedback show';document.getElementById('next').style.display='block'}
function detail(q,a,j){var ans=q[1][a],chosen=q[1][j],p=state.part;var h='<h3>'+icon(p)+' Part '+p+' 詳細解説</h3><div class="tags"><span class="tag">'+q[3]+'</span><span class="tag">'+q[4]+'</span></div><b>① 正解の理由</b><br>'+reason(q,a)+'<div class="translation"><b>正解：</b>'+String.fromCharCode(65+a)+'. '+ans+'<br><b>日本語：</b>'+meaning(ans)+'</div><div class="section"><b>② 選択肢チェック</b><br>';for(var z=0;z<q[1].length;z++){h+='<div style="margin-top:6px"><b>'+String.fromCharCode(65+z)+'.</b> '+q[1][z]+' — '+(z===a?'⭕ 正解。':'❌ 今回の条件には合いません。')+'</div>'}h+='</div><div class="section"><b>③ 重要語句・文法</b><br>'+q[4]+'</div><div class="tip"><b>④ TOEIC攻略：</b>'+q[5]+'</div>';if(j!==a)h+='<div class="section wrong"><b>⑤ あなたの選択</b><br>'+String.fromCharCode(65+j)+'. '+chosen+'<br>次回は「設問が何を聞いているか」を先に確認しましょう。</div>';else h+='<div class="section correct"><b>⑤ ナイス！</b><br>正解できています。解説を読んで、根拠を言葉にできれば定着度がさらに上がります。</div>';return h}
function icon(p){return ['','📷','🎧','🎧','🎧','✏️','📄','📚'][p]}
function reason(q,a){var p=state.part;if(p===1)return '写真で確認できる人物・物・動作が、正解文の内容と一致します。写真問題では、想像ではなく「見えている事実」を優先します。';if(p===2)return '質問の最初の疑問詞と、選択肢が示す情報の種類が一致しています。';if(p===3||p===4)return '会話・アナウンスの中に、設問が求めている情報が直接含まれています。キーワードを拾うことがポイントです。';if(p===5)return '空欄の前後から必要な文法・品詞を判断すると、正解を絞れます。';return '本文から設問のキーワードを探し、該当箇所の前後を確認すると正解の根拠を確認できます。'}
function meaning(s){var d={'A woman is working at a computer.':'女性がコンピューターで仕事をしています。','A cup is on a table.':'カップがテーブルの上にあります。','A bicycle is parked near a tree.':'自転車が木の近くに停められています。','A chef is preparing food.':'シェフが料理を準備しています。','Boxes are being loaded onto a truck.':'箱がトラックに積み込まれています。','At nine o’clock.':'9時です。','On my desk.':'私の机の上です。','Because of heavy rain.':'大雨が理由です。','Of course.':'もちろんです。','Ms. Kim did.':'キムさんです。','An invoice.':'請求書です。','Get paper.':'紙を取りに行きます。','At three.':'3時です。','Friday.':'金曜日です。','Gate 12':'12番ゲートです。','Staff training.':'職員研修です。','This weekend.':'今週末です。','Sign in.':'受付で記名します。','6:30.':'6時30分です。','extended':'延長した','completed':'完了した','solve':'解決する','between':'〜の間に','promptly':'迅速に','clearly':'明確に','Breakfast.':'朝食です。','Track the order.':'注文品を追跡する。','The west elevator.':'西側のエレベーターです。','Their current badge.':'現在のバッジです。','Customers buying three or more chairs.':'椅子を3脚以上購入する顧客です。','The flight is delayed.':'フライトが遅れているためです。','The main entrance.':'正面入口です。','Résumés.':'履歴書です。'};return d[s]||'選択肢の内容を日本語にして確認しましょう。'}
function next(){state.index++;state.locked=false;if(state.index>=counts[state.part])result();else{show();window.scrollTo(0,0)}}
function result(){screen.innerHTML='<div class="score">'+state.score+' / '+counts[state.part]+'</div><h2 style="text-align:center">Part '+state.part+' 終了</h2><p style="text-align:center">正答率 '+Math.round(state.score/counts[state.part]*100)+'%</p><button class="btn" onclick="TOEIC.start('+state.part+')">もう一度</button><button class="btn gray" onclick="TOEIC.home()">ホームへ</button>'}
function review(){var ks=Object.keys(data.wrong);if(!ks.length){screen.innerHTML='<h2>🔁 間違い復習</h2><div class="section correct">現在、復習待ちの問題はありません。</div><button class="btn" onclick="TOEIC.home()">ホームへ</button>';return}var h='<h2>🔁 間違い復習</h2><p class="small">間違えた問題だけをもう一度解きます。</p><div class="grid">';ks.slice(0,30).forEach(function(k){var x=data.wrong[k],q=parts[x.p][x.i];h+='<button class="part" onclick="TOEIC.reviewOne('+x.p+','+x.i+')"><b>Part '+x.p+' 問題 '+(x.i+1)+'</b><span>'+q[3]+' ・ '+q[4]+'</span></button>'});h+='</div><button class="btn gray" onclick="TOEIC.home()">ホームへ</button>';screen.innerHTML=h}
function reviewOne(p,i){state={part:p,index:i,score:0,locked:false,mode:'review',mockStart:0};show()}
function dashboard(){var h='<h2>📊 学習記録</h2>';for(var p=1;p<=7;p++){var a=0,c=0;Object.keys(data.answers).forEach(function(k){if(k.indexOf(p+'-')===0){a++;if(data.answers[k].correct)c++}});h+='<div class="section"><b>Part '+p+'　'+names[p]+'</b><br><span class="small">回答 '+a+'問 ／ 正答率 '+(a?Math.round(c/a*100):0)+'% ／ 復習 '+Object.keys(data.wrong).filter(function(k){return k.indexOf(p+'-')===0}).length+'問</span></div>'}h+='<h3>最近の学習</h3>';data.history.slice(0,10).forEach(function(x){h+='<div class="section '+(x.correct?'correct':'wrong')+'">Part '+x.p+' 問題 '+(x.i+1)+' — '+(x.correct?'正解':'不正解')+'</div>'});h+='<button class="btn gray" onclick="TOEIC.home()">ホームへ</button>';screen.innerHTML=h}
function speak(rate){var p=state.part,q=parts[p][state.index],text=q[0];if(!('speechSynthesis'in window)){alert('この端末では音声機能を利用できません。');return}window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||0.9;window.speechSynthesis.speak(u)}
window.TOEIC={home:home,start:start,mock:mock,answer:answer,next:next,review:review,reviewOne:reviewOne,dashboard:dashboard,speak:function(){speak(.9)},speakSlow:function(){speak(.65)}};home();
})();</script></body></html>
