function home(){var total=Object.keys(store.a).length,correct=Object.values(store.a).filter(Boolean).length;M.innerHTML='<h2>TOEIC 200問トレーニング</h2><p class="small">Part 1〜7をまとめて練習。回答後は「なぜ正解か」だけでなく「なぜ他が違うか」まで確認できます。</p><div class="stats"><div><b>'+total+'</b>回答</div><div><b>'+(total?Math.round(correct/total*100):0)+'%</b>正答率</div><div><b>'+Object.keys(store.w).length+'</b>復習</div></div><button class="btn" onclick="T.all()">▶ 200問スタート</button><button class="btn ghost" onclick="T.review()">🔁 間違い復習</button><button class="btn ghost" onclick="T.record()">📊 学習記録・弱点</button><h3>Part別</h3>';for(var p=1;p<=7;p++)M.innerHTML+='<button class="part" onclick="T.part('+p+')">Part '+p+'　'+P[p].name+'<span>'+P[p].q.length+'問</span></button>'}

function answer(n){var z=st.list[st.pos],p=z[0],i=z[1],q=P[p].q[i],ok=n===q[3],key=p+'-'+i;if(ok)st.score++;document.querySelectorAll('.choice').forEach(function(b,j){b.disabled=true;if(j===q[3])b.classList.add('ok');if(j===n&&!ok)b.classList.add('ng')});store.a[key]=ok;if(ok)delete store.w[key];else store.w[key]=1;store.hist.unshift({p:p,i:i,ok:ok});save();var h='<div class="box"><span class="tag">正解の理由</span><br><b>'+q[4]+'</b></div><div class="box"><span class="tag">全選択肢の確認</span><br>';for(var j=0;j<q[2].length;j++)h+=String.fromCharCode(65+j)+'. '+q[2][j]+' — '+(j===q[3]?'⭕ 正解。':'❌ 正解ではありません。')+'<br>';h+='</div><div class="box"><span class="tag">日本語訳</span><br>'+q[5]+'</div><div class="box"><span class="tag">重要ポイント</span><br>'+q[4]+'</div><div class="box tip"><span class="tag">TOEIC攻略</span><br>'+tip(p)+'</div>';if(!ok)h+='<div class="box"><b>🔁 間違い復習に登録しました</b><br>もう一度正解できるまで復習しましょう。</div>';document.getElementById('exp').innerHTML=h;document.getElementById('next').style.display='block'}
function tip(p){return p===1?'写真にない情報を想像しない。人物・物・位置・動作の4点だけを見る。':p===2?'最初の疑問詞を聞き取り、答えの種類（時間・場所・理由など）を予測する。':p===3?'設問を先に読み、会話中のキーワードと同義表現を拾う。':p===4?'数字・日時・場所・理由は特に聞き逃さない。選択肢を先に確認する。':p===5?'空欄の前後を見て、品詞→文法→意味の順に判断する。':p===6?'空欄の前後だけでなく、段落全体の流れを確認する。':'設問のキーワードを本文から探し、数字・条件・時系列を照合する。'}
