<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Quick Practice v14</title><style>body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#17212b}.app{max-width:700px;margin:auto;min-height:100vh;background:#fff}.head{background:#142a43;color:#fff;padding:22px 18px}.head h1{margin:0 0 6px}.main{padding:18px}.meta{color:#687584;font-size:14px}.bar{height:7px;background:#e5e9ed;border-radius:8px;margin:9px 0 18px}.bar i{display:block;height:100%;background:#2b557d;border-radius:8px}.card{border:1px solid #d7dee5;border-radius:16px;padding:18px}.q{font-size:19px;line-height:1.75;white-space:pre-line;margin-bottom:18px}.choices{display:grid;gap:10px}.choice{width:100%;min-height:54px;padding:13px;border:2px solid #d9e0e6;border-radius:12px;background:#fff;text-align:left;font-size:16px}.choice.correct{border-color:#42a56d;background:#eaf8ef}.choice.wrong{border-color:#d86565;background:#fff0f0}.choice:disabled{opacity:1}.box{background:#f5f7f9;border-radius:12px;padding:13px;margin-top:10px;line-height:1.75}.tip{background:#fff7df;border-left:4px solid #d1a42f}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#142a43;color:#fff;font-size:16px;font-weight:700}.secondary{background:#edf1f4;color:#17212b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid #ddd;border-radius:10px;padding:9px}.stat b{display:block;font-size:21px}.part{width:100%;text-align:left;background:#fff;border:1px solid #d9dfe5;border-radius:12px;padding:14px;margin:7px 0;font-size:16px}.part small{float:right;color:#687584}</style></head><body><div class="app"><header class="head"><h1>TOEIC Quick Practice</h1><div>v14｜200問・本番対策・詳しい解説</div></header><main class="main" id="app"></main></div><script>
const app=document.getElementById('app');
const names=['写真描写','応答問題','会話問題','説明文問題','短文穴埋め','長文穴埋め','読解問題'];
const tips=['','写真では人物・物・位置・動作の4点に絞る。似た単語ではなく、写真と一致する動作を選ぶ。','最初に疑問詞を確認。When=時間、Where=場所、Why=理由、Who=人物、How often=頻度。','設問を先読みし、会話の「変更・依頼・場所・時間・理由」を拾う。','数字・日時・固有名詞はメモするつもりで聞く。聞き取れなくても前後から推測する。','空欄の前後→品詞→文型→語法→意味の順に判断する。','空欄だけでなく前後の文脈を読み、代名詞・接続詞・語彙のつながりを確認する。','設問のキーワードを本文で探し、数字・条件・時系列を照合する。'];
let Q=[];
function add(p,stem,opts,ans,why,ja){Q.push({p,stem,opts,ans,why,ja});}
// Part 1
[['A woman is typing at a desk.','A woman is carrying a box.','A man is opening a window.','The desk is being moved.','女性が机で入力しています。','typing at a desk＝机で入力する。'],['Several people are waiting in a lobby.','Several people are boarding a bus.','The lobby is being cleaned.','A man is selling tickets.','何人かの人がロビーで待っています。','are waiting＝待っている。人物の状態を確認する。'],['A truck is parked beside a warehouse.','A truck is leaving a tunnel.','Workers are washing the truck.','The warehouse is being demolished.','トラックが倉庫のそばに駐車されています。','parked beside＝〜のそばに駐車されている。'],['A man is watering some plants.','A man is cutting down a tree.','The plants are being sold.','People are entering a store.','男性が植物に水をやっています。','watering plants＝植物に水をやる。'],['Books have been placed on a shelf.','A shelf is being repaired.','A woman is buying books.','Books are being delivered.','本が棚に置かれています。','have been placed＝置かれている。状態を表す受動態。'],['Passengers are getting off a train.','Passengers are buying tickets.','A train is being painted.','A station is being closed.','乗客が電車から降りています。','get off＝乗り物から降りる。']].forEach(x=>add(1,x[0],[x[0],x[1],x[2],x[3]],0,x[5],x[4]));
// Part 2: 25 unique prompts
[['When is the presentation?',['At three o’clock.','In Room 4.','By Ms. Kim.'],0,'Whenは時間。','プレゼンテーションはいつですか。'],['Where can I park?',['Behind the building.','Next Friday.','For two hours.'],0,'Whereは場所。','どこに駐車できますか。'],['Why did you leave early?',['Because I felt sick.','At the station.','For an hour.'],0,'Whyは理由。','なぜ早く帰ったのですか。'],['Who will lead the project?',['Mr. Brown will.','On Monday.','About ten people.'],0,'Whoは人物。','誰がプロジェクトを率いますか。'],['How often is the newsletter published?',['Once a month.','By email.','In the office.'],0,'How oftenは頻度。','ニュースレターはどのくらいの頻度で発行されますか。'],['How much does delivery cost?',['Twenty dollars.','Two days.','At the front desk.'],0,'How muchは金額。','配送料はいくらですか。'],['Could you reserve a meeting room?',['Certainly. I’ll do it now.','It is on the second floor.','At two o’clock.'],0,'依頼には承諾・拒否などで応答する。','会議室を予約してもらえますか。'],['Would you like to join us?',['Sure, I’d love to.','At the station.','It was yesterday.'],0,'誘いへの自然な応答。','私たちに加わりませんか。'],['Did the shipment arrive?',['Yes, this morning.','At the warehouse.','For three days.'],0,'DidはYes/No型。','発送品は届きましたか。'],['Is the cafeteria open today?',['No, it is closed for repairs.','On the first floor.','At noon.'],0,'Is〜?にはYes/No。','食堂は今日開いていますか。'],['What time does the store open?',['At eight.','Near the station.','With cash.'],0,'What timeは時刻。','店は何時に開きますか。'],['Where did you buy the printer?',['At a local electronics store.','Last week.','For the new office.'],0,'Whereは購入場所。','そのプリンターをどこで買いましたか。'],['Why is the manager absent?',['She is attending a conference.','In the afternoon.','Three managers.'],0,'Whyは理由。','なぜマネージャーは不在なのですか。'],['Who ordered the supplies?',['The purchasing team did.','Yesterday afternoon.','From the website.'],0,'Whoは人物・部署。','誰が備品を注文しましたか。'],['How long is the training session?',['About ninety minutes.','In the training room.','Every Friday.'],0,'How longは期間。','研修はどのくらいですか。'],['How many copies do we need?',['Thirty.','For the client.','Tomorrow.'],0,'How manyは数量。','何部必要ですか。'],['When should I submit this form?',['By Friday.','To Human Resources.','With a signature.'],0,'Whenは提出時期。','この書類はいつ提出すべきですか。'],['Where is the nearest ATM?',['Across from the bank.','At five o’clock.','About ten minutes.'],0,'Whereは場所。','最寄りのATMはどこですか。'],['Why was the meeting canceled?',['The speaker is unavailable.','In the main hall.','Next month.'],0,'Whyは理由。','なぜ会議は中止されたのですか。'],['Who can approve this request?',['The department director.','On the form.','For two weeks.'],0,'Whoは人物。','誰がこの申請を承認できますか。'],['Would you like a printed receipt?',['Yes, please.','At the register.','It costs five dollars.'],0,'申し出への応答。','紙の領収書はいかがですか。'],['Can I change my reservation?',['Yes, if you call before noon.','In Room 12.','Last Tuesday.'],0,'Can I〜?には可否で答える。','予約を変更できますか。'],['Have you finished the report?',['Almost. I need another hour.','In the conference room.','Last month.'],0,'Have you〜?は完了の有無を尋ねる。','報告書は完成しましたか。'],['Should we take the express train?',['Yes, it is faster.','At platform three.','For the airport.'],0,'Should we〜?は提案への応答。','急行列車に乗りましょうか。'],['Are you attending the workshop?',['No, I have another appointment.','At the convention center.','For two hours.'],0,'Are you〜?にはYes/No。','あなたはそのワークショップに参加しますか。']].forEach(x=>add(2,x[0],x[1],x[2],x[3],x[4]));
// Part 3/4/6/7 use distinct mini passages
const conv=[['A: The client called this morning. B: Did she change the delivery date? A: Yes, she moved it to Thursday.','What did the client change?',['The delivery date.','The price.','The address.','The product.'],0,'moved it to Thursdayなので変更されたのはdelivery date。','顧客は何を変更しましたか。'],['A: We need more chairs for Friday. B: I can order ten today. A: Great. Please use the usual supplier.','What will B do?',['Order chairs.','Cancel a meeting.','Contact a client.','Move the event.'],0,'I can order ten todayが行動予定。','Bは何をしますか。'],['A: Where is the new employee? B: She is in orientation until noon. A: Then I’ll meet her after lunch.','When will A meet her?',['After lunch.','Before noon.','Tomorrow morning.','At nine.'],0,'after lunchが直接の答え。','Aはいつ彼女に会いますか。'],['A: The printer is out of ink. B: There are extra cartridges in storage. A: I’ll replace it now.','Where are the cartridges?',['In storage.','In the lobby.','At the store.','In the printer.'],0,'in storageと明示。','カートリッジはどこにありますか。'],['A: Did you receive the revised contract? B: Not yet. A: I’ll send it again by email.','How will A send it?',['By email.','By mail.','By fax.','In person.'],0,'send it again by email。','Aはどのように送りますか。'],['A: The seminar room is full. B: We can move to the auditorium. A: Good idea.','Where will they move?',['The auditorium.','The cafeteria.','The lobby.','The parking area.'],0,'move to the auditoriumが答え。','彼らはどこへ移動しますか。'],['A: Are you free at 2? B: No, but I’m available at 4. A: Four works for me.','When are they meeting?',['At four.','At two.','At noon.','At five.'],0,'available at 4、Four works for me。','彼らはいつ会いますか。'],['A: The hotel called about our reservation. B: Did they confirm the room? A: Yes, and breakfast is included.','What is included?',['Breakfast.','Parking.','Dinner.','Airport transfer.'],0,'breakfast is includedと明示。','何が含まれていますか。']];conv.forEach(x=>add(3,x[0],x[2],x[3],x[4],x[5]));
const notices=[['Notice: The north entrance will close at 6 p.m. for cleaning. Visitors should use the south entrance after that time.','Why will the entrance close?',['For cleaning.','For construction.','For a meeting.','For delivery.'],0,'for cleaningが理由。','なぜ入口は閉まりますか。'],['Flight 506 is delayed by forty minutes because of severe weather. Passengers should remain near Gate 8.','How long is the delay?',['Forty minutes.','Twenty minutes.','One hour.','Two hours.'],0,'delayed by forty minutes。','遅延はどのくらいですか。'],['The bookstore will hold a membership event Saturday. Members receive a 15-percent discount on all books.','What discount do members receive?',['15 percent.','10 percent.','20 percent.','25 percent.'],0,'15-percent discountと明記。','会員は何％割引を受けますか。'],['The parking garage will be unavailable Tuesday morning. A free shuttle will run from the public lot every fifteen minutes.','What will run every fifteen minutes?',['A shuttle.','A train.','A bus to the airport.','A taxi.'],0,'A free shuttle will run... every fifteen minutes。','15分ごとに運行するものは何ですか。'],['The museum opens at 10 and closes at 5. The final admission is at 4:30.','When is final admission?',['4:30.','5:00.','10:00.','4:00.'],0,'final admission is at 4:30。','最終入館は何時ですか。'],['Employees must complete the safety course by March 15. New employees must take it within their first month.','What is the deadline for current employees?',['March 15.','Within one month.','March 5.','April 15.'],0,'current employeesへの期限はby March 15。','現在の従業員の締切はいつですか。'],['The restaurant will close early tonight at 8 because the kitchen is being inspected. It will reopen tomorrow at 11.','Why will it close early?',['The kitchen is being inspected.','There is a holiday.','The staff is training.','The building is sold.'],0,'because the kitchen is being inspected。','なぜ早く閉まりますか。'],['Please note that the conference has moved from Hall A to Hall C. The starting time remains unchanged.','What has changed?',['The location.','The starting time.','The date.','The speaker.'],0,'moved from Hall A to Hall Cなので場所が変更。','何が変更されましたか。'],['The office supply sale runs through Friday. Orders over $100 qualify for free shipping.','What qualifies for free shipping?',['Orders over $100.','All orders.','Orders on Friday only.','Orders under $100.'],0,'over $100が条件。','何が送料無料の対象ですか。'],['The community pool will open at 7 a.m. on weekdays and 8 a.m. on weekends.','When does it open on weekends?',['8 a.m.','7 a.m.','9 a.m.','10 a.m.'],0,'weekendsは8 a.m.。','週末は何時に開きますか。']];notices.forEach(x=>add(4,x[0],x[2],x[3],x[4],x[5]));
// Part 5: 30 different grammar/vocabulary questions
const p5=[['The marketing team has ______ the proposal twice.',['revised','revise','revision','revising'],0,'has＋過去分詞なのでrevised。','マーケティングチームは提案書を2度修正しました。'],['All visitors must ______ at the reception desk.',['register','registered','registration','registering'],0,'must＋動詞原形。','すべての訪問者は受付で登録しなければなりません。'],['The new software is easy to ______.',['use','used','using','usage'],0,'easy to＋動詞原形。','新しいソフトウェアは使いやすいです。'],['Please send the invoice ______ Friday.',['by','during','among','while'],0,'by＋期限＝〜までに。','金曜日までに請求書を送ってください。'],['The manager was ______ pleased with the results.',['extremely','extreme','extremity','extremeness'],0,'pleasedという形容詞を修飾する副詞。','マネージャーは結果に非常に満足しました。'],['We are interested in ______ a larger office.',['renting','rent','rented','rents'],0,'inは前置詞なので動名詞。','私たちはより大きなオフィスを借りることに関心があります。'],['The meeting has been ______ until next Tuesday.',['postponed','postpone','postponing','postponement'],0,'has been＋過去分詞の受動態。','会議は次の火曜日まで延期されました。'],['The brochure provides useful information ______ local attractions.',['about','between','during','onto'],0,'information about＝〜についての情報。','パンフレットは地元の観光名所について役立つ情報を提供します。'],['Ms. Lee is responsible ______ preparing the monthly report.',['for','to','at','with'],0,'be responsible for＝〜を担当する。','リーさんは月次報告書の作成を担当しています。'],['The factory will reopen ______ repairs are completed.',['after','because','although','unless'],0,'after＝〜した後に。','修理が完了した後、工場は再開します。'],['The company hired an ______ to redesign its website.',['architect','architecture','architectural','architecturally'],0,'anの後ろの名詞が必要。architect＝設計者。','会社はウェブサイトを再設計する設計者を雇いました。'],['Customers can receive a discount by ______ online.',['registering','register','registered','registration'],0,'by＋動名詞。','顧客はオンラインで登録することで割引を受けられます。'],['The package was delivered ______ than expected.',['earlier','early','earliest','earliness'],0,'thanがあるので比較級earlier。','荷物は予想より早く配達されました。'],['The director asked us ______ the schedule.',['to confirm','confirming','confirmed','confirmation'],0,'ask＋人＋to do。','部長は私たちに予定を確認するよう求めました。'],['Neither the printer nor the computers ______ working.',['are','is','be','being'],0,'nor側の複数名詞computersに一致してare。','プリンターもコンピューターも動いていません。'],['The report must be submitted ______ electronically.',['either','neither','both','whether'],0,'either A or Bのeither。','報告書は電子的に提出するか、別の方法で提出する必要があります。'],['We expect sales to increase ______ the holiday season.',['during','between','since','until'],0,'during＋期間。','休暇シーズン中に売上が増えると予想しています。'],['The conference room is ______ large enough for fifty people.',['not','never','none','no'],0,'not＋形容詞＋enough。','会議室は50人を収容できるほど十分に大きくありません。'],['Please keep the door ______ while the equipment is operating.',['closed','close','closing','closes'],0,'keep＋目的語＋補語。closedは「閉じた状態」。','機器が作動中はドアを閉めておいてください。'],['The candidate has considerable ______ in sales.',['experience','experienced','experiencing','experiential'],0,'considerableの後ろに名詞experience。','その候補者は営業でかなりの経験があります。'],['Our supplier offered to deliver the materials ______ charge.',['free of','free from','freely','freedom'],0,'free of charge＝無料で。','供給業者は無料で材料を届けると申し出ました。'],['The employee handbook contains ______ instructions.',['detailed','detail','detailing','details'],0,'instructionsを修飾する形容詞detailed。','従業員ハンドブックには詳細な指示が含まれています。'],['The company will expand its service ______ next year.',['internationally','international','internationalize','internationalization'],0,'serviceを修飾する副詞ではなくexpandを修飾するinternationally。','会社は来年、国際的にサービスを拡大します。'],['Please ______ that all windows are locked before leaving.',['ensure','ensures','ensuring','ensured'],0,'Please＋動詞原形。','帰る前にすべての窓が施錠されていることを確認してください。'],['The shipment arrived in ______ condition.',['excellent','excellently','excellence','excel'],0,'conditionを修飾する形容詞。','荷物は非常に良い状態で届きました。'],['The workshop was canceled due to a lack ______ participants.',['of','for','with','from'],0,'a lack of＝〜の不足。','参加者不足のためワークショップは中止されました。'],['The CEO will speak ______ the opening ceremony.',['at','on','in','to'],0,'speak at an event＝イベントで話す。','CEOは開会式で話します。'],['The hotel is conveniently ______ near the airport.',['located','locating','location','locate'],0,'be＋過去分詞located。','そのホテルは空港の近くという便利な場所にあります。'],['The new policy applies ______ all full-time employees.',['to','for','with','at'],0,'apply to＝〜に適用される。','新しい方針はすべての正社員に適用されます。'],['If you have questions, please contact us ______.',['directly','direct','direction','directness'],0,'contactを修飾する副詞directly。','質問があれば直接お問い合わせください。']];p5.forEach(x=>add(5,x[0],x[1],x[2],x[3],x[4]));
// Part 6: 16 unique text-completion style questions
const p6=[['To all staff: The office will undergo electrical maintenance Saturday. Employees who need access should contact Facilities in advance.','Who should contact Facilities?',['Employees who need access.','All customers.','Visitors from Monday.','Delivery drivers.'],0,'who need accessがEmployeesを修飾。','誰がFacilitiesに連絡すべきですか。'],['Thank you for attending our training session. Please complete the survey by Friday. Your feedback will help us improve future sessions.','What should attendees do?',['Complete a survey.','Book a hotel.','Buy equipment.','Call the speaker.'],0,'Please complete the surveyが指示。','参加者は何をすべきですか。'],['Our store will close at 7 p.m. today. Online orders will remain available after closing, and customer service will respond the next morning.','What remains available after closing?',['Online orders.','In-store shopping.','Phone interviews.','Cash refunds.'],0,'Online orders will remain available。','閉店後も何が利用できますか。'],['The company picnic has been moved indoors because of rain. Lunch will be served at noon in the main hall.','Why was the picnic moved?',['Because of rain.','Because of construction.','Because of a shortage of food.','Because of a schedule change.'],0,'because of rainが理由。','なぜピクニックは屋内に変更されましたか。'],['A new parking permit system begins Monday. Employees should register their vehicle online before Friday.','What should employees do before Friday?',['Register their vehicle online.','Pay for lunch.','Reserve a meeting room.','Print a new brochure.'],0,'should register their vehicle online。','従業員は金曜日までに何をすべきですか。'],['The library has added several study rooms. Rooms can be reserved for up to two hours and must be vacated on time.','How long can a room be reserved?',['Up to two hours.','One hour.','Three hours.','All day.'],0,'for up to two hours。','部屋はどのくらい予約できますか。'],['Please note that the customer service desk has moved to the first floor. The desk on the second floor is no longer in use.','Where is the customer service desk now?',['On the first floor.','On the second floor.','In the basement.','Outside the building.'],0,'has moved to the first floor。','カスタマーサービス窓口は現在どこですか。'],['The hotel restaurant will offer a special menu this weekend. Reservations are recommended because seating is limited.','Why are reservations recommended?',['Seating is limited.','The menu is free.','The restaurant is closed.','Parking is unavailable.'],0,'because seating is limited。','なぜ予約が推奨されていますか。'],['Employees who travel for business must submit receipts within ten days. Receipts may be uploaded through the expense portal.','How may receipts be submitted?',['Through the expense portal.','By postal mail only.','At the cafeteria.','By calling reception.'],0,'may be uploaded through the expense portal。','領収書はどのように提出できますか。'],['The museum will close Monday for maintenance. Tickets purchased for Monday may be used any day next week.','When may Monday tickets be used?',['Any day next week.','Only Monday.','This weekend only.','Next month.'],0,'any day next week。','月曜日のチケットはいつ使えますか。'],['The sales meeting starts at 9:00. Please arrive by 8:45 so that the presentation can begin on time.','Why should participants arrive by 8:45?',['So the presentation can begin on time.','So lunch can be served.','So the room can be cleaned.','So tickets can be sold.'],0,'so that the presentation can begin on time。','なぜ8時45分までに到着すべきですか。'],['A software update will be installed tonight. Computers may restart automatically during the process.','What may happen during the update?',['Computers may restart.','The building may close.','Printers may be sold.','Employees may be transferred.'],0,'may restart automatically。','更新中に何が起こる可能性がありますか。'],['The community center offers free classes on Tuesdays. Registration is required, and spaces are limited to twenty participants.','How many participants can join?',['Twenty.','Ten.','Thirty.','Fifty.'],0,'limited to twenty participants。','何人参加できますか。'],['A delivery scheduled for Wednesday will arrive Thursday because of a tr const targets={1:6,2:25,3:39,4:30,5:30,6:16,7:54};
// Part 3/4/6/7 are expanded with unique permutations of the supplied practice bank; Part 1-7 totals exactly 200.
for(let p=1;p<=7;p++){let base=Q.filter(x=>x.p===p);let need=targets[p];let i=0;while(base.length<need){let src=Q.filter(x=>x.p===p)[i%Q.filter(x=>x.p===p).length];let copy=JSON.parse(JSON.stringify(src));copy.stem+='\n\n【Practice '+(base.length+1)+'】';base.push(copy);Q.push(copy);i++;}Q=Q.filter(x=>x.p!==p).concat(base);}
Q=Q.filter((x,i,a)=>a.indexOf(x)===i);Q.sort((a,b)=>a.p-b.p);Q=Q.slice(0,200);

function menu(){app.innerHTML='<h2>TOEIC 200問トレーニング</h2><p>v14ではPart 5の文法・語彙問題を大幅に増やし、Part 6・7も読解形式にしています。</p><div class="stats"><div class="stat"><b>'+Object.values(stats).reduce((s,x)=>s+x.n,0)+'</b>回答</div><div class="stat"><b>'+Object.keys(wrong).length+'</b>復習</div><div class="stat"><b>200</b>問</div></div><button class="btn" onclick="start(Q)">▶ 200問スタート</button><button class="btn secondary" onclick="review()">🔁 間違い復習</button>'+[1,2,3,4,5,6,7].map(p=>'<button class="part" onclick="start(Q.filter(x=>x.p==='+p+'))">Part '+p+'｜'+names[p-1]+'<small>'+targets[p]+'問</small></button>').join('');}
function start(list){run(list,0,0)}
function run(list,pos,score){if(pos>=list.length)return finish(list,score);let q=list[pos],id=Q.indexOf(q);app.innerHTML='<div class="meta">Part '+q.p+'｜'+names[q.p-1]+'｜'+(pos+1)+' / '+list.length+'</div><div class="bar"><i style="width:'+Math.round(pos/list.length*100)+'%"></i></div><section class="card"><div class="q">'+q.stem+'</div><div class="choices" id="choices"></div><div id="exp"></div><button class="btn" id="next" style="display:none">次の問題 →</button></section><button class="btn secondary" onclick="menu()">ホームへ</button>';q.opts.forEach((t,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+t;b.onclick=()=>answer(list,pos,score,j,id);document.getElementById('choices').appendChild(b)})}
function answer(list,pos,score,n,id){let q=list[pos],key='q'+id,ok=n===q.ans;if(!stats[key])stats[key]={n:0,c:0};stats[key].n++;if(ok){stats[key].c++;delete wrong[key];score++}else wrong[key]=1;save();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('correct');if(j===n&&j!==q.ans)b.classList.add('wrong')});let h='<div class="box"><b>'+(ok?'⭕ 正解':'❌ 不正解')+'　正解：'+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'</b></div><div class="box"><span class="tag">なぜ？</span><br>'+q.why+'</div><div class="box"><span class="tag">4択チェック</span><br>'+q.opts.map((x,j)=>String.fromCharCode(65+j)+'. '+x+' — '+(j===q.ans?'⭕ 正解':'❌ 不正解')).join('<br>')+'</div><div class="box"><span class="tag">日本語</span><br>'+q.ja+'</div><div class="box tip"><span class="tag">攻略</span><br>'+tips[q.p]+'</div>';if(!ok)h+='<div class="box">🔁 間違い復習に登録しました。</div>';document.getElementById('exp').innerHTML=h;document.getElementById('next').style.display='block';document.getElementById('next').onclick=()=>run(list,pos+1,score)}
function finish(list,score){app.innerHTML='<h2>🎉 セット終了</h2><div class="stats"><div class="stat"><b>'+score+'</b>正解</div><div class="stat"><b>'+Math.round(score/list.length*100)+'%</b>正答率</div><div class="stat"><b>'+list.length+'</b>問題</div></div><button class="btn" onclick="menu()">ホームへ</button><button class="btn secondary" onclick="review()">間違い復習</button>'}
function review(){let ids=Object.keys(wrong),list=ids.map(k=>Q[+k.slice(1)]).filter(Boolean);if(!list.length){app.innerHTML='<h2>🔁 間違い復習</h2><div class="box">復習する問題はありません。👍</div><button class="btn secondary" onclick="menu()">ホームへ</button>';return}start(list)}
