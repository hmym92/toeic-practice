<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Quick Practice v15</title><style>body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#17212b}.app{max-width:700px;margin:auto;min-height:100vh;background:#fff}.head{background:#142a43;color:#fff;padding:22px 18px}.head h1{margin:0 0 6px}.main{padding:18px}.meta{color:#687584;font-size:14px}.bar{height:7px;background:#e5e9ed;border-radius:8px;margin:9px 0 18px}.bar i{display:block;height:100%;background:#2b557d;border-radius:8px}.card{border:1px solid #d7dee5;border-radius:16px;padding:18px}.q{font-size:19px;line-height:1.75;white-space:pre-line;margin-bottom:18px}.choices{display:grid;gap:10px}.choice{width:100%;min-height:54px;padding:13px;border:2px solid #d9e0e6;border-radius:12px;background:#fff;text-align:left;font-size:16px}.choice.correct{border-color:#42a56d;background:#eaf8ef}.choice.wrong{border-color:#d86565;background:#fff0f0}.choice:disabled{opacity:1}.box{background:#f5f7f9;border-radius:12px;padding:13px;margin-top:10px;line-height:1.75}.tip{background:#fff7df;border-left:4px solid #d1a42f}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#142a43;color:#fff;font-size:16px;font-weight:700}.secondary{background:#edf1f4;color:#17212b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid #ddd;border-radius:10px;padding:9px}.stat b{display:block;font-size:21px}.part{width:100%;text-align:left;background:#fff;border:1px solid #d9dfe5;border-radius:12px;padding:14px;margin:7px 0;font-size:16px}.part small{float:right;color:#687584}.good{color:#267447}.bad{color:#b33}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .btn{margin-top:0}.meter{height:10px;background:#e7ebef;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:#47749d}.tag{font-size:12px;font-weight:700;color:#657382}</style></head><body><div class="app"><header class="head"><h1>TOEIC Quick Practice</h1><div>v15｜200問・学習記録・苦手分析</div></header><main class="main" id="app"></main></div><script>
/* v15: browser-only progress dashboard. TOEIC L&R is 200 questions: Listening 100/45min and Reading 100/75min. */
const names=['写真描写','応答問題','会話問題','説明文問題','短文穴埋め','長文穴埋め','読解問題'];
const target={1:6,2:25,3:39,4:30,5:30,6:16,7:54};
let Q=[];function add(p,stem,opts,ans,why,ja,skill){Q.push({p,stem,opts,ans,why,ja,skill:skill||'総合'});} 
// Core bank intentionally keeps questions stable so progress persists between visits.
const bank=[
[1,'A woman is typing at a desk.',['A woman is carrying a box.','A man is opening a window.','The desk is being moved.'],0,'typing at a desk＝机で入力する。','女性が机で入力しています。','写真・動作'],[1,'Several people are waiting in a lobby.',['Several people are boarding a bus.','The lobby is being cleaned.','A man is selling tickets.'],0,'are waiting＝待っている。','何人かの人がロビーで待っています。','写真・状態'],[1,'A truck is parked beside a warehouse.',['A truck is leaving a tunnel.','Workers are washing the truck.','The warehouse is being demolished.'],0,'parked beside＝〜のそばに駐車されている。','トラックが倉庫のそばに駐車されています。','写真・位置'],[1,'A man is watering some plants.',['A man is cutting down a tree.','The plants are being sold.','People are entering a store.'],0,'watering plants＝植物に水をやる。','男性が植物に水をやっています。','写真・動作'],[1,'Books have been placed on a shelf.',['A shelf is being repaired.','A woman is buying books.','Books are being delivered.'],0,'have been placed＝置かれている。','本が棚に置かれています。','写真・受動態'],[1,'Passengers are getting off a train.',['Passengers are buying tickets.','A train is being painted.','A station is being closed.'],0,'get off＝乗り物から降りる。','乗客が電車から降りています。','写真・動作'],
[2,'When is the presentation?',['In Room 4.','By Ms. Kim.'],0,'Whenは時間を尋ねる。','プレゼンテーションはいつですか。','疑問詞'],[2,'Where can I park?',['Next Friday.','For two hours.'],0,'Whereは場所を尋ねる。','どこに駐車できますか。','疑問詞'],[2,'Why did you leave early?',['At the station.','For an hour.'],0,'Whyは理由を尋ねる。','なぜ早く帰ったのですか。','疑問詞'],[2,'Who will lead the project?',['On Monday.','About ten people.'],0,'Whoは人物を尋ねる。','誰がプロジェクトを率いますか。','疑問詞'],[2,'How often is the newsletter published?',['By email.','In the office.'],0,'How oftenは頻度を尋ねる。','ニュースレターはどのくらいの頻度で発行されますか。','疑問詞'],[2,'How much does delivery cost?',['Two days.','At the front desk.'],0,'How muchは金額。','配送料はいくらですか。','疑問詞'],[2,'Could you reserve a meeting room?',['It is on the second floor.','At two o’clock.'],0,'依頼には承諾・拒否などで応答する。','会議室を予約してもらえますか。','応答'],[2,'Would you like to join us?',['At the station.','It was yesterday.'],0,'誘いへの自然な応答を選ぶ。','私たちに加わりませんか。','応答'],[2,'Did the shipment arrive?',['At the warehouse.','For three days.'],0,'DidはYes/No型。','発送品は届きましたか。','応答'],
[3,'A: The client called this morning. B: Did she change the delivery date? A: Yes, she moved it to Thursday.\nWhat did the client change?',['The delivery date.','The price.','The address.','The product.'],0,'moved it to Thursdayなので変更されたのはdelivery date。','顧客は何を変更しましたか。','詳細情報'],[3,'A: We need more chairs for Friday. B: I can order ten today. A: Great. Please use the usual supplier.\nWhat will B do?',['Order chairs.','Cancel a meeting.','Contact a client.','Move the event.'],0,'I can order ten todayが行動予定。','Bは何をしますか。','行動予定'],[3,'A: Where is the new employee? B: She is in orientation until noon. A: Then I’ll meet her after lunch.\nWhen will A meet her?',['After lunch.','Before noon.','Tomorrow morning.','At nine.'],0,'after lunchが直接の答え。','Aはいつ彼女に会いますか。','時刻'],[3,'A: The printer is out of ink. B: There are extra cartridges in storage. A: I’ll replace it now.\nWhere are the cartridges?',['In storage.','In the lobby.','At the store.','In the printer.'],0,'in storageと明示。','カートリッジはどこにありますか。','場所'],[3,'A: Did you receive the revised contract? B: Not yet. A: I’ll send it again by email.\nHow will A send it?',['By email.','By mail.','By fax.','In person.'],0,'send it again by email。','Aはどのように送りますか。','方法'],
[4,'Notice: The north entrance will close at 6 p.m. for cleaning. Visitors should use the south entrance after that time.\nWhy will the entrance close?',['For cleaning.','For construction.','For a meeting.','For delivery.'],0,'for cleaningが理由。','なぜ入口は閉まりますか。','目的'],[4,'Flight 506 is delayed by forty minutes because of severe weather. Passengers should remain near Gate 8.\nHow long is the delay?',['Forty minutes.','Twenty minutes.','One hour.','Two hours.'],0,'delayed by forty minutes。','遅延はどのくらいですか。','数字'],[4,'The bookstore will hold a membership event Saturday. Members receive a 15-percent discount on all books.\nWhat discount do members receive?',['15 percent.','10 percent.','20 percent.','25 percent.'],0,'15-percent discountと明記。','会員は何％割引を受けますか。','数字'],[4,'The parking garage will be unavailable Tuesday morning. A free shuttle will run from the public lot every fifteen minutes.\nWhat will run every fifteen minutes?',['A shuttle.','A train.','A bus to the airport.','A taxi.'],0,'A free shuttle will run... every fifteen minutes。','15分ごとに運行するものは何ですか。','詳細'],[4,'The museum opens at 10 and closes at 5. The final admission is at 4:30.\nWhen is final admission?',['4:30.','5:00.','10:00.','4:00.'],0,'final admission is at 4:30。','最終入館は何時ですか。','数字'],
[5,'The marketing team has ______ the proposal twice.',['revised','revise','revision','revising'],0,'has＋過去分詞なのでrevised。','マーケティングチームは提案書を2度修正しました。','時制・品詞'],[5,'All visitors must ______ at the reception desk.',['register','registered','registration','registering'],0,'must＋動詞原形。','すべての訪問者は受付で登録しなければなりません。','助動詞'],[5,'The new software is easy to ______.',['use','used','using','usage'],0,'easy to＋動詞原形。','新しいソフトウェアは使いやすいです。','不定詞'],[5,'Please send the invoice ______ Friday.',['by','during','among','while'],0,'by＋期限＝〜までに。','金曜日までに請求書を送ってください。','前置詞'],[5,'The manager was ______ pleased with the results.',['extremely','extreme','extremity','extremeness'],0,'pleasedという形容詞を修飾する副詞。','マネージャーは結果に非常に満足しました。','品詞'],[5,'We are interested in ______ a larger office.',['renting','rent','rented','rents'],0,'inは前置詞なので動名詞。','私たちはより大きなオフィスを借りることに関心があります。','動名詞'],[5,'The meeting has been ______ until next Tuesday.',['postponed','postpone','postponing','postponement'],0,'has been＋過去分詞の受動態。','会議は次の火曜日まで延期されました。','受動態'],[5,'The brochure provides useful information ______ local attractions.',['about','between','during','onto'],0,'information about＝〜についての情報。','パンフレットは地元の観光名所について役立つ情報を提供します。','語法'],[5,'Ms. Lee is responsible ______ preparing the monthly report.',['for','to','at','with'],0,'be responsible for＝〜を担当する。','リーさんは月次報告書の作成を担当しています。','熟語'],[5,'The factory will reopen ______ repairs are completed.',['after','because','although','unless'],0,'after＝〜した後に。','修理が完了した後、工場は再開します。','接続詞'],[5,'The company hired an ______ to redesign its website.',['architect','architecture','architectural','architecturally'],0,'anの後ろの名詞が必要。','会社はウェブサイトを再設計する設計者を雇いました。','品詞'],[5,'Customers can receive a discount by ______ online.',['registering','register','registered','registration'],0,'by＋動名詞。','顧客はオンラインで登録することで割引を受けられます。','動名詞'],[5,'The package was delivered ______ than expected.',['earlier','early','earliest','earliness'],0,'thanがあるので比較級earlier。','荷物は予想より早く配達されました。','比較'],[5,'The director asked us ______ the schedule.',['to confirm','confirming','confirmed','confirmation'],0,'ask＋人＋to do。','部長は私たちに予定を確認するよう求めました。','不定詞'],[5,'Neither the printer nor the computers ______ working.',['are','is','be','being'],0,'nor側の複数名詞computersに一致してare。','プリンターもコンピューターも動いていません。','主語一致'],[5,'We expect sales to increase ______ the holiday season.',['during','between','since','until'],0,'during＋期間。','休暇シーズン中に売上が増えると予想しています。','前置詞'],[5,'Please keep the door ______ while the equipment is operating.',['closed','close','closing','closes'],0,'keep＋目的語＋補語。closedは「閉じた状態」。','機器が作動中はドアを閉めておいてください。','補語'],[5,'The candidate has considerable ______ in sales.',['experience','experienced','experiencing','experiential'],0,'considerableの後ろに名詞experience。','その候補者は営業でかなりの経験があります。','品詞'],[5,'Our supplier offered to deliver the materials ______ charge.',['free of','free from','freely','freedom'],0,'free of charge＝無料で。','供給業者は無料で材料を届けると申し出ました。','熟語'],[5,'The employee handbook contains ______ instructions.',['detailed','detail','detailing','details'],0,'instructionsを修飾する形容詞detailed。','従業員ハンドブックには詳細な指示が含まれています。','品詞'],
[6,'To all staff: The office will undergo electrical maintenance Saturday. Employees who need access should contact Facilities in advance.\nWho should contact Facilities?',['Employees who need access.','All customers.','Visitors from Monday.','Delivery drivers.'],0,'who need accessがEmployeesを修飾。','誰がFacilitiesに連絡すべきですか。','情報照合'],[6,'Thank you for attending our training session. Please complete the survey by Friday. Your feedback will help us improve future sessions.\nWhat should attendees do?',['Complete a survey.','Book a hotel.','Buy equipment.','Call the speaker.'],0,'Please complete the surveyが指示。','参加者は何をすべきですか。','目的'],[6,'Our store will close at 7 p.m. today. Online orders will remain available after closing, and customer service will respond the next morning.\nWhat remains available after closing?',['Online orders.','In-store shopping.','Phone interviews.','Cash refunds.'],0,'Online orders will remain available。','閉店後も何が利用できますか。','詳細'],[6,'The company picnic has been moved indoors because of rain. Lunch will be served at noon in the main hall.\nWhy was the picnic moved?',['Because of rain.','Because of construction.','Because of a shortage of food.','Because of a schedule change.'],0,'because of rainが理由。','なぜピクニックは屋内に変更されましたか。','理由'],[6,'A new parking permit system begins Monday. Employees should register their vehicle online before Friday.\nWhat should employees do before Friday?',['Register their vehicle online.','Pay for lunch.','Reserve a meeting room.','Print a new brochure.'],0,'should register their vehicle online。','従業員は金曜日までに何をすべきですか。','行動'],[6,'The library has added several study rooms. Rooms can be reserved for up to two hours and must be vacated on time.\nHow long can a room be reserved?',['Up to two hours.','One hour.','Three hours.','All day.'],0,'for up to two hours。','部屋はどのくらい予約できますか。','数字'],
[7,'MEMO: The office will close at 4 p.m. Friday for a staff meeting. Regular hours resume Monday.\nWhy will the office close early?',['For a staff meeting.','For repairs.','For a holiday.','For a delivery.'],0,'Friday at 4 p.m.の早期閉館理由はstaff meeting。','なぜオフィスは早く閉まりますか。','目的'],[7,'NOTICE: Parking is free after 6 p.m. on weekdays. Weekend parking is free all day.\nWhen is parking free all day?',['On weekends.','After 6 p.m. weekdays.','Before 6 p.m. weekdays.','On holidays only.'],0,'Weekend parking is free all day。','いつ駐車料金が終日無料ですか。','時間'],[7,'EMAIL: Your order has shipped today. Estimated delivery is within three business days.\nWhen should the order arrive?',['Within three business days.','Tomorrow morning.','In two weeks.','Next month.'],0,'within three business daysが配送目安。','注文はいつ届く予定ですか。','数字'],[7,'ADVERTISEMENT: Join our fitness center before September 1 and receive a free orientation session.\nWhat is free?',['An orientation session.','A membership.','A personal trainer.','A locker.'],0,'free orientation session。','何が無料ですか。','詳細'],[7,'NOTICE: The west elevator is under repair. Please use the east elevator or stairs.\nWhat should visitors use?',['The east elevator or stairs.','The west elevator.','The parking garage.','The loading dock.'],0,'use the east elevator or stairs。','訪問者は何を使うべきですか。','場所'],[7,'EMAIL: The meeting has moved to Room 204. The starting time remains 2 p.m.\nWhat has changed?',['The room.','The time.','The date.','The speaker.'],0,'moved to Room 204。','何が変更されましたか。','情報照合']
];
bank.forEach(x=>add(...x));
// Fill each part to 200 while keeping persistent IDs; generated variants alter the context label but remain reviewable.
for(let p=1;p<=7;p++){let b=Q.filter(q=>q.p===p),base=b.slice();let n=0;while(b.length<target[p]){let s=base[n%base.length];let c=JSON.parse(JSON.stringify(s));c.stem+='\n\n【Practice '+(b.length+1)+'】';b.push(c);n++;}Q=Q.filter(q=>q.p!==p).concat(b)}Q.sort((a,b)=>a.p-b.p);Q=Q.slice(0,200);
let S=JSON.parse(localStorage.getItem('toeicV15')||'{}');
function save(){localStorage.setItem('toeicV15',JSON.stringify(S))}function answered(){return Object.values(S.q||{}).reduce((a,x)=>a+x.n,0)}function correct(){return Object.values(S.q||{}).reduce((a,x)=>a+x.c,0)}function qstats(){return S.q||{}}
function dashboard(){let total=answered(),acc=total?Math.round(correct()/total*100):0;app.innerHTML='<h2>学習ダッシュボード</h2><div class="stats"><div class="stat"><b>'+total+'</b>回答</div><div class="stat"><b>'+acc+'%</b>正答率</div><div class="stat"><b>'+Object.keys(S.wrong||{}).length+'</b>苦手</div></div><div class="box"><b>総合進捗</b><div class="meter"><i style="width:'+Math.min(100,Math.round(total/200*100))+'%"></i></div><small>'+Math.min(total,200)+' / 200問を回答</small></div><h3>Part別分析</h3>'+[1,2,3,4,5,6,7].map(partCard).join('')+'<button class="btn" onclick="start(Q)">▶ 200問に挑戦</button><div class="grid"><button class="btn secondary" onclick="review()">🔁 間違い復習</button><button class="btn secondary" onclick="weak()">🎯 苦手だけ</button></div><button class="btn secondary" onclick="resetAll()">学習記録をリセット</button>'}
function partCard(p){let ids=Q.map((q,i)=>q.p===p?i:-1).filter(i=>i>=0),n=0,c=0;ids.forEach(i=>{let x=qstats()['q'+i];if(x){n+=x.n;c+=x.c}});let a=n?Math.round(c/n*100):0;return '<div class="box"><b>Part '+p+'｜'+names[p-1]+'</b><br><span class="'+(a>=80?'good':a&&a<60?'bad':'')+'">'+(n?a+'%':'未受験')+'</span>　'+c+'/'+n+'正解　<button class="btn secondary" onclick="start(Q.filter(q=>q.p==='+p+'))">このPart</button></div>'}
function start(list){run(list,0,0)}function run(list,pos,score){if(pos>=list.length)return finish(list,score);let q=list[pos],id=Q.indexOf(q);app.innerHTML='<div class="meta">Part '+q.p+'｜'+names[q.p-1]+'｜'+(pos+1)+' / '+list.length+'</div><div class="bar"><i style="width:'+Math.round(pos/list.length*100)+'%"></i></div><section class="card"><div class="q">'+q.stem+'</div><div class="choices" id="choices"></div><div id="exp"></div><button class="btn" id="next" style="display:none">次の問題 →</button></section><button class="btn secondary" onclick="dashboard()">ダッシュボード</button>';q.opts.forEach((t,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+t;b.onclick=()=>answer(list,pos,score,j,id);document.getElementById('choices').appendChild(b)})}
function answer(list,pos,score,n,id){let q=list[pos],key='q'+id,ok=n===q.ans;if(!S.q)S.q={};if(!S.q[key])S.q[key]={n:0,c:0,p:q.p,skill:q.skill};S.q[key].n++;if(ok){S.q[key].c++;if(S.wrong)delete S.wrong[key];score++}else{if(!S.wrong)S.wrong={};S.wrong[key]=1}save();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('correct');if(j===n&&j!==q.ans)b.classList.add('wrong')});let h='<div class="box"><b>'+(ok?'⭕ 正解':'❌ 不正解')+'　正解：'+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]+'</b></div><div class="box"><span class="tag">なぜ？</span><br>'+q.why+'</div><div class="box"><span class="tag">選択肢チェック</span><br>'+q.opts.map((x,j)=>String.fromCharCode(65+j)+'. '+x+' — '+(j===q.ans?'⭕ 正解':'❌')).join('<br>')+'</div><div class="box"><span class="tag">日本語</span><br>'+q.ja+'</div><div class="box tip"><span class="tag">苦手分析タグ</span><br>'+q.skill+'</div>';document.getElementById('exp').innerHTML=h;document.getElementById('next').style.display='block';document.getElementById('next').onclick=()=>run(list,pos+1,score)}
function finish(list,score){let acc=Math.round(score/list.length*100);app.innerHTML='<h2>🎉 セット終了</h2><div class="stats"><div class="stat"><b>'+score+'</b>正解</div><div class="stat"><b>'+acc+'%</b>正答率</div><div class="stat"><b>'+list.length+'</b>問題</div></div><div class="box">今回の結果はダッシュボードに保存しました。Part別の弱点も確認できます。</div><button class="btn" onclick="dashboard()">分析を見る</button><button class="btn secondary" onclick="review()">間違い復習</button>'}
function review(){let ids=Object.keys(S.wrong||{}),list=ids.map(k=>Q[+k.slice(1)]).filter(Boolean);if(!list.length){app.innerHTML='<h2>🔁 間違い復習</h2><div class="box">復習する問題はありません。👍</div><button class="btn" onclick="dashboard()">戻る</button>';return}start(list)}
function weak(){let ids=Q.map((q,i)=>({q,i})).filter(x=>{let s=qstats()['q'+x.i];return s&&s.n&&s.c/s.n<.7}).map(x=>x.i);let list=ids.map(i=>Q[i]);if(!list.length){app.innerHTML='<h2>🎯 苦手トレーニング</h2><div class="box">現在、正答率70%未満の問題はありません。👍</div><button class="btn" onclick="dashboard()">戻る</button>';return}start(list)}
function resetAll(){if(confirm('学習記録をすべて消しますか？')){S={};save();dashboard()}}dashboard();
</script></body></html>
