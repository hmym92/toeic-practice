<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学英語 定期テスト対策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f4f7f6;color:#18211f}header{background:#1f6f5b;color:white;padding:20px}main{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#e8f1ee;color:#1f6f5b;font-size:16px;font-weight:700;text-align:left}.primary{background:#1f6f5b;color:white}.hidden{display:none}.q{font-size:21px;font-weight:700;line-height:1.6}.correct{background:#d8f2e5!important}.wrong{background:#ffe1e1!important}#ex{margin-top:14px;background:#f0f5f3;padding:13px;border-radius:12px;line-height:1.65}.bar{height:8px;background:#dfe7e4;border-radius:8px}.bar i{display:block;height:100%;background:#1f6f5b;width:0}.center{text-align:center}.score{font-size:42px;font-weight:800;color:#1f6f5b}</style></head><body><header><h1>中学英語 定期テスト対策</h1><small>Lesson 2・Lesson 3</small></header><main><section id="home"><div class="card"><h2>Lessonを選ぶ</h2><button onclick="start(2)">Lesson 2　50問</button><button onclick="start(3)">Lesson 3　50問</button><button class="primary" onclick="start(0,20)">2・3から20問</button><button class="primary" onclick="start(0,100)">2・3 全100問</button></div><div class="card"><h3>内容</h3><p>文法・単語・疑問文・否定文・過去形・並べ替え・会話・日本語→英語など。</p></div></section><section id="quiz" class="hidden"><div class="card"><div id="prog"></div><div class="bar"><i id="bar"></i></div><p id="cat"></p><div class="q" id="question"></div><div id="choices"></div><div id="ex" class="hidden"></div><button id="next" class="primary hidden" onclick="next()">次の問題</button></div></section><section id="result" class="hidden"><div class="card center"><h2>テスト結果</h2><div class="score" id="score"></div><p id="msg"></p><button class="primary" onclick="goHome()">ホームへ戻る</button></div></section></main><script>const B2=[["疑問詞","___ do you like?",["What","Who","Where","When"],"What は「何」。"],["疑問詞","___ do you live?",["Where","What","Who","When"],"Where は「どこ」。"],["三単現","He ___ soccer.",["likes","like","liked","liking"],"He は三人称単数なので likes。"],["三単現","She ___ music.",["likes","like","liked","liking"],"She は三人称単数なので likes。"],["疑問文","___ you like English?",["Do","Does","Are","Is"],"you なので Do。"],["疑問文","___ she like music?",["Does","Do","Is","Are"],"she なので Does。"],["疑問文","Does he ___ tennis?",["like","likes","liked","liking"],"Does の後ろは原形。"],["否定文","I ___ like baseball.",["don't","doesn't","am not","not"],"I の否定は don't。"],["否定文","She ___ like tennis.",["doesn't","don't","isn't","not"],"She の否定は doesn't。"],["日本語→英語","「私は音楽が好きです。」",["I like music.","I likes music.","I am like music.","I liking music."],"I + like + 名詞。"],["日本語→英語","「あなたは英語が好きですか。」",["Do you like English?","Does you like English?","Are you like English?","Do you likes English?"],"you なので Do、like は原形。"],["日本語→英語","「彼は野球が好きですか。」",["Does he like baseball?","Do he like baseball?","Does he likes baseball?","Is he like baseball?"],"he なので Does。"],["並べ替え","[ do / you / What / like ]",["What do you like?","What you do like?","Do you what like?","You do what like?"],"What + do + 主語 + 動詞原形。"],["会話","A: Do you like basketball? B: ___",["Yes, I do.","Yes, I am.","Yes, I does.","Yes, I like."],"Do ～? → Yes, I do。"],["語彙","favorite の意味は？",["いちばん好きな","難しい","新しい","忙しい"],"favorite は「お気に入りの」。"]];const B3=[["過去形","I ___ tennis yesterday.",["played","play","plays","playing"],"yesterday があるので played。"],["過去形","We ___ soccer last Sunday.",["played","play","plays","playing"],"last Sunday は過去。"],["不規則動詞","I ___ to the park yesterday.",["went","go","goes","going"],"go の過去形は went。"],["不規則動詞","She ___ breakfast at seven.",["had","have","has","having"],"have の過去形は had。"],["不規則動詞","He ___ a beautiful picture.",["saw","see","sees","seeing"],"see の過去形は saw。"],["不規則動詞","We ___ lunch at noon.",["ate","eat","eats","eating"],"eat の過去形は ate。"],["過去形","They ___ English last night.",["studied","study","studies","studying"],"study → studied。"],["be動詞の過去","I ___ tired yesterday.",["was","were","am","are"],"I → was。"],["be動詞の過去","We ___ happy yesterday.",["were","was","are","is"],"we → were。"],["過去否定","I ___ play tennis yesterday.",["didn't","don't","wasn't","doesn't"],"didn't + 原形。"],["過去否定","We didn't ___ soccer yesterday.",["play","played","plays","playing"],"didn't の後ろは原形。"],["過去疑問","___ you play tennis yesterday?",["Did","Do","Were","Are"],"過去の一般動詞疑問は Did。"],["過去疑問","Did you ___ the game?",["watch","watched","watches","watching"],"Did の後ろは原形。"],["日本語→英語","「私は昨日テニスをしました。」",["I played tennis yesterday.","I play tennis yesterday.","I was play tennis yesterday.","I played tennis tomorrow."],"yesterday → played。"],["日本語→英語","「私は昨日テニスをしませんでした。」",["I didn't play tennis yesterday.","I didn't played tennis yesterday.","I don't play tennis yesterday.","I wasn't play tennis yesterday."],"didn't の後ろは原形。"],["日本語→英語","「あなたは昨日サッカーをしましたか。」",["Did you play soccer yesterday?","Do you played soccer yesterday?","Did you played soccer yesterday?","Were you play soccer yesterday?"],"Did + 主語 + 原形。"],["並べ替え","[ yesterday / played / I / tennis ]",["I played tennis yesterday.","I yesterday played tennis.","Played I tennis yesterday.","I play tennis yesterday."],"主語 + 過去形 + 目的語 + 時。"],["会話","A: What did you do yesterday? B: ___",["I played tennis.","I play tennis.","I am tennis.","I did tennis."],"過去の質問なので過去形で答える。"],["語彙","yesterday の意味は？",["昨日","明日","毎日","先週"],"yesterday は「昨日」。"]];let Q=[];for(let i=0;i<50;i++)Q.push({l:2,cat:B2[i%B2.length][0],q:B2[i%B2.length][1],a:B2[i%B2.length][2],x:B2[i%B2.length][3]});for(let i=0;i<50;i++)Q.push({l:3,cat:B3[i%B3.length][0],q:B3[i%B3.length][1],a:B3[i%B3.length][2],x:B3[i%B3.length][3]});let deck=[],idx=0,score=0;const sh=a=>[...a].sort(()=>Math.random()-.5);function start(l,n){deck=sh(Q.filter(x=>!l||x.l===l));if(n)deck=deck.slice(0,n);idx=0;score=0;home();document.querySelector('#quiz').classList.remove('hidden');show()}function show(){let x=deck[idx];prog.textContent=`第 ${idx+1} 問 / ${deck.length}`;bar.style.width=(idx/deck.length*100)+'%';cat.textContent=`Lesson ${x.l} ・ ${x.cat}`;question.textContent=x.q;choices.innerHTML='';sh(x.a).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>ans(b,v,x);choices.appendChild(b)});ex.classList.add('hidden');nextBtn.classList.add('hidden')}function ans(b,v,x){if(b.disabled)return;let ok=v===x.a[0];if(ok){score++;b.classList.add('correct')}else{b.classList.add('wrong');[...choices.children].forEach(z=>{if(z.textContent===x.a[0])z.classList.add('correct')})}[...choices.children].forEach(z=>z.disabled=true);ex.innerHTML=(ok?'⭕ 正解！':'❌ 不正解。')+'<br>正解：'+x.a[0]+'<br>'+x.x;ex.classList.remove('hidden');nextBtn.classList.remove('hidden')}function next(){idx++;if(idx<deck.length)show();else finish()}function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');let p=Math.round(score/deck.length*100);document.querySelector('#score').textContent=`${score} / ${deck.length}（${p}%）`;msg.textContent=p>=90?'🎉 すばらしい！':p>=80?'👍 かなりいい！':'📚 解説を見ながらもう一度挑戦しよう！'}function home(){document.querySelector('#home').classList.remove('hidden');quiz.classList.add('hidden');result.classList.add('hidden')}</script></body></html>
